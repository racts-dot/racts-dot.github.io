<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>June Resale Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F6F7F6; --surface:#FFFFFF; --raised:#FBFBFA;
  --ink:#151A1F; --ink-2:#3E4A50; --muted:#6B7873;
  --line:#DCE0DE; --line-soft:#E9ECEA;
  --amber:#A85B15; --amber-soft:#F3E6D6;
  --gain:#1E6B4C; --loss:#A2302C; --calm:#41606E;
  --focus:#A85B15;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12161A; --surface:#1A1F25; --raised:#20262C;
    --ink:#E7EBE9; --ink-2:#B9C3C1; --muted:#8A9794;
    --line:#2A3138; --line-soft:#232A30;
    --amber:#D9924A; --amber-soft:#3A2C1C;
    --gain:#5CBF92; --loss:#E1736C; --calm:#7FA8B8;
    --focus:#D9924A;
  }
}
:root[data-theme="dark"]{
  --ground:#12161A; --surface:#1A1F25; --raised:#20262C;
  --ink:#E7EBE9; --ink-2:#B9C3C1; --muted:#8A9794;
  --line:#2A3138; --line-soft:#232A30;
  --amber:#D9924A; --amber-soft:#3A2C1C;
  --gain:#5CBF92; --loss:#E1736C; --calm:#7FA8B8;
  --focus:#D9924A;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:920px; margin:0 auto; padding:20px 16px 64px}

/* ---- masthead ---- */
.top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;
     padding-bottom:14px; border-bottom:2px solid var(--ink)}
h1{font-size:23px; font-weight:600; letter-spacing:-.015em; margin:0; text-wrap:balance}
.sub{font-family:var(--mono); font-size:11.5px; color:var(--muted); letter-spacing:.02em}
.feed{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono);
      font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.dot{width:7px; height:7px; border-radius:50%; background:var(--muted); flex:none}
.feed[data-state="live"] .dot{background:var(--gain)}
.feed[data-state="stale"] .dot{background:var(--amber)}
.feed[data-state="off"] .dot{background:var(--muted)}

/* ---- the three money truths ---- */
.money{display:grid; grid-template-columns:1fr; margin:22px 0 8px}
@media(min-width:640px){.money{grid-template-columns:repeat(3,1fr)}}
.fig{padding:16px 0; border-top:1px solid var(--line)}
@media(min-width:640px){
  .fig{padding:14px 20px; border-top:none; border-left:1px solid var(--line)}
  .fig:first-child{border-left:none; padding-left:0}
}
.fig .k{font-size:12.5px; color:var(--muted); letter-spacing:.01em}
.fig .v{font-family:var(--mono); font-size:26px; font-weight:600; letter-spacing:-.02em;
        font-variant-numeric:tabular-nums; margin-top:3px}
.fig .n{font-size:12.5px; color:var(--ink-2); margin-top:2px}
.v.gain{color:var(--gain)} .v.loss{color:var(--loss)} .v.hold{color:var(--amber)}

.reading{font-size:13.5px; color:var(--ink-2); border-left:3px solid var(--amber);
         padding:2px 0 2px 12px; margin:18px 0 4px; max-width:62ch}

/* ---- controls ---- */
.controls{position:sticky; top:0; z-index:5; background:var(--ground);
          padding:14px 0 10px; margin-top:18px; border-bottom:1px solid var(--line)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font:inherit; font-size:12.5px; padding:5px 11px; border:1px solid var(--line);
      background:var(--surface); color:var(--ink-2); border-radius:2px; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--ground); border-color:var(--ink)}
.chip:focus-visible,input:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
input[type=search]{
  width:100%; margin-top:8px; padding:8px 10px; font:inherit; font-size:14px;
  color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:2px;
}
.count{font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:8px;
       letter-spacing:.03em}

/* ---- the list ---- */
.batch{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
       color:var(--muted); padding:20px 0 6px}
.row{display:grid; grid-template-columns:auto 1fr auto; gap:2px 12px;
     align-items:baseline; padding:10px 12px 10px 13px; background:var(--surface);
     border:1px solid var(--line-soft); border-left:3px solid var(--muted); margin-top:-1px}
.row.sold{border-left-color:var(--gain)}
.row.list{border-left-color:var(--amber)}
.row.way{border-left-color:var(--calm)}
.row.mine{border-left-color:var(--line)}
.num{font-family:var(--mono); font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.name{font-size:14px; font-weight:500; line-height:1.35; overflow-wrap:anywhere}
.amt{font-family:var(--mono); font-size:14px; font-variant-numeric:tabular-nums;
     text-align:right; white-space:nowrap; font-weight:500}
.amt.gain{color:var(--gain)} .amt.loss{color:var(--loss)}
.meta{grid-column:2/4; display:flex; flex-wrap:wrap; gap:5px 10px; align-items:center;
      font-size:12px; color:var(--muted); margin-top:3px}
.tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
     padding:1px 6px; border:1px solid var(--line); color:var(--ink-2); border-radius:2px}
.tag.ebay{border-color:var(--calm); color:var(--calm)}
.tag.fb{border-color:var(--amber); color:var(--amber)}
.cost{font-family:var(--mono); font-variant-numeric:tabular-nums}
.empty{padding:34px 0; color:var(--muted); font-size:14px}

/* ---- batch table ---- */
.tablewrap{overflow-x:auto; margin-top:18px; border:1px solid var(--line-soft); background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:660px; font-size:13px}
thead th{font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
         font-weight:500; text-align:left; padding:9px 10px; border-bottom:1px solid var(--line);
         position:sticky; top:0; background:var(--surface)}
tbody td{padding:9px 10px; border-bottom:1px solid var(--line-soft); vertical-align:baseline}
tbody tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
td.b{font-family:var(--mono); color:var(--muted); font-variant-numeric:tabular-nums}
.dev{font-weight:500}
.when{color:var(--muted); font-size:12px}
tfoot td{padding:10px; border-top:2px solid var(--ink); font-weight:600}
.bar{display:block; height:4px; margin-top:4px; background:var(--line); position:relative; width:100%}
.bar i{display:block; height:100%; background:var(--amber)}
.bar i.over{background:var(--loss)}
.none{color:var(--muted)}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--raised)}
tbody tr.clickable:focus-visible{outline:2px solid var(--focus); outline-offset:-2px}
.opencue{font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
         color:var(--muted); white-space:nowrap}

/* ---- the floating box ---- */
dialog.pop{
  width:min(680px, calc(100vw - 28px)); max-height:min(82vh, 760px);
  padding:0; border:1px solid var(--line); border-radius:3px;
  background:var(--ground); color:var(--ink); overflow:hidden;
  box-shadow:0 18px 48px rgba(0,0,0,.28);
}
dialog.pop::backdrop{background:rgba(10,14,17,.55)}
.pophead{position:sticky; top:0; background:var(--ground); border-bottom:2px solid var(--ink);
         padding:16px 18px 12px; display:flex; justify-content:space-between; gap:14px;
         align-items:flex-start}
.pophead h3{margin:0; font-size:17px; font-weight:600; letter-spacing:-.01em}
.popsub{font-size:12.5px; color:var(--muted); margin-top:2px}
.popclose{font:inherit; font-size:13px; line-height:1; padding:7px 12px; cursor:pointer;
          border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
          border-radius:2px; flex:none}
.popclose:hover{background:var(--raised)}
.popclose:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.popsums{display:flex; flex-wrap:wrap; gap:0 26px; padding:12px 18px;
         border-bottom:1px solid var(--line); background:var(--surface)}
.popsums div{font-size:12px; color:var(--muted)}
.popsums b{display:block; font-family:var(--mono); font-size:16px; font-weight:600;
           font-variant-numeric:tabular-nums; color:var(--ink); margin-top:2px}
.popsums b.loss{color:var(--loss)} .popsums b.gain{color:var(--gain)}
.popbody{padding:14px 18px 22px; overflow-y:auto; max-height:calc(82vh - 168px)}
footer{margin-top:36px; padding-top:14px; border-top:1px solid var(--line);
       font-size:12.5px; color:var(--muted); max-width:62ch}
footer code{font-family:var(--mono); font-size:11.5px}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
</style>
</head>

const SHEET_ID = "";
let ROWS = SNAPSHOT;
let filter = {ch: "all", st: "all", q: ""};

const money = n => (n < 0 ? "-" : "") + "$" + Math.abs(n).toLocaleString("en-AU", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const num = v => (typeof v === "number" && isFinite(v)) ? v : 0;

function state(r){
  if (r.ch === "Personal") return "mine";
  if (num(r.r) > 0) return "sold";
  const s = (r.st || "").toLowerCase();
  if (s.includes("ready to list") || s.includes("delivered")) return "list";
  return "way";
}

function totals(rs){
  const t = (f) => {
    const s = rs.filter(f);
    const c = s.reduce((a, x) => a + num(x.c), 0);
    const b = s.reduce((a, x) => a + num(x.r), 0);
    return {n: s.length, c, b, net: b - c};
  };
  return {
    sold:  t(x => x.ch !== "Personal" && num(x.r) > 0),
    stuck: t(x => x.ch !== "Personal" && num(x.r) === 0),
    mine:  t(x => x.ch === "Personal")
  };
}

function renderMoney(){
  const t = totals(ROWS);
  document.getElementById("money").innerHTML = [
    ["What selling has done", money(t.sold.net), t.sold.net < 0 ? "loss" : "gain",
     t.sold.n + " sold &middot; " + money(t.sold.c) + " spent, " + money(t.sold.b) + " back"],
    ["Money stuck in stock", money(t.stuck.c), "hold",
     t.stuck.n + " bought to sell, none sold yet"],
    ["Kept for yourself", money(t.mine.c), "",
     t.mine.n + " items &middot; not a business loss"]
  ].map(([k, v, cls, n]) =>
    `<div class="fig"><div class="k">${k}</div><div class="v ${cls}">${v}</div><div class="n">${n}</div></div>`
  ).join("");

  const per = t.sold.n ? t.sold.net / t.sold.n : 0;
  document.getElementById("reading").innerHTML =
    `Every item you have actually sold has, on average, ` +
    (per < 0 ? `<strong>lost you ${money(Math.abs(per))}</strong>` : `<strong>made you ${money(per)}</strong>`) +
    `. The bigger number is the ${money(t.stuck.c)} sitting in ${t.stuck.n} things nobody has bought.`;
}

const FILTERS = [
  ["ch", "all", "Everything"], ["ch", "eBay", "eBay"],
  ["ch", "Facebook", "Marketplace"], ["ch", "Personal", "Kept"],
  ["st", "sold", "Sold only"], ["st", "unsold", "Unsold only"]
];

function renderChips(){
  document.getElementById("chips").innerHTML = FILTERS.map(([k, v, label]) => {
    return `<button class="chip" data-k="${k}" data-v="${v}" aria-pressed="${filter[k] === v}">${label}</button>`;
  }).join("");
}

function visible(){
  const q = filter.q.trim().toLowerCase();
  return ROWS.filter(r => {
    if (filter.ch !== "all" && r.ch !== filter.ch) return false;
    if (filter.st === "sold" && !(num(r.r) > 0)) return false;
    if (filter.st === "unsold" && num(r.r) > 0) return false;
    if (q) {
      const hay = [r.item, r.sup, r.buyer, r.st, r.acct, "batch " + r.b].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function rowHTML(r){
  const st = state(r);
  const sold = num(r.r) > 0;
  const amt = sold
    ? `<div class="amt ${num(r.net) < 0 ? "loss" : "gain"}">${money(num(r.net))}</div>`
    : `<div class="amt">&mdash;</div>`;
  const tagCls = r.ch === "eBay" ? "ebay" : r.ch === "Facebook" ? "fb" : "";
  const bits = [
    `<span class="tag ${tagCls}">${r.ch || "unassigned"}</span>`,
    `<span class="cost">cost ${money(num(r.c))}</span>`,
    sold ? `<span class="cost">sold ${money(num(r.r))}</span>` : "",
    r.sd ? `<span>${r.sd}</span>` : (r.od ? `<span>ordered ${r.od}</span>` : ""),
    r.buyer ? `<span>${r.buyer}</span>` : "",
    `<span>${r.st || ""}</span>`
  ].filter(Boolean).join("");
  return `<article class="row ${st}">
    <div class="num">${r.n}</div>
    <div class="name">${r.item}</div>
    ${amt}
    <div class="meta">${bits}</div>
  </article>`;
}

function renderList(){
  const rs = visible();
  document.getElementById("count").textContent =
    rs.length + " of " + ROWS.length + " items shown";
  if (!rs.length){
    document.getElementById("list").innerHTML =
      `<p class="empty">Nothing matches that. Clear the search or pick Everything.</p>`;
    return;
  }
  const groups = new Map();
  for (const r of rs){
    const key = r.b || "—";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const order = [...groups.keys()].sort((a, b) => (parseInt(b, 10) || 0) - (parseInt(a, 10) || 0));
  document.getElementById("list").innerHTML = order.map(k => {
    const items = groups.get(k);
    const spent = items.reduce((a, x) => a + num(x.c), 0);
    return `<h2 class="batch">Batch ${k} &middot; ${items.length} items &middot; ${money(spent)} spent</h2>` +
      items.map(rowHTML).join("");
  }).join("");
}

function batchRows(){
  const by = new Map();
  for (const r of ROWS){
    const k = r.b || "\u2014";
    if (!by.has(k)) by.set(k, {n:0, c:0, r:0, sold:0, mine:0});
    const a = by.get(k);
    a.n++; a.c += num(r.c); a.r += num(r.r);
    if (num(r.r) > 0) a.sold++;
    if (r.ch === "Personal") a.mine++;
  }
  return [...by.entries()]
    .map(([k, a]) => ({k, ...a, net: a.r - a.c, meta: BATCHMETA[k] || {}}))
    .sort((x, y) => (parseInt(x.k, 10) || 999) - (parseInt(y.k, 10) || 999));
}

function renderBatches(){
  const bs = batchRows();
  const T = bs.reduce((a, b) => ({n:a.n+b.n, c:a.c+b.c, r:a.r+b.r, sold:a.sold+b.sold}),
                      {n:0, c:0, r:0, sold:0});
  const body = bs.map(b => {
    const credit = b.meta.cred || 0;
    const pct = credit ? Math.round(b.c / credit * 100) : null;
    const bar = credit
      ? `<span class="bar"><i class="${pct > 100 ? "over" : ""}" style="width:${Math.min(pct, 100)}%"></i></span>`
      : "";
    return `<tr class="clickable" tabindex="0" role="button" data-batch="${b.k}"
                 aria-label="Show the ${b.n} items in batch ${b.k}">
      <td class="b">${b.k}</td>
      <td><span class="dev">${b.meta.dev || "not in a batch"}</span>
          <div class="when">${b.meta.when ? "ordered " + b.meta.when : ""}</div></td>
      <td class="n">${b.n}</td>
      <td class="n">${b.sold ? b.sold : '<span class="none">0</span>'}</td>
      <td class="n">${money(b.c)}${bar}
          <div class="when">${credit ? "$" + credit + " credit &middot; " + pct + "%" : ""}</div></td>
      <td class="n">${b.r ? money(b.r) : '<span class="none">&mdash;</span>'}</td>
      <td class="n" style="color:var(--${b.net < 0 ? "loss" : "gain"})">${money(b.net)}
          <div class="opencue">tap to see items</div></td>
    </tr>`;
  }).join("");
  document.getElementById("batches").innerHTML = `
    <div class="tablewrap"><table>
      <thead><tr>
        <th>#</th><th>Bought on</th><th class="n">Items</th><th class="n">Sold</th>
        <th class="n">Spent</th><th class="n">Back</th><th class="n">Difference</th>
      </tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr>
        <td></td><td>${bs.length} batches</td><td class="n">${T.n}</td><td class="n">${T.sold}</td>
        <td class="n">${money(T.c)}</td><td class="n">${money(T.r)}</td>
        <td class="n" style="color:var(--loss)">${money(T.r - T.c)}</td>
      </tr></tfoot>
    </table></div>`;
}

const pop = document.getElementById("pop");

function openBatch(k){
  const items = ROWS.filter(r => (r.b || "\u2014") === k);
  if (!items.length) return;
  const meta = BATCHMETA[k] || {};
  const spent = items.reduce((a, x) => a + num(x.c), 0);
  const back  = items.reduce((a, x) => a + num(x.r), 0);
  const sold  = items.filter(x => num(x.r) > 0).length;
  const kept  = items.filter(x => x.ch === "Personal").length;
  const net   = back - spent;

  document.getElementById("poptitle").textContent =
    (k === "\u2014") ? "Not in a batch" : "Batch " + k;
  document.getElementById("popsub").textContent = [
    meta.dev ? "bought on the " + meta.dev : "",
    meta.when ? "ordered " + meta.when : "",
    meta.cred ? "$" + meta.cred + " store credit" : ""
  ].filter(Boolean).join(" \u00b7 ");

  document.getElementById("popsums").innerHTML = [
    ["Items", items.length],
    ["Sold", sold],
    ["Kept", kept],
    ["Spent", money(spent)],
    ["Got back", back ? money(back) : "\u2014"],
    ["Difference", money(net), net < 0 ? "loss" : "gain"]
  ].map(([k2, v, cls]) => `<div>${k2}<b class="${cls || ""}">${v}</b></div>`).join("");

  document.getElementById("popbody").innerHTML =
    items.slice().sort((a, b2) => (parseInt(a.n, 10) || 0) - (parseInt(b2.n, 10) || 0))
         .map(rowHTML).join("");

  if (typeof pop.showModal === "function") pop.showModal();
  else pop.setAttribute("open", "");
  document.getElementById("popclose").focus();
}

document.getElementById("batches").addEventListener("click", e => {

  openBatch(tr.dataset.batch);
});

pop.addEventListener("click", e => { if (e.target === pop) pop.close(); });

/* ---------- live feed from the spreadsheet, via her Google Drive ---------- */
function unescapeCell(s){
  return s.replace(/\\([\\`*_{}\[\]()#+\-.!<>|~])/g, "$1").trim();
}
function parseSheet(text){
  const lines = String(text).split("\n");
  let head = -1;
  for (let i = 0; i < lines.length; i++){
    const l = lines[i];
    if (l.includes("| Item |") && l.includes("| Category |") && l.includes("| Channel |")){ head = i; break; }
  }
  if (head < 0) return null;
  const cols = lines[head].split("|").slice(1, -1).map(unescapeCell);
  const at = name => cols.indexOf(name);
  const iN = at("\\#") >= 0 ? at("\\#") : at("#");
  const need = ["Item","Category","Channel","Status","Order date","Sold date","Week","Cost","Received","Net","Account","Recipient/Buyer","Supplier","Batch"];
  if (need.some(n => at(n) < 0)) return null;
  const out = [];
  for (let i = head + 1; i < lines.length; i++){
    const l = lines[i];
    if (!l.startsWith("|")) { if (out.length) break; else continue; }
    const cells = l.split("|").slice(1, -1).map(unescapeCell);
    if (cells.length < cols.length){ if (out.length) break; else continue; }
    const id = cells[iN < 0 ? 0 : iN];
    if (!/^(E?\d+)$/.test(id)){ if (out.length) break; else continue; }
    const n = v => { const x = parseFloat(String(v).replace(/[$,]/g, "")); return isFinite(x) ? x : null; };
    out.push({
      n: id, item: cells[at("Item")], cat: cells[at("Category")],
      ch: cells[at("Channel")], st: cells[at("Status")],
      od: cells[at("Order date")], sd: cells[at("Sold date")], wk: cells[at("Week")],
      c: n(cells[at("Cost")]), r: n(cells[at("Received")]), net: n(cells[at("Net")]),
      acct: cells[at("Account")], sup: cells[at("Supplier")],
      b: cells[at("Batch")],
      buyer: (cells[at("Recipient/Buyer")] || "").split("·")[0].split("—")[0].trim()
    });
  }
  return out.length ? out : null;
}

function feed(stateName, text){
  const el = document.getElementById("feed");
  el.dataset.state = stateName;
  document.getElementById("feedtext").textContent = text;
