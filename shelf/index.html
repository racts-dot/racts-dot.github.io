ence>\"`, which is written into `qa/review_costs.jsonl` beside the charge. A\nGemini-only call needs no excuse — Vertex runs on her cloud credit, and that is\nnot what she objected to. The browser cannot be driven from Python, so this is\nthe only enforcement a file can carry; the rest is the session choosing honestly.\n\n⚠ **Two costs of the free path, so nobody is surprised.** It needs the WINDOWS\nPC awake with Chrome open and logged in, and it cannot run unattended while she\nis at work. Those are the two things the paid API bought, and they are the only\nreasons to reach for it.\n\n**Reviews run on `gpt-5.5` / `gpt-5.5-pro` and `gemini-3.1-pro-preview`.** Measured 6 Sep 2026:\nthe OpenAI key reaches 125 models. The newest reachable and PREFLIGHTED are\n`gpt-5.5` and `gpt-5.5-pro` (April 2026). There are also `gpt-5.6-luna`, `-sol`\nand `-terra`, which answer but are named after things rather than versions;\nnothing establishes whether they outrank 5.5, so they are NOT used — guessing a\nmodel from its name is exactly how this repo has picked wrong ones before.\nFive review rounds on 6 Sep had all been run on plain\n`gpt-5` — several generations back — because nobody had listed the models. The\nupgrade was not cosmetic: `gpt-5.2` found four things on a listing that `gpt-5`\nhad passed. One `gpt-5.2` review measured 1,410 tokens in and 585 out, so it is\ncents. `gpt-5.2-pro` is NOT used without asking her first: a single call is\nestimated near or above the 10-cent line in the spend rules, and it has not been\npriced. Vertex's model list endpoint returns 404 on this project, so the Gemini\nside cannot be enumerated — `gemini-3.1-pro-preview` is confirmed reachable\nbecause the calls work.\n\n**Use `review_brief.brief()` for the prompt. Do not hand-write one.** Her\ncorrection, 6 Sep 2026: *\"I have multiple times told you for the constructive\nfeedback.\"* Three rounds in one session were run on a hand-written prompt\nsaying \"be adversarial, do not compliment it\", so they came back as pure\ndemolition and were reported to her as a run of refusals. The models were not\nthe problem; the brief was. `review_brief.py` now forces every finding to\ncarry what is wrong, what it costs, and what to do, plus what is already right\nand should be left alone. The reasoning lives in that file, not here.\n\n**And stop after the round that changes the decision.** Round 1 killed the\nidea. Rounds 2 and 3 rebuilt a thing that should not have existed and cost her\ntwo more reports. If a review says the whole approach is wrong, bring her that,\ndo not quietly start version 2.\n\nHer rule, 5 Sep 2026, chosen from four options. Two halves, and they only work\nas a pair:\n\n- **Review by default.** A job is reviewed by a DIFFERENT model unless the\n  session writes down why not. Skipping is the thing that has to be visible.\n- **Count it**, so 70% is a measured number rather than a wish.\n\n        python3 review_log.py add  --job \"...\" --by gpt-5\n        python3 review_log.py skip --job \"...\" --why \"<a real sentence>\"\n        python3 review_log.py rate          # exits 1 under 70% of the last 20\n        python3 review_log.py --self-test   # proves the gate can fail\n\n**Everything else about this rule lives in `review_log.py`'s docstring, on\npurpose** — what counts as a job, what counts as a review, why the floor is a\nrolling window and not a lifetime average. Do not restate any of it here. This\nfile's own record is that every fix which regressed had the same fact written\nin two or more places.\n\n- `skip` refuses a shrug. \"n/a\", \"not needed\", anything under 12 characters is\n  rejected, because option 2 is worthless if skipping can be made invisible.\n- Self-approval is still not a check. The reviewer is a different model from\n  the one that produced the work.\n- Both review legs work on this Mac: `ask_gpt.py` for OpenAI and Vertex/Gemini\n  via `gcloud`, with `ai_review.py` running them against each other. The fixed\n  page-review prompt is the exception and still goes through Chrome.\n- ⚠ **Nothing calls `review_log.py` for you.** There is no CI and `.git/hooks/`\n  is empty. The count is only honest if the session running the job logs it,\n  and a session that logs nothing shows up as no change rather than as a\n  failure. That is the known hole in this rule; do not paper over it.\n=======\n>>>>>>> origin/main\n\n## Experimental exposure runs — the frame comes before the channel\n\nHer project, 5 Sep 2026: an experimental social media exposure push, built to\nthe standard the top 0.001% of marketers would hold it to. This section is the\nrequired shape. It is here because the shop's real problem was thought not to be product\nquality. 🚨 **BOTH HALVES OF THAT PREMISE WERE RE-MEASURED ON 12 Sep 2026 AND\nBOTH HAVE MOVED.** ~~five live listings, five weeks, and Etsy search has sent\nzero visits, ever~~ — there are now **46 live listings**, and the shop is **#2 for\n`dementia caregiver binder`, #4 for `caregiver binder printable` and #9 for\n`aging parent care planner`** on Etsy AU, logged out, organic results.\n⛔ **So findability is no longer the named bottleneck, and a social-exposure push\ncan no longer be justified by \"nobody can find us\".** Sales are still 0, so what\nis unproven has moved to what happens AFTER someone sees the listing.\n📄 `market_research/ETSY_RANKINGS_2026-09-12.md`. The frame rules below still\nstand on their own; only their premise changed.\n\n### Build the frame first. Do not pick the channel first.\n\n**Her instruction, 5 Sep 2026, asked which channel and answered \"all of them,\nbut build the frame first.\"** So the blueprint is channel-agnostic until the\nevidence names a winner: who the buyer is, what makes them stop scrolling, what\nthe offer is, what a win looks like and how it is measured. Only then does a\nchannel get chosen, and it gets chosen **because the frame says so**, not\nbecause Pinterest is the obvious answer for printables.\n\nA plan that opens by naming a platform has skipped the work.\n\n### The two failure modes specific to this work\n\n- **Vanity metrics presented as demand.** Impressions, reach, follows and saves\n  are not sales and not even visits. This file already refuses visibility,\n  rank, carts, reviews and bestseller badges as evidence of conversion; the\n  same refusal applies here, and social makes the temptation worse because the\n  numbers are large and instant.\n- **Building the campaign before checking the free thing.** Shop Manager → Etsy\n  search visibility is ten minutes, costs nothing, and has still never been\n  opened. It says whether the shop is findable at all. Do it alongside, not\n  instead — but a plan that ignores it is a plan that never looked.\n\n## This machine\n\n    P=~/.venvs/product-factory/bin/python     # 3.14.6. There is no other.\n\n- **`.venv-planner` does not exist** and must never be recreated under\n  `~/Desktop`: iCloud evicts packages and `import reportlab` hangs for minutes\n  at 0% CPU with no error. Every `.venv-planner\\Scripts\\python.exe` in BUILD.md\n  and POSTING_CHECKLIST.md is a Windows path from the other machine.\n  `POSTING_CHECKLIST.md:83-84` tells you to prefer it. Ignore that line.\n- `BUILD.md` mandates `requirements.lock.txt`. It does not exist. Use\n  `requirements.txt`.\n- **Never `git add -A`.** `upload_packs/` is untracked and not gitignored.\n  iCloud also leaves conflict copies named `... 2.jpg`, and\n  `build_upload_packs.py`'s glob stages them as real photos.\n  **Cleared 6 Sep 2026** — the six in `listing_images/` were verified\n  byte-identical to their originals and deleted; `Planner_Journal_Bundle` now\n  resolves to 6 files, not 12. They come back whenever iCloud syncs badly, so\n  check before staging:\n  `find . -path ./.git -prune -o -name \"* 2.*\" -print`\n- **Two or three sessions work this folder at once.** `git worktree list` shows\n  extra checkouts. Two once did the same page-restore within an hour; two\n  verdict files differ only by a truncated filename\n  (`verify_The_Focus_Soft_Life_Clear_Mind_Pla.json` and `...Plann.json`).\n  `git status` before you start and before you stop. Expect files you did not\n  write. Commit only paths you touched.\n\n## Build order that works\n\n    $P rebuild_all.py          # interiors, covers, bundle preview (two passes)\n    $P bundle_builder.py       # delivery ZIPs\n    $P listing_images.py       # NO ARGUMENTS\n    $P build_bundle_images.py  # bundle gallery — BUILD.md omits this step\n    $P build_upload_packs.py   # stages listings by QA verdict\n    $P make_manifest.py        # hashes into LIVE_MANIFEST.md\n\n- `listing_images.py <name>` rebuilds one product and leaves the rest silently\n  stale. `PROJECT_GUIDE.md:162` tells you to do that. Don't.\n- `puzzle_generator.py` is the one generator that never imports `reproducible`,\n  so running it alone produces a different file from the one `rebuild_all.py`\n  ships. Always go through `rebuild_all`.\n- `HANDOVER.md` is a 19 Aug wedding-album handover with nothing about this\n  project. `PROJECT_GUIDE.md` §10 says nothing is listed; the shop is open.\n  Neither describes current state.\n\n## The price rule, in the only place that enforces it\n\nThere have been **zero sales, ever**. Nothing has been sold at any price, so\nthere is no higher price to compare against. **No strikethrough, no \"was\"\nprice, no \"original\", no discount percentage and no \"% off\" may appear on any\nlisting until that item has genuinely sold at the higher price.** A price you\nplan to charge later is not a price you once charged: raising the price after\nreviews land is fine, showing the raise as a discount is not.\n\n`POSTING_CHECKLIST.md:166-183` and `LISTING_READY_focus_planner.md:224-229`\nhave said this all along, citing ACCC enforcement, and **no Python file reads\neither** — which is exactly why it came back. The pipeline reads\n`listing_text.md` (`build_upload_packs.py:33`) and `bundle_builder.LISTINGS`,\nso that is where the rule has to live. It is now enforced on both by\n`test_products.py:214 test_no_invented_price_comparison`, which is on the\npre-upload path. Fix a price claim there or it has not been fixed. Do not\nre-state this rule in another markdown file; add to the check instead.\n\n## The worksheet packs\n\nTwelve maths and literacy packs built by `worksheet_generator.py` on\n`house_style.py`. They are the one part of this repo with a check on the\nshipping path, so the rules below are the rules that make that check real.\n`PIPELINE.md` has the sourced reasoning; this is what you act on.\n\nRun them with `python3 build_worksheets.py` (there is deliberately no\n`if __name__` block in `worksheet_generator.py` — `TASK_KINDS` resolves\nrenderers lazily, and one defined below a `__main__` block dies with\n`NameError`. That bit twice).\n\n### Gotchas\n\n- **Never carry a page value as a float.** Integer minor units — pence,\n  minutes — formatted at the last moment. `0.1 + 0.2 != 0.3` makes the gate\n  reject correct pages.\n- **Small question spaces repeat.** A tenths page has nine possible questions\n  for eight slots. Draw without replacement.\n- **Comparison pages need two independent paths.** Derive the glyph from the\n  values you print; verify by parsing the strings you drew.\n- **Fonts must be embedded.** `house_style.register_fonts()` loads the\n  vendored OFL faces in `fonts/`, and the canvas starts on one\n  (`initialFontName`) — reportlab otherwise emits a Helvetica resource even\n  when nothing uses it, and KDP substitutes a font and reflows the book.\n  `test_products.py` asserts embedding and the absence of any Helvetica\n  reference.\n- **A failed build leaves no new PDF but does not delete the old one.**\n  `build_worksheets.py` removes it; calling `build()` directly does not.\n\n### Safety framing is not optional\n\nThe SEN pack opens with \"Before You Use These\" and the homeschool pack with\n\"About These Records\", both before the contents. Deep pressure has to be\nchild-initiated; anything involving being wrapped needs an adult present; home\neducation reporting duties differ by country and state. Do not drop either\npage to save a page, and keep the caveats if you rewrite the copy.\n\nNever name a SEN or education framework in copy. Zones of Regulation® and\nPECS® were both caught here. Describe the function.\n\n### Before shipping a pack\n\n    python3 vacuity.py        # the new kind must catch a corrupted page\n    python3 test_products.py\n\nThen render two or three pages and **look at them**. The gate catches wrong\nanswers; it cannot see a layout. A \"flower\" dot-to-dot once shipped as a\nheptagon, and three handwriting rows shipped fused together.\n\nRead the page count off the built PDF — you cannot predict it — and write that\nnumber into `listing_text.md`. Etsy title ≤140 characters, exactly 13 tags of\n≤20 each. `test_etsy_limits` now really does check all three: it counts the\ntags (it only ever measured their length, so a block of 16 passed), reads both\nthe `|` and `·` separators and both the `**Tags` and `## Tags` headings, and\nrefuses a title with no tag block at all — which is how three bundle listings\nsat here unpostable, with a title, a price and no tags.\n\n### AI disclosure\n\nQuestions and artwork drawn by this code need none — not created by an AI\ntool. `mandala_generator.py` uses Gemini and does: Etsy wants it *within the\nlisting description*, not the title. KDP treats AI-drafted prose as\nAI-generated \"even if you applied substantial edits\", so record who wrote any\nstring that reaches a page — which is why the covers say \"no AI-generated\nquestions or answers\" rather than the unqualified negative.\n\n\n"}, {"id": "website", "title": "The website book", "shelf": "Rule books", "path": ".site-publish/CLAUDE.md", "kind": "md", "loaded": "Loads in .site-publish", "blurb": "Governs the live public site at racts-dot.github.io.", "chars": 3406, "date": "13 Sep 2026", "body": "# Sales Tracker Website — read before touching anything here\n\nThis folder IS the live website. It publishes to https://racts-dot.github.io/\n\n## The one rule\n\n**There must only ever be ONE copy of this folder on this computer, and it is\nthis one: `C:\\Users\\soyan\\Desktop\\Sales Tracker Website`.**\n\n- Never copy or duplicate it anywhere else — not Downloads, not Google Drive,\n  not a backup folder.\n- Never put it in a Drive-synced folder. Drive fights with the hidden `.git`\n  record and corrupts it silently.\n- To work on it from another computer, `git clone` a fresh copy. Never carry\n  the folder across.\n\n**Why:** on 9 Sep 2026 there were two copies. They drifted apart, and one held\nTripShare — 1,210 lines that existed nowhere else and had never been sent up.\nIt was nearly deleted. The duplicate was removed the same day.\n\n## Before you finish, always\n\n    git add -A && git commit -m \"what changed\" && git push\n\nWork sitting on this disk and not on GitHub is work that can vanish. If a push\nis refused, say so plainly — do not leave it unsaid.\n\n## What is in here\n\n| Path | What it is |\n|---|---|\n| `app.html` | Sales Tracker — the resale stock/sales app |\n| `tripshare/` | TripShare |\n| `todo/`, `worklog/` | the other two pages |\n| `index.html` | front page linking them |\n| `AppsScript-Code.gs` | connects the app to Google Sheets |\n| `DEPLOY-INSTRUCTIONS.txt` | how to set that connector up |\n\n## app.html — the trap that has already broken it once\n\nThe data is baked into the page as `data-*` attributes on\n`<div class=stock>` cards and `<tr class=fb>` rows. ~~There is no data file and no\ngenerator script.~~\n\n⛔ **CORRECTED 10 Sep 2026 BY MEASUREMENT — THE DATA FILE AND THE GENERATOR BOTH\nEXIST. They are just not in this repo.** They are in Google Drive, at\n`My Drive/01 BUSINESS & CREATION/Ecommerce integration/racts-tracker-backup/`:\n\n| File | What it is |\n|---|---|\n| `June Sales Tracker.xlsx` | the master data — one sheet, 296 rows |\n| `gen_tracker_html.py` | 70 KB. Builds the whole page and writes `Tracker_View.html` |\n| `gen_stock.py`, `html2pdf.py` | build the printable stock list and its PDF |\n\n⛔ **DO NOT REGENERATE `app.html` FROM IT. It would delete four things.** The\ngenerator was saved 2 Aug. Everything added by hand after that is missing from\nit — checked by searching both files on 10 Sep 2026:\n\n| Feature | in `app.html` | in the generator |\n|---|---|---|\n| `markSoldPrompt` | yes | **no** |\n| Apps Script link (`script.google.com`) | yes | **no** |\n| Mark Sold button | yes | **no** |\n| Test products section | yes | **no** |\n\nSo `app.html` is the newer artefact and the generator is behind it. Treat the\ngenerator as a record of how the page was first built, not as a way to rebuild\nit. Anyone who runs it and copies the result over `app.html` loses the Sheets\nconnection.\n\n- **Plain search-and-replace on it is unreliable.** Attribute values contain `>`\n  characters, and some cards nest blocks holding the opposite `data-sold` value,\n  so naive counting double-counts #67, #111 and #114.\n- **Counting brackets is not a syntax check.** On 24 Aug an edit produced\n  `markSoldPrompt(''+d.num+'')`, which reads as three strings jammed together.\n  The whole page died — every tab, filter and button — and the bracket check had\n  passed.\n- **So: load the page in a real browser and read the console before pushing.**\n  That is the only check that would have caught it.\n"}, {"id": "quality", "title": "The quality standard", "shelf": "Rule books", "path": "claude desktoi/QUALITY_STANDARD.md", "kind": "md", "loaded": "Digest injected at session start", "blurb": "The release gate, the geometric gates, claims discipline, the iteration loop. Binding on every product.", "chars": 17075, "date": "10 Sep 2026", "body": "# Quality standard — every product, every time\n\n**This applies to all printable products: colouring, mandala, maze, word search,\nsudoku, dot-to-dot, planners, diaries, notebooks. Any new line inherits it.**\n\nWritten 24 Aug 2026, after two independent visual reviews judged a fully\nQA-passing product *\"a A$3 auto-generated pack, not an A$8.50 product.\"*\n\nEvery gate below exists because something real went wrong. Nothing here is\ntheoretical.\n\n---\n\n## 00. THE RELEASE GATE — overrides everything below\n\n> **You may not start or substantially revise another product until the current\n> product has been viewed exactly as a buyer will see it, every buyer-facing\n> factual claim has evidence, and the product has either been LISTED or KILLED.**\n>\n> Not \"approved.\" Not \"ready.\" Not \"finished.\" **Listed or killed.**\n\nThe diagnosis, 24 Aug 2026: *\"You have a factory with no release gate.\"*\nThirteen finished products on disk, zero listed. The working definition of\nfinished had become `files + copy + listing assets = complete`. **The actual\nproduct is what a stranger sees on the storefront, plus what they receive after\npaying** — and nobody was inspecting that object.\n\nEvery defect in this document is one mistake wearing different clothes:\n**production outran verification and publication.**\n\nFull reasoning: `RELEASE_GATE.md`.\n\n---\n\n## 0. The rule that caused all the others\n\n> **QA numbers tell you what you are ALLOWED to say. They do not tell you the\n> product is good, and they never become the thing you say.**\n\nA product passed **1,329 automated checks** and **60 QA gates**, cleared a\nformal preflight sign-off, and was still judged commodity-grade the moment\nsomebody actually looked at it. Measurements confirm absence of defined faults.\nThey cannot confirm presence of quality.\n\n---\n\n## 1. LOOK AT IT. Every time. No exceptions.\n\n**Before any product is listed, a rendered image of the actual output must be\nviewed — not the metrics, not the source, the picture.**\n\n- Claude reads rendered PNGs directly. Use that. \"An LLM cannot see what it drew\"\n  is true of generated SVG/HTML; it is **not** true of a rasterised page.\n- **Get an independent visual read** from a second model before listing.\n  Vertex AI works and costs a fraction of a cent — see §7 for the exact call.\n- If the reviewers disagree, that disagreement is the most useful signal you\n  will get. One reviewer said \"cut plates 14–30\"; the other said \"there are weak\n  early pages and worthwhile late pages.\" The second was right.\n\n**Never ship a product no human or vision model has looked at.**\n\n---\n\n## 2. Shop images are chosen by eye. Never by index.\n\nThe cover plate for The Botanical Wheel was selected by:\n\n```python\nplates[len(plates) // 2]        # the middle filename of a sorted list\n```\n\nThat returned the muddiest page in the book, and it became the shop thumbnail —\nthe single thing that wins or loses the click.\n\n**Rules:**\n- Every listing image is named as an explicit constant at the top of the build\n  script (`COVER_PLATE`, `SAMPLE_OPEN`, `SAMPLE_DENSE`, `SAMPLE_DETAIL`).\n- A rebuild must never be able to silently change which image is the cover.\n- **Build a candidate contact sheet and choose by comparison**, not in isolation.\n- The cover must lead with the product's *strongest* work. Obvious, and it was\n  still got wrong.\n- ⭐ **AND RACHEL PICKS IT. `[HUMAN 2026-09-08]`** Chosen during the rule walk over\n  a version where the assistant chose by eye alone. **Send her the candidate\n  contact sheet and let her pick BEFORE the image goes up.** This deliberately\n  adds a wait on her — she took that trade knowingly, because the first picture a\n  buyer sees is the thing that wins or loses the click.\n\n---\n\n## 3. Curate ruthlessly. Fewer good pages beat more mixed pages.\n\n> \"I would rather see 13 good pages at A$3.95 than 30 mixed-quality pages at A$8.50.\"\n\n- **The weakest page sets the perceived value of the whole product**, not the best.\n- Do not pad to a round number. Thirty is not a target.\n- Do not justify weak pages as \"advanced difficulty.\" Difficulty is not their\n  problem; compositional failure is.\n- **Cut before you list.** Every weak page is a future 2-star review.\n\n**Gate:** if a reviewer would not personally use a page, it does not ship.\n\n---\n\n## 4. Hard geometric gates — colouring and line-art products\n\nFrom `mandala_book/ENGINEERING_BRIEF_quality.md`. Numbers are the standard; do\nnot quietly alter them.\n\n| Gate | Threshold | Why |\n|---|---|---|\n| **Minimum enclosed-region width** | **inscribed circle ≥ 2.5 mm** (target 3.0 mm), within the tolerance below | Area is the wrong metric — a 0.6 × 12 mm sliver has 7.2 mm² and is horrible to colour. Below ~2.5 mm the user pokes pigment into a crevice instead of making a colouring motion |\n\n### The sub-2.5 mm tolerance — amended 27 Aug 2026\n\nThis gate previously stated 2.5 mm and stopped, saying nothing about how much\nsub-2.5 mm area a page may contain. A gate with no tolerance is not\nenforceable, so every implementation invented its own and they all disagreed:\n`qa_ai.py` redefined \"too small\" as 1.5 mm, `mandala_book` had the region gate\n**switched off**, and `colouring_qa` used an unwritten 5%. \"Passes QA\" therefore\nmeant nothing across products — the same plate passed or failed depending on\nwhose script ran.\n\nMeasured, not assumed (`colouring_qa/calibrate_tolerance.py`, 300 dpi A4):\n\n| case | % of colourable area under 2.5 mm |\n|---|---|\n| Only large clean shapes | **0.00%** |\n| Plus ordinary crossing and tangential line detail | **0.29%** |\n| Dense hatch at the texture-spacing limit — a real defect | **23.64%** |\n\n**A zero tolerance is not absurd.** It had been argued that antialiasing alone\nmakes zero impossible; that is false. Antialiasing slivers carry negligible\n*area*, and this metric is area-weighted, so a clean page really does score\n0.00%. Zero is merely impractical for deliberately detailed work.\n\n**The permitted share depends on positioning**, because one number cannot serve\nboth ends of the catalogue: the 25 Aug review evidence shows intricate buyers\ncomplain about *insufficient* detail while bold-and-easy buyers complain about\n*excessive* detail. Record the positioning in the product README before QA runs.\n\n| Positioning | Max % of colourable area below 2.5 mm | Basis |\n|---|---|---|\n| **Bold and easy / large print** | **1.0%** | the format's whole promise is easy colouring; normal line detail costs 0.29% |\n| **Standard adult** (cozy, botanical, animal) | **2.0%** | A4-prepped cozy pages measure 1.44% |\n| **Intricate / mandala** | **3.5%** | mandala plates measure 1.49–3.68%; detail is the point |\n| **Any positioning — hard stop** | **8.0%** | the killed pancake-bear page measured 5.30%; dense-hatch failure 23.64% |\n\n**Report the measured figure in every QA run, pass or fail.** A gate whose\nnumber is not printed is a gate that can be switched off unnoticed — which is\nexactly how `mandala_book` shipped 30 pages against a disabled check.\n\n**No implementation may define its own threshold.** All colouring QA imports\nthese constants from `colouring_qa/geometry.py`. Any threshold *not* in this\ndocument must be a named constant that prints its own provenance in the failure\nmessage.\n\nTwo corollaries, both learned the same day:\n\n- **A deliberate frame is not clipping.** All 12 butterfly plates reported an\n  identical 28,336 px of \"edge clipping\" that was the series' own double-rule\n  border. Detect the frame and measure inside it.\n- **Gate prepped output, never raw generations.** `cat_library_v3.jpg` raw is\n  REJECT; the identical image after `to_a4()` clears every gate. The pipeline is\n  generate → prep → gate → regenerate.\n\n**Unresolved, and it blocks a product.** `colouring_qa` measures the mandala\nplates at 1.49–3.68%, which passes even the intricate band, while this project\nrecords 14 of 30 failing once `mandala_book`'s own region gate is enforced. Two\ngates disagree about the same pages. **This amendment does not clear\n`mandala_book`; the DO NOT LIST order stands until that is reconciled.**\n\nSample behind the bands: 20 pages, 3 product lines, one machine. Defensible\nstarting numbers, not proven ones — revisit once a labelled pass/fail set exists.\n| Minimum region area | ≥ 6.0 mm² | secondary to the width gate |\n| Negative space inside the design | **0.32 – 0.52** | measured inside the active footprint, from silhouette union — NOT ink coverage, NOT the white page around it |\n| Worst annulus negative space | **≥ 0.20** | a global average hides a dark belt |\n| Zone density contrast | **max/min ≥ 1.5** | uniform pressure everywhere reads as \"filled\", not \"designed\" |\n| Texture stroke spacing | **≥ 0.65 mm** apart | closer than this and texture becomes a black bar |\n\n### Line hierarchy — four weights, defined in mm, never one\n\n```python\nSTROKE = {\"silhouette\": 0.38, \"structure\": 0.28, \"secondary\": 0.20, \"texture\": 0.15}\n```\n\n> \"A premium drawing tells me which line is important. Here almost every line is\n> equally loud.\"\n\nTexture must never become a second contour system.\n\n### Scale hierarchy — stop making everything the same size\n\nFocal motifs **1.5–2×** ordinary motifs. Typical: focal 28–35 mm, main elements\n12–18 mm, supporting 8–12 mm, detail 3–6 mm.\n\n---\n\n## 5. Anti-generator rules\n\nThe buyer must stop thinking *\"generator\"*. These are the tells:\n\n- **Radial/grid stamping.** Never one module rotated k times. Generate\n  independent variants with structural counterparts.\n- **Independent random jitter.** Also a tell. Drive variation from a smooth\n  cyclic field so geometry drifts gradually rather than looking randomised.\n- **Isolated closed symbols.** Floating circles read as clip-art. Elements need\n  **attachment logic** — berries hang from pedicels, veins spring from a midrib.\n- **Perfect primitives.** A mathematically exact circle looks CAD-made. Low\n  amplitude harmonic distortion keeps it visibly round but drawn.\n- **Vocabulary sprawl.** Three well-developed families per page beats eight\n  generic symbols. Repetition inside a coherent language looks designed.\n\n---\n\n## 6. Claims discipline — what you may print\n\nEvery claim in listing copy, on a cover, or inside a product must trace to a\nmeasurement that was actually taken.\n\n**Banned unless specifically re-measured:**\n- \"exactly symmetrical\" — measured 0.845, not exact\n- \"true N-fold axis\" — **the same overclaim in technical dress**. This was\n  proposed as the *safe* replacement by a formal QA doc and it was not safe\n- \"every line closes where it should\" — requires a topology test nobody ran\n- \"sharp at any size\" / \"however large you print it\" — vector geometry scales;\n  PDF viewers, printer drivers, resolution and paper do not\n- \"no AI artefacts\" as a *consequence* of \"no image model\" — does not follow.\n  Procedural code produces ugly geometry too, and this project proved it\n- \"hand-drawn\" — it is algorithm-drawn. Never blur this line\n\n**Check the product too, not just the listing.** The Botanical Wheel's own title\npage printed \"sharp at any size\" after that claim was cut from the listing.\n\n---\n\n## 7. The iteration loop — run it until it passes\n\nNever \"generate once and ship\". Every generation round:\n\n```\nGENERATE  →  MEASURE (§4 gates)  →  SCORE  →  VISION REVIEW  →  FIX  →  REGENERATE\n```\n\n**Ask a vision model on EVERY round, not just the first.** Send the rendered\nplates and use a *fixed* evaluation prompt so answers are comparable round over\nround — a fresh essay each time cannot show whether you are improving.\n\n### Working Vertex call (verified 24 Aug 2026, costs a fraction of a cent)\n\n```\nproject  gen-lang-client-0626840434   account rachierachies7@gmail.com\nendpoint https://us-central1-aiplatform.googleapis.com/v1/projects/{PROJ}\n         /locations/us-central1/publishers/google/models/{MODEL}:generateContent\nauth     Bearer $(gcloud auth print-access-token)\n```\n\n- `gemini-2.5-flash` works. ✅ **CORRECTED 1 Sep 2026: `gemini-2.5-pro` WORKS TOO** — re-tested live against this project, HTTP 200. This bullet said it returned HTTP 429 and to fall back to flash. That was true when written and stopped being true on 30 Aug; the correction was applied to the global CLAUDE.md and to nowhere else, so this file — the one the project calls **binding on EVERY product** — kept contradicting it. ⚠ **Re-test a model before trusting any \"does not work\" note: a quota block is temporary, but a note about one reads as permanent.** Pro pricing, verified: $1.25 in / $10.00 out per 1M tokens (<=200k prompts). ⛔ **~~`gemini-3-pro-preview` is NOT available on this project (404).~~ WRONG, CORRECTED 10 Sep 2026: THAT NAME DOES NOT EXIST.** The real one is `gemini-3.1-pro-preview` - with a `.1` - and it ANSWERS (HTTP 200). A 404 from a guessed name was written down as \"not available\" and quoted for over a week. **Enumerate the catalogue instead of typing names: `python review_board/ask_gemini_vertex.py --catalogue` - free, lists 26 Gemini models.** ⚠ The 3.1 preview's price is UNVERIFIED; 2.5-pro stays the priced fallback.\n- Pass the token via an env var: `gcloud` is a `.cmd` on Windows and\n  `subprocess` cannot execute it directly.\n- ⛔ **CORRECTED 7 Sep 2026: the browser is NO LONGER the default route.**\n  It costs nothing in dollars but ~170,000 Claude tokens per review, against ~4,000\n  for `review_board/ask_openai_api.py` at ~9c. That script takes `--image`, so vision\n  reviews go through it too. Chrome is for logged-in sites only.\n  **Beware: the composer can auto-select the Pro model, which has its own small\n  quota separate from the main allowance.** Hitting it burns the attempt.\n\n### Stopping rules\n\n- **Ship** when every hard gate in §4 passes AND an independent vision review\n  says it reads as designed rather than generated.\n- **Stop and rethink** when a round produces no measurable improvement over the\n  previous one. Iterating past that point is sunk cost.\n- Detailed scorecard with weights and pass mark: see\n  `mandala_book/BUILD_PLAN.md` once the current build workflow lands.\n\n---\n\n## 8. Price follows the weakest page\n\n- Price is set by what a stranger sees, not by effort spent or QA passed.\n- Never use the list-high-then-50%-off anchor. 62% of the market does it, which\n  makes it **common, not effective**, and a permanent fake discount destroys the\n  only thing a launch measures: *will a stranger pay this?*\n- Above the category median needs a visible reason. A$8.50 against a A$3.79\n  median is defensible only if the interior is consistently good.\n- **A cover that promises more than the interior delivers is the actual failure\n  mode.** Not ugly drawings — a broken promise.\n\n---\n\n## 9. The honest ceiling\n\nWith good procedural geometry plus ruthless automated **and human** curation,\n~**80–90%** of high-end illustrated quality is reachable in a narrow ornamental\nstyle. The last 15% is hundreds of page-specific human judgements and is\nextremely expensive to encode.\n\nThat is enough. The threshold to clear is not \"beat a famous illustrator\" — it\nis **\"the buyer stops thinking generator.\"**\n\n---\n\n## Pre-listing checklist\n\nNothing gets listed until every box is ticked.\n\n**Box zero, and it is a command, not a sentiment — added 2 Sep 2026:**\n\n```\npython release_check.py <product>\n```\n\nIt reads `release_registry.json`, runs every gate that product has DECLARED as\nrequired, and hashes the exact files a buyer receives before and after the run.\nIt fails if a required gate is missing, if a declared gate script is not on disk,\nif a product has zero required gates and no written reason, or if an artefact\nchanged while it ran. It prints how many of those gates have never been proved\nable to fail, and it never prints the bare word PASS.\n\nWhy it exists: ChatGPT Pro and Google Gemini Pro, blind to each other, both\njudged this quality system not good enough on 2 Sep 2026. ChatGPT's single\nhighest-return change, verbatim: *\"Build one mandatory, versioned release runner\nwith a machine-readable gate registry, executed against the final exported\nfiles.\"* Its three rules, which that script mechanises: **a gate that exists but\nis not run is not a gate; a threshold that cannot fail is not a threshold; a\nresult that is not bound to the released files is not release evidence.**\n\n⛔ **A clean run is permission to LOOK. It answers \"is this file valid\". It does\nnot answer \"does this look competent\" or \"is there a reason to buy it\", and the\nword PASS was hiding the difference.**\n\n- [ ] `python release_check.py <product>` run, and its evidence file kept\n- [ ] Rendered output has been **looked at**, not just measured\n- [ ] An **independent vision review** has been run and its verdict recorded\n- [ ] Weak pages **cut**, not padded or excused\n- [ ] Cover chosen **by eye** from a candidate sheet, named as an explicit constant\n- [ ] All §4 geometric gates pass\n- [ ] Every claim in the listing traces to a real measurement (§6)\n- [ ] Claims **inside the product** checked too — covers, title pages, footers\n- [ ] Price justified against category median, no fake discount anchor\n- [ ] The listing's promise matches what the interior actually delivers\n"}, {"id": "history", "title": "Rule history", "shelf": "Rule books", "path": ".claude/RULE_HISTORY.md", "kind": "md", "loaded": "On demand — the archive", "blurb": "Every retired and reworded rule, kept word for word with your quote. Nothing is deleted, only moved here.", "chars": 144214, "date": "18 Sep 2026", "body": "# Rule history — the stories behind the rules\n\n**Moved here 8 September 2026, at Rachel's instruction.** She chose *\"keep the rule, move the story out\"* after going through the rule book one row at a time.\n\n**Nothing here was deleted.** Each rule in `hooks/answer_style.py` keeps its instruction and its before/after example. What moved is the account of the incident that caused it — the part that was being pushed into every single reply and had grown to be most of the file.\n\n**Read this when:** you are about to change or delete one of these rules, or someone asks why a rule exists. Do not quote it as a current instruction; the operative copy is in `answer_style.py`.\n\n---\n\n## Row 5 — Never invent a substitute\n\n`[HUMAN 2026-09-06]` her words: *\"stop making things up and put it into the rule??????????????? there is part 3 of 4\"* — said after exactly this failure.\n\n**What happened.** She sent \"Part 1 of 4\". Parts 2–4 did not arrive in that session. Instead of saying so and stopping, the assistant picked a different document, declared it a stand-in for \"part 2\", walked her through it, **invented a numbered sequence for it**, and then referred to \"item 3\" as though it were something she was waiting on. It was not. None of it existed.\n\n**Never carry an invented structure forward.** Once a substitute is named, its numbering, its items and its \"still open\" list all become fake work she is asked to track. That is worse than the original gap.\n\n**Saying \"I don't have it, so I am using X instead\" does NOT make it acceptable.** The assistant did say that, once, and then behaved for an hour as though X were real. Flagging an invention does not license it.\n\n---\n\n## Row 6 — Permission comes before the act\n\n`[HUMAN 2026-09-07]` Built at her instruction after the review loop closed. This is the first of the three gaps ChatGPT named and the evidence rule does not cover.\n\nChatGPT, verbatim: *\"The assistant could remove the tool, verify its absence, and accurately report an unauthorised action. Permission must be established before the removal. Completion evidence cannot supply missing authority.\"*\n\n**The real incident, 6 Sep 2026.** She said *\"make it a routine\"* about a recommendation that contained a deletion. That was read as approving the deletion. It was not. She caught it herself: *\"why are you deleting or taking away what needs to be done\"* and *\"its getting questionable\"*. Her ruling when it was restored: *\"i do not understand so until i get the understadning, put it back\"*.\n\n**Approval of a recommendation is not approval of every part of it.** If a recommendation contains a removal, the removal must be named separately and agreed separately. \"Make it a routine\", \"go ahead\", \"yes\" and \"do it\" cover what was ASKED, not what was bundled.\n\n**The argument may still be made.** Say why it should go, then leave it in place until she says otherwise. That costs one message. Acting alone cost her trust.\n\n---\n\n## Row 9 — The shape of every chat reply\n\nHer instruction, 6 Sep 2026. She gave this to a session on her Mac, where it landed in ONE project's CLAUDE.md and so reached no other folder. It is a reply rule, not a project rule, so the operative copy lives in `answer_style.py`, injected every turn.\n\n**Her sharpening, the same day:** *the bold lines read alone must BE the whole answer.* A label is a failure.\n\n**The withdrawn part.** Point 2 used to say: end every reply with ONE line, twenty words or under, the SAME line every time. Her words withdrawing it, 7 Sep 2026: *\"do not get the rule where you remind every single time about the things to do like etsy listing its really annoying\"*. It was repeated verbatim for a whole session and she stopped reading it, which is the opposite of what it was for. **Do not restore it.**\n\n**On jargon**, 6 Sep 2026: *\"you can say some jargons i would understand.\"* She is building marketing and analyst skill deliberately — the profile says she wants to reach the top tier at communicating tech and business. Writing round every term keeps her a beginner and makes replies longer, not shorter. The test is whether it gives her a word she can reuse with someone else, not whether it sounds expert.\n\n**Feedback versus rules.** Settled 6 Sep 2026 over two corrections, the second reversing the first. She first rewrote \"you gave me six writing rules, now permanent\" into \"six writing feedbacks to apply going forward\". That was read as \"do not claim permanence\". Her next message corrected it again: *\"m feedback to apply as rules to be made permanent *?\"* **So both halves hold.** What she gives is FEEDBACK — never call her input \"rules\". What the assistant does with it is turn it into a PERMANENT RULE, and saying so is right, because she wants to know it will not be lost.\n\n---\n\n## Row 11 — The implication never gets cut\n\nHer correction, 6 Sep 2026. It overrode what had been written an hour earlier.\n\nThe assistant had turned her *\"just write the fault\"* into a general ban on consequence clauses. She struck it down with two questions:\n\n> *\"who is the one that tells which is obvious?\"*\n> *\"implication is the most important thing\"*\n\nShe was right, and the rule contradicted her own standing instruction from the same day — that the closing bullets must say what a thing MEANS FOR HER.\n\n**The meta-fault to avoid: do not promote one of her line edits into an absolute rule.** She corrects a sentence; that is a sample, not a statute. Two of the six rules written up on 6 Sep were over-generalised this way within the hour, and she caught both.\n\n---\n\n## Row 1 — how the spoken-ending rule got built\n\nTraced 8 September 2026 at her request, after she said *\"the spoken summary doesn't stay plain words… do not set such rule. find out how come you ended up that way.\"*\n\nIt was not invented. One true fact of hers, then three more caps stacked on top:\n\n1. **8 Sep, her words:** *\"just send one sentence after whatever you have replyed just so that i can Play the audio for just the last paragraph\"*. She plays audio of the last paragraph. A table read by a speaking voice is gibberish. **This part is real and she has not withdrawn it.**\n2. **8 Sep, hours later:** *\"if I told you to do it in one paragraph and one sentence for whatever I need to know but it's too still long\"* — became a hard cap of 25 words.\n3. **8 Sep:** *\"before the last paragraph… you have to give a few sentences the whole context\"* — became a second paragraph capped at 70 words.\n4. **4 Sep:** an outside review said tables *\"are especially difficult because their relationships are visual\"*. That advice was about the **.md file she listens to**. It was applied to the **chat reply's ending** as well.\n\n**Result: about 95 words with no structure allowed** — which is why the part she says matters most had become the thinnest part of every reply. Nobody decided that. It accumulated.\n\n**Her decision, 8 Sep 2026: option B plus C.** A glance block she can scan, then a spoken block underneath that carries structure aloud (\"three things — one, two, three\"). The 25-word cap is withdrawn.\n\n---\n\n## Row 16b — one minute, not two\n\n`[HUMAN 2026-09-09]` her words: *\"So I'm aware that there's going to be just two\nminutes in replies and I probably want one minute.\"*\n\n    Was: stays under TWO MINUTES. One minute is ideal. Aim 150, never 300.\n    Now: stays under ONE MINUTE. About 150 words, and 150 is the ceiling.\n\n**Why the old wording failed.** It gave two numbers — a preference and a limit —\nso every reply drifted to the limit and none of them was ever wrong. One number\nnow, and it is the same 150 rule 8 already carries and close to the 140 the\nlength check already enforces.\n\n`[HUMAN 2026-09-09]` and immediately after: *\"Don't add to the rule part, just\nfor the rule book. Keep examples how it is.\"* The first version of this change\nwrote eight lines of reasoning into rule 16b itself. **The rule got the new\nnumber and nothing else; the account of it lives here.** That is the same call\nshe made on 8 September — keep the rule, move the story out.\n\n## Rule 60 added — 9 Sep 2026\n`[HUMAN 2026-09-09]` Rachel: *\"Whenever I'm working on it, can you not disconnect\nany of the remote controlled task?\"* Then, asked to make it reach the Windows PC:\n*\"what about windows\"*.\n\n**Added, nothing changed:** rule 60 in group 3 (WHEN TO ACT ON YOUR OWN). No\nexisting rule was reworded or removed. Group 3's header list now reads\n\"rules 13, 39, 52, 53b, 60\".\n\nIt was first saved only to the Mac's own memory, which Windows never reads. This\ncommit is what carries it across. **Windows does not have it until someone runs\n`git pull` in `~/claude-config` there.**\n\n---\n\n## Row 61 — the digital-product value bar\n\n`[HUMAN 2026-09-10]` her words: *\"add in the digital product bit, you can put it\nneeds to be better than, in value, 0.01% top competitors.\"*\n\n**Where the bar already lived, swept before this was added:**\n\n| Place | Wording |\n|---|---|\n| Rule 13 | \"better value than the top 0.01% available\" — one clause inside a rule about how sure you are, in the WHEN TO ACT ON YOUR OWN group |\n| `CLAUDE.md`, THE PRODUCT BAR leg 2 | \"best value-for-money in its market — not the cheapest, and not merely defect-free\" |\n| `SHARED_RULES.md` in the printables repo | the same paragraph again — that file mirrors the shared body |\n\n**So the bar existed three times and fired none of them.** It was never in the\nproduct group, which is where anyone building a product looks. Rule 61 puts one\ncopy there, in her words, naming competitors rather than \"available\".\n\n**Rule 13 was NOT touched.** Rule 55 reserves rule wording to her, so the\noverlap is flagged inside 61 and the merge is hers to call.\n\n`[HUMAN 2026-09-10]` **Asked which copy should stay, she chose \"leave both as they\nare\"** — shown three options including cutting the clause from rule 13. So rule 13\nkeeps \"better value than the top 0.01% available\" AND rule 61 says it in her words.\n⛔ **Do not \"tidy\" this into one rule.** It is a deliberate duplicate she was warned\nabout and kept. The ⚠ pointer inside 61 stays so the overlap is never a surprise.\n\n\n## Removed 11 Sep 2026, 23:15 — the Higgsfield \"cap at 20\" amendment\n\n`[HUMAN 2026-09-11]` Her words, asked what unit \"20\" was: *\"it does not need to be a rule, it can be clarified, let's get rid of it.\"* So the whole amendment below leaves the global book. The standing Higgsfield rule above it — ask first, every time it costs credits — is what remains. Moved here word for word:\n\n- ⭐ **AMENDED BY RACHEL 11 Sep 2026 — THERE IS NOW A STANDING CREDIT ALLOWANCE, SO THE\n  \"ASK EVERY TIME\" ABOVE IS SOFTENED, NOT DELETED.** Her words, verbatim:\n  *\"use the credits is fine. just cap at 20 fornow.\"*\n  **Read as: up to 20 CREDITS may be spent without asking again. Above 20, stop and ask.**\n  ⚠ **The unit is READ as credits, not dollars — the conservative reading, and it was not\n  stated.** She said it in reply to a list where the only \"credits\" item was Higgsfield cover\n  artwork, and the API spend in that same list was quoted in cents. **If a job would spend\n  more than a couple of dollars, confirm the unit with her before committing.**\n  ⛔ **THE OTHER HALF OF THE OLD RULE STANDS AND IS NOT SOFTENED: STATE THE MODEL, THE COUNT,\n  THE RESOLUTION AND THE CREDIT TOTAL BEFORE GENERATING.** An allowance is permission to\n  spend, never permission to spend silently. Log every generation against the 20.\n  ⛔ **\"for now\" is hers and it is a clock with no end date on it. Treat 20 as the live\n  ceiling until she changes it, and re-raise it rather than assuming it renews.**\n  📒 **SPENT AGAINST IT SO FAR: 0 credits.** The covers it was granted for turned out to be\n  already made — see `HANDOVER.md`. The allowance was never touched.\n  ✅ **And the prompt-review rule below still binds every credit spent: draft prompt → GPT\n  reviews it → only then generate.** Rework, not the base rate, is what actually costs.\n\n\n## Crossed-out lines moved out of the loaded rule books — 11 Sep 2026, 23:20\n`[HUMAN 2026-09-11]` Her words: *\"I can just get rid of the cross-out lines because it is going to add all those characters.\"* Each fragment below was struck-through wording sitting inside a file the AI reads every session or every turn. Removed from the live file, kept here word for word with the line it sat in, so nothing is lost and nothing is loaded.\n\n**21 fragments in all.**\n\n- **global rules**, line 46: ~~Draw a diagram where one helps.~~\n  in: `asks for them. Explain any jargon inline. ~~Draw a diagram where one helps.~~`\n- **global rules**, line 321: ~~GPT breaks the tie~~\n  in: `prompts are the same.\"* ~~GPT breaks the tie~~ — struck: the ROUTE is now`\n- **global rules**, line 397: ~~Up to 30 times~~\n  in: `products\"*.** ~~Up to 30 times~~ struck, not deleted. It is still a CEILING, not a`\n- **global rules**, line 591: ~~3 Sep: Word Search `4562427400` only, 1 view, 0 clicks, US$0.00.~~\n  in: `~~3 Sep: Word Search `4562427400` only, 1 view, 0 clicks, US$0.00.~~ **Struck, not`\n- **global rules**, line 604: ~~⛔ **A HUMAN MUST SWITCH THE CAMPAIGN OFF ON 9 SEP.**~~\n  in: `~~⛔ **A HUMAN MUST SWITCH THE CAMPAIGN OFF ON 9 SEP.**~~ ✅ **DONE — struck, not`\n- **global rules**, line 611: ~~⛔ \"COST NOTHING\": 136 views, 0 clicks, US$0.00 across 8 Aug – 7 Sep.~~\n  in: `~~⛔ \"COST NOTHING\": 136 views, 0 clicks, US$0.00 across 8 Aug – 7 Sep.~~ **Struck.**`\n- **global rules**, line 612: ~~🚨 SUPERSEDED: 383 views, 3 clicks, US$1.09. It is STILL RUNNING.~~\n  in: `~~🚨 SUPERSEDED: 383 views, 3 clicks, US$1.09. It is STILL RUNNING.~~ **Struck too.**`\n- **global rules**, line 634: ~~TRIGGER: 30 listings. Today 4 active + 1 draft. Do not spend until it reaches 30.~~\n  in: `- ~~TRIGGER: 30 listings. Today 4 active + 1 draft. Do not spend until it reaches 30.~~`\n- **global rules**, line 943: ~~one question at a time~~\n  in: `⛔ **~~one question at a time~~ CORRECTED 10 Sep 2026 — this file contradicted her`\n- **answer style**, line 84: ~~A confidence number roughly every third reply, not every one.~~\n  in: `⛔ ~~A confidence number roughly every third reply, not every one.~~ STRUCK`\n- **answer style**, line 96: ~~about 120 words~~\n  in: `⛔ ~~about 120 words~~ STRUCK 9 Sep 2026 BY HER RULING: \"150, one number.\"`\n- **answer style**, line 102: ~~NO CLOSING \"SO WHAT NEXT?\" LINE - withdrawn 9 Sep 2026.~~\n  in: `~~NO CLOSING \"SO WHAT NEXT?\" LINE - withdrawn 9 Sep 2026.~~`\n- **answer style**, line 170: ~~Not occasionally. A lot.~~\n  in: `failing. ~~Not occasionally. A lot.~~`\n- **answer style**, line 303: ~~FINISHED MEANS ONE WORD: \"Finished.\" Nothing else.~~\n  in: `~~FINISHED MEANS ONE WORD: \"Finished.\" Nothing else.~~`\n- **answer style**, line 323: ~~\"Done. Every fault found is fixed, checked and pushed.\"~~\n  in: `~~\"Done. Every fault found is fixed, checked and pushed.\"~~`\n- **answer style**, line 538: ~~⚠ deliverable_gate.py still demands it. Until that changes, say so.~~\n  in: `~~⚠ deliverable_gate.py still demands it. Until that changes, say so.~~`\n- **printables rules**, line 276: ~~\"in the browser\"~~\n  in: `⛔ **CORRECTED 11 Sep 2026 ON BOTH HALVES — ~~\"in the browser\"~~ and ~~Version 1~~.**`\n- **printables rules**, line 276: ~~Version 1~~\n  in: `⛔ **CORRECTED 11 Sep 2026 ON BOTH HALVES — ~~\"in the browser\"~~ and ~~Version 1~~.**`\n- **printables rules**, line 488: ~~Etsy title still says 25~~\n  in: `| Kawaii Bunny Coloring Pages (`4569910745`) | **A$3.63 base**, see below | LIVE, serving the OLD 25-page file. ⛔ **\"WHICH FAILS THE GATE\" IS WITHDRAWN 7 Sep — it was a GATE BUG.** `geometry.analyse` `\n- **printables rules**, line 718: ~~is sitting \"In review\" right now — not live, not on sale yet.~~\n  in: `~~is sitting \"In review\" right now — not live, not on sale yet.~~ ⛔ **STALE.** ✅ **BOTH AMAZON BOOKS ARE LIVE.** [MEASURED 2026-09-10, read live off the KDP bookshelf while signed in] The Quiet Atlas `\n- **printables rules**, line 728: ~~In review~~\n  in: `| Status | ✅ **LIVE** [MEASURED 2026-09-10, read live off the KDP bookshelf while signed in]. ~~In review~~ |`\n\n## Moved out of the global book — 11 Sep 2026, 23:45\n\n`[HUMAN 2026-09-11]` Rachel: *\"yes move them.\"* Three blocks that carried no live rule — pure history or a closed status — left `~/.claude/CLAUDE.md` word for word:\n\n- paragraph: the STANDING INSTRUCTIONS intro (the story of why the block exists) — 413 characters\n- section: NET-ZERO RULE — refused by both reviewers (history) — 2,655 characters\n- section: THE ETSY ADS TEST IS FINISHED (status, closed 9 Sep) — 5,892 characters\n\n### paragraph: the STANDING INSTRUCTIONS intro (the story of why the block exists)\n\n**Added 2 Sep 2026.** She asked why things were not updated after every conversation.\nThe cause was not the register: her standing instructions existed ONLY in chat.\nMeasured that day, \"run a multi-AI review\" appeared in **zero** always-loaded files,\n\"cheaper model\" in **zero**, \"until I can delete this task\" in **zero** — while she\nhad asked for them four, three and three times respectively in one afternoon.\n\n### section: NET-ZERO RULE — refused by both reviewers (history)\n\n## ⛔ NET-ZERO RULE: REFUSED BY BOTH REVIEWERS, AND RACHEL'S INSTRUCTION WAS OVERRIDDEN\n\n`[2026-09-02]` She approved *\"adding requiring removing\"* for the handover register.\n**ChatGPT `gpt-5-6-pro` and Gemini 2.5 Pro were each told to attack it, blind to each\nother. Both refused it.** Under her own decision rule (agree → act, do not ask), it was\nnot built — but it reverses her instruction, so it is written here rather than buried.\n\n- **GPT:** *\"Do not build the approved rule. It is a data-loss mechanism attached to a\n  meaningless metric.\"* It can be satisfied by deleting a blank line, editing one line\n  (most diffs count that as one deletion plus one addition), merging lines then adding\n  more, or sacrificing another job's state. **It does not cap tokens** — context is\n  measured in tokens, not lines — **and it does not survive parallel sessions**: two\n  branches each deleting the same line and adding a different one are individually\n  net-zero and grow when merged.\n- **Gemini:** *\"It institutionalizes the very error you just made... The failure is\n  silent, delayed, and catastrophic.\"* A session under time pressure deletes what is\n  cheapest, not what is least useful — blank lines, then headings, then timestamps and\n  evidence, then rationale. **Line count holds steady while information density rises.**\n\n**They named the SAME replacement, independently:** split the one file into three —\ndurable directives that ordinary sessions cannot delete from; per-job current-state\nrecords with a byte budget each; append-only history that is never auto-loaded. Then\nGENERATE the loaded register from the live records. **That is a rebuild and it is\nRachel's call.**\n\n✅ **What WAS built instead, 2 Sep:** a directive-loss guard in `handover.py`. It is the\ninverse of the rejected rule — rather than forcing deletion, it makes deletion visible.\nOn every Stop it fingerprints every line carrying ⛔ or 🚨, compares against the last\ncommitted register, and reports any that changed or vanished. **It never blocks and never\nedits content**, because both reviewers said a mechanism that silently rewrites the file\nis how the damage happened. ⚠ **Known limit, stated rather than hidden: rewording trips\nit too.** It fingerprints the first nine words, so a deliberate correction looks identical\nto a deletion. It is a prompt to look, not a finding.\n\n⚠ **GPT's first correction has NOT been made and is Rachel's:** remove the rule that\nevery session must touch the register. *\"Session stopped is not evidence that global\nstate changed.\"* That nag is the write-amplification engine — any edit satisfies it, so\nthe cheapest compliant write is an append.\n\n\n### section: THE ETSY ADS TEST IS FINISHED (status, closed 9 Sep)\n\n## ✅ THE ETSY ADS TEST IS FINISHED. THE CAMPAIGN IS OFF.\n\n**The ten-dollar Etsy Ads test.** `[HUMAN 2026-09-02]` Approved conditionally:\n*\"go ahead with the ten dollar etsy ads test after we have at least 30 listings.\"*\n`[HUMAN 2026-09-03]` She overrode her own trigger: *\"Go ahead it's okay till ninth\nSeptember.\"* The 30-listing condition never fired and is **dead** — do not enforce it.\n\n- ✅ **FINAL STATE `[MEASURED 2026-09-09 ~17:00, read off the live Ads dashboard]`.**\n  Campaign **PAUSED / OFF**. Etsy's own words on the page: *\"Your campaign is paused, so\n  your ads aren't reaching shoppers searching on Etsy\"* and *\"Your budget was US$1 when\n  you turned off your campaign, and you spent US$1.27 on ads.\"*\n  **414 views, 5 clicks, 0 orders, US$1.27 spent, US$0 earned** (10 Aug – 9 Sept).\n  ⛔ **EVERY EARLIER FIGURE IN THIS FILE IS SUPERSEDED, INCLUDING ONES MARKED \"LIVE\".**\n  The whole progression — 136/0/US$0.00 → 301/2/US$0.63 → 383/3/US$1.09 → 404/4/US$1.20 →\n  **414/5/US$1.27** — is ONE measurement at five moments, not five facts. Each was true\n  when written. **Quote only the last one, and only with its reading date.**\n  ⛔ **IT WAS NOT ONE LISTING. 21 LISTINGS WERE ADVERTISED** — read off Etsy's own\n  \"Select 21 on all pages\" control. Nobody logged the other 20 being switched on.\n  ⛔ **IT DID NOT COST NOTHING. US$1.27 was billed.**\n  ⚠ **NOBODY LOGGED WHO SWITCHED IT OFF, OR WHEN.** The 12:40 reading still said ON. It\n  was not any of the three automated attempts — all three failed. **An unlogged action\n  becomes a wrong fact everywhere downstream; this file is the proof.**\n  ⚠ **Both paid clicks were on WORKSHEETS** ($0.33 timed tests, $0.30 telling time).\n  **The Word Search took 36 views and ZERO clicks**, so this campaign does not measure\n  the listing it was set up to measure. Any conclusion about the Word Search rests on 36 views.\n **Struck, not\n  deleted — it was true when written.** Live figure: `claude desktoi/SPEND_LEDGER.md`.\n- 🚨 **CORRECTED 2026-09-04 BY MEASUREMENT — THERE IS NO SUCH MECHANISM.**\n  ~~⚙️ Scheduled task `stop-etsy-ads-9-sep` fires 9 Sep 09:00... a mecha
