   line, straight after the task line of rule 62: \"Chat: this chat is for keeping your rules\n      working and checking every job.\" Her words, 14 Sep 2026: \"After the task, you should just\n      um another sentence saying what the task or the chat was for.\" The separate Chat line was\n      her pick from three.\n\n\n## rule_change.py — change rule 66 — 2026-09-14 13:39\n\n[HUMAN 2026-09-14] 'Get rid of this chat. So I know the context of it. I don't want to just like read two more words.' Her pick: 'Drop this chat words'.\n\n### Rule 66 — old wording\n\n  66. THE TASK AND THE CHAT ARE ONE LINE AT THE END OF EVERY REPLY: what the task is, then\n      what the chat is for. Example: \"Task: open the Molly Keyser Etsy job · this chat hands the\n      idea to both computers.\" This replaces the separate Chat line.\n\n\n## rule_change.py — add rule (new) — 2026-09-16 22:02\n\n[HUMAN 2026-09-16] 'And if you can do it yourself, dont ask me to check - put it to rule'\n\n### Rule 68 — added\n\nIF YOU CAN DO IT YOURSELF, DON'T ASK HER TO CHECK. Before a reply says something works, test it yourself, live, on every app and every copy it touches. Ask her only for what no tool can reach: her own phone, a printed page, a login only she has.\n\n\n## rule_change.py — add rule (new) — 2026-09-16 23:03\n\n[HUMAN 2026-09-16] 'Rule- for digital products, put it live up-to 30 per day whenever finished. For app, always publish live when any change occur'; box picks: 'Price from the research' and 'Live straight away'\n\n### Rule 70 — added\n\nFOR DIGITAL PRODUCTS, PUT IT LIVE UP-TO 30 PER DAY WHENEVER FINISHED. FOR APP, ALWAYS PUBLISH LIVE WHEN ANY CHANGE OCCUR.\n      Digital products: once a product passes every check (95% sure it works, premium, better value than the top\n      competitors), list it on Etsy without asking, up to 30 a day. Etsy's listing fee is accepted. The price comes\n      from that product's own research.\n      Apps: whenever an app changes, publish it live straight away without asking, before or during checking. A\n      private app stays behind its password; publishing never makes a private app public.\n      This is her standing yes for these two kinds of going live; rule 7 still covers every other money, public or\n      hard-to-undo decision.\n\n\n## rule_change.py — add rule (new) — 2026-09-17 16:18\n\n[HUMAN 2026-09-17] \"get something that I can sell in the biggest market possible, and that it will sell like the very very unfailable market. Put them in the rulebook- Do only the things that is unavailable in the market, as in the number is so much better. At least I'm not sure how to word it right, but this rule will be looked at again if it doesn't work properly for the intention.\"\n\n### Rule 73 — added\n\nDO ONLY THE THINGS THAT ARE UNAVAILABLE IN THE MARKET, WHERE THE NUMBERS ARE SO MUCH BETTER. Empty is not the same as unserved. Before anything is made, open the competing SHOPS and read their SALES counts, not the search-result count: build only where a comparable shop is provably selling AND the thing we would add is missing. A shelf where sellers hold listings and almost no sales is a measured dead end however big the gap looks - 17 Sep 2026, three Australian aged-care shops held 22 listings and 11 sales between them, one of them over two years. Her note, in her words: this rule will be looked at again if it doesn't work properly for the intention.\n\n\n## rule_change.py — add rule (new) — 2026-09-17 20:05\n\n[HUMAN 2026-09-17] \"Make it into a rule to if um before I put it into the rule, just do a AI review if it is good idea to just put the list of generator for like each of the specific products because that looks like you've built it.\" then, shown both reviews: \"Yes, just go ahead if it is good.\"\n\n### Rule 74 — added\n\nPRODUCTS ARE BUILT FROM DECLARATIVE SPECS AND SHARED, TESTED TASK KINDS - BUT NEVER WITHOUT AN EXCEPTION. Use specs and shared kinds wherever they support the intended customer experience. A product or section MAY use a new renderer or bespoke construction when required by pedagogy, curriculum, accessibility, or meaningful visual differentiation, and every product carries some hand-made pages so a shelf of them does not read as machine-made. All released products must pass the common output checks. Wording from the blind two-model review of 17 Sep 2026 (BOTH_2026-09-17_generator_spec_rule.md): GPT-5.6-sol wrote the rule, Gemini 3.1 Pro added the hand-made pages. Both also said, separately, that a generator is not a reason to build more listings: find out why the existing ones do not sell first.\n\n\n## rule_change.py — retire rule 74 — 2026-09-17 20:06\n\n[HUMAN 2026-09-17] \"Yes, just go ahead if it is good.\" — retired ONLY to correct a number clash, not because she withdrew it: the other machine had already used 74 for the gate-override rule the same day. Re-added immediately as the next free number, same words.\n\n### Rule 74 — old wording\n\n  74. PRODUCTS ARE BUILT FROM DECLARATIVE SPECS AND SHARED, TESTED TASK KINDS - BUT NEVER\n      WITHOUT AN EXCEPTION. Use specs and shared kinds wherever they support the intended\n      customer experience. A product or section MAY use a new renderer or bespoke construction\n      when required by pedagogy, curriculum, accessibility, or meaningful visual\n      differentiation, and every product carries some hand-made pages so a shelf of them does\n      not read as machine-made. All released products must pass the common output checks.\n      Wording from the blind two-model review of 17 Sep 2026\n      (BOTH_2026-09-17_generator_spec_rule.md): GPT-5.6-sol wrote the rule, Gemini 3.1 Pro added\n      the hand-made pages. Both also said, separately, that a generator is not a reason to build\n      more listings: find out why the existing ones do not sell first.\n\n\n\n## rule_change.py — add rule (new) — 2026-09-17 20:06\n\n[HUMAN 2026-09-17] \"Make it into a rule to if um before I put it into the rule, just do a AI review if it is good idea to just put the list of generator for like each of the specific products because that looks like you've built it.\" then, shown both reviews: \"Yes, just go ahead if it is good.\"\n\n### Rule 75 — added\n\nPRODUCTS ARE BUILT FROM DECLARATIVE SPECS AND SHARED, TESTED TASK KINDS - BUT NEVER WITHOUT AN EXCEPTION. Use specs and shared kinds wherever they support the intended customer experience. A product or section MAY use a new renderer or bespoke construction when required by pedagogy, curriculum, accessibility, or meaningful visual differentiation, and every product carries some hand-made pages so a shelf of them does not read as machine-made. All released products must pass the common output checks. Wording from the blind two-model review of 17 Sep 2026 (BOTH_2026-09-17_generator_spec_rule.md): GPT-5.6-sol wrote the rule, Gemini 3.1 Pro added the hand-made pages. Both also said, separately, that a generator is not a reason to build more listings: find out why the existing ones do not sell first.\n"}, {"id": "digital-product", "title": "digital-product", "shelf": "Skill books", "path": "claude desktoi/.claude/skills/digital-product/SKILL.md", "kind": "md", "loaded": "When a printable is being made", "blurb": "Runs a product from the numbers through to the listing.", "chars": 17571, "date": "09 Sep 2026", "body": "---\nname: digital-product\ndescription: The whole route for making a printable product to sell — colouring books, mandalas, mazes, word searches, sudoku, dot-to-dot, planners, diaries, notebooks. Use it the moment anyone says \"make a new X\", \"build a X book\", \"another colouring pack\", \"a planner\", \"list this\", \"upload this\", \"is this ready to sell\", or asks what state a product is in. Use it BEFORE opening a generator, writing a build script, running QA, choosing a cover, writing listing copy, or touching Etsy or KDP. Do not use it for eBay/Temu (that is the `ebay-listing` skill) or for YouTube work.\n---\n\n# Making a digital product, start to finish\n\nThis is the route that already exists in this repo. Every step is here because\nsomething went wrong once and cost money or a listing. Nothing here is invented.\n\n**Where the detail lives.** This page is the route. It deliberately does not\ncopy the detail, because the single most expensive recurring fault in this\nbusiness is one fact living in six files and being corrected in one of them.\n\n| For | Open |\n|---|---|\n| The hard rules on quality, claims and covers | `QUALITY_STANDARD.md` |\n| What is live, what is banned, what already went wrong | `CLAUDE.md` |\n| The pre-listing gate | `release_check.py` + `release_registry.json` |\n| The research gate | `product_brief.py` |\n| The fixed prompt for an outside eye | `VISION_REVIEW_PROMPT.md` |\n\n**If this page and one of those disagree, THEY win and this page is wrong — fix\nit here in the same turn.**\n\n---\n\n## Before anything: two things that stop work before it starts\n\n1. **The release gate** (`QUALITY_STANDARD.md` §00). You may not start or\n   substantially revise another product until the current one has been looked at\n   exactly as a buyer sees it, every factual claim has evidence, and it has been\n   **listed or killed**. Not \"approved\". Not \"finished\". Listed or killed.\n   The diagnosis behind it, 24 Aug 2026: *\"a factory with no release gate\"* —\n   thirteen finished products on disk, zero listed.\n\n2. **Never hand-draw the artwork.** No SVG, HTML, CSS or code standing in for\n   real art. An LLM cannot see what it drew. This already ruined one product.\n\n---\n\n## 1. Research, BEFORE anything is made\n\nThis is a real gate, not a suggestion. It runs when a product is **declared**,\nnot when it ships, so stopping costs nothing — nothing is built yet.\n\n**Write `<product folder>/brief.json` first.** Four things, all required:\n\n| Field | What it must be |\n|---|---|\n| `buyer` | A named person in a named situation. Not a demographic. **At least 25 characters** — \"mums\" fails |\n| `demand` | `phrase`, `figure`, `source`, and **`read_on`** (a real date, `YYYY-MM-DD`) |\n| `competitors` | **At least 3**, each a real listing with a `price_aud` |\n| `value_claim` | Why it beats those three, at its price, on what a buyer can SEE |\n\nThen run it:\n\n```bash\npython product_brief.py <product-folder>\n```\n\n- A demand figure older than **90 days** fails. A future date fails. A date that\n  is not a date fails. *(Constants read out of `product_brief.py` on 9 Sep 2026:\n  `MAX_AGE_DAYS = 90`, `MIN_COMPETITORS = 3`, `MIN_BUYER_CHARS = 25`.)*\n- **It has been proved able to fail: 10 of 10 control cases** —\n  `python product_brief.py --selftest`.\n- **A number without the date it was read is not research.** It is a rumour with\n  a decimal point.\n\n**Where a demand figure comes from:** read it live off Etsy Marketplace Insights\nand write down the day you read it. Phrases move fast — one head term went from\n+81% to −12.2% in eight days (recorded in `CLAUDE.md`, re-measured 3 Sep 2026).\n\n⛔ **Do not quote `RESEARCH_INDEX.md` as research.** It was RETIRED on 2 Sep 2026\nafter an audit found, of ~50 claims, 19 false or superseded and 8 mislabelled.\nRead its top section — the audit itself is useful — then derive any number you\nneed from `market_research/cleaned/`.\n\n⛔ **A number you re-quote from a file is not research.** Leg 1 of the product\nbar is satisfied by a fresh reading only.\n\n⚠ **Known hole, found 7 Sep 2026 and fixed:** one `brief.json` used to satisfy\nevery product sharing a folder, so a brand-new pack passed on research about a\ndifferent product at a different price. A registry entry can now name its own\n`brief_file`. **If two products share a folder, give each its own brief file and\nname it in the registry.**\n\n⚠ **What this gate cannot do:** it does not look at the artwork. It never will.\nSomeone has to LOOK — that is step 4.\n\n---\n\n## 2. Building it\n\n**Declare the product in `release_registry.json` the day you decide to make it,\nnot the day you gate it.** The gate is only as early as the moment somebody\nremembers to declare the product, and historically that has been late — five\nplanners were registered after they were already built AND already live.\n\n**The pipeline shape, for anything drawn:** `generate → prep → gate → regenerate`.\nGate the **prepped** output, never the raw generation. The same image can be\nREJECT raw and clear every gate after `prep_page.py` has done its work.\n\n| Script | What it does |\n|---|---|\n| `prep_page.py` | Turns a raw generated image into a print-ready A4 page at 300 dpi with a guaranteed 10% margin. **Rejects clipped artwork rather than silently shrinking it** — you cannot repair a cut-off ear by adding a border |\n| `colouring_qa/run_qa.py` | The colouring decision. If/else, never an average — a page must not buy its way past a serious defect by scoring well elsewhere |\n| `colouring_qa/gate_pdf.py` | Runs that same gate on the finished **PDF**, the way a buyer receives it. Exists because the PNG-only version needed a manual render step, so it never got run |\n| `colouring_live/build_*.py` | The per-book colouring builds |\n| `colouring_live/make_listing_images.py` | The ten Etsy photos. Hero named as a constant, never picked by list position |\n| `word_search_taste_test/source/build.py` | Whole word-search book, deterministic — fixed seeds, no clock. Method diagram: `word_search_taste_test/GENERATION_METHOD.md` |\n| `../costway-scraper/publish.py` | The planner/diary line. **The only route to an uploadable file** — it builds, checks, and refuses. Self-tests 3 of 3 |\n| `preflight.py` | The older per-product runner. Not superseded, but `release_check.py` is the authority above it |\n\n**Two product lines, two folders.** Puzzles and colouring live here in\n`claude desktoi`. Planners, diaries and notebooks live in `../costway-scraper`.\nWorksheet packs live in `../testing`. All three are gated from the one registry.\n\n**Make the build deterministic** — fixed seeds, no wall clock. A build you cannot\nreproduce is a build you cannot prove anything about.\n\n---\n\n## 3. The gates\n\nOne command, before anything is uploaded or listed:\n\n```bash\npython release_check.py <product>\n```\n\nIt reads `release_registry.json` (**version 1.2.0, 31 products** — read\n9 Sep 2026), runs every gate that product has DECLARED as required, and hashes\nthe exact files a buyer receives before and after the run.\n\n**What makes it hard to fool** — each of these is a hole somebody drove through:\n\n- **A product missing from the registry is NOT GATED**, and it says so. Absence\n  is a failure, not a pass. Two colouring books went on sale while\n  `release_check.py` answered \"Unknown product\" for both. When it was finally\n  pointed at them on 6 Sep 2026, **both failed.**\n- **It never prints the bare word PASS.** The best it says is \"no known\n  violations detected by required gates\" — and then \"This is NOT a commercial or\n  aesthetic approval.\"\n- **A required gate must print a declared success sentence**\n  (`expect_success_line`), not just exit 0. Exit 0 means \"the script finished\",\n  including finishing by doing nothing. Three attacks went straight through the\n  old exit-code-only rule, including a gate that printed \"FAIL … DO NOT SHIP\"\n  and exited 0.\n- **CANNOT MEASURE is separate from FAIL, and blocks just the same.** A gate that\n  crashed did not reach a verdict. Both stop the release; only the wording\n  differs, and it tells you whether to fix the product or the machine.\n- **Zero required gates with no written reason is a failure.**\n- **If an artefact changes while the run happens, the evidence is VOID.**\n- `--audit` runs **no gates at all** and exits 2 so it cannot be mistaken for a\n  clean run.\n\n**How much a clean run is worth — say both numbers or neither.**\n`[MEASURED 2026-09-09, counted from release_registry.json]` **174 of 174 required\ngates have been proved able to fail (100%).** But a gate is a script containing\nmany checks, and **check-level coverage is about 7.5%**. Quoting only the first\nnumber is how this repo flatters itself.\n\n⚠ **This number moves within a single day.** It read 168 of 168 on the morning of\n9 Sep 2026 and 174 of 174 that afternoon — two commits added gates in between, so\nboth were right when written. **Count it before you quote it.** The old command\nprinted in `CLAUDE.md` crashed on this machine (Windows read the registry as\ncp1252); this is the one that works:\n\n```bash\npython -c \"import json,io;d=json.load(io.open('release_registry.json',encoding='utf-8'));r=[g for p in d['products'].values() for g in p['gates'] if g.get('level')=='required'];print(sum(1 for g in r if g.get('negative_tested')),'of',len(r))\"\n```\n\n### The geometric numbers — colouring and line art\n\nAuthority is `QUALITY_STANDARD.md` §4. **If these disagree with it, it wins.**\n\n- **Enclosed regions: inscribed circle ≥ 2.5 mm** (target 3.0 mm). Area is the\n  wrong metric — a 0.6 × 12 mm sliver has 7.2 mm² and is horrible to colour.\n- **How much sub-2.5 mm area is allowed depends on the positioning**, and the\n  positioning must be written in the product README *before* QA runs:\n\n  | Positioning | Max % of colourable area under 2.5 mm |\n  |---|---|\n  | Bold and easy / large print | **1.0%** |\n  | Standard adult | **2.0%** |\n  | Intricate / mandala | **3.5%** |\n  | Any positioning — hard stop | **8.0%** |\n\n  *(Bands set 27 Aug 2026 from 20 pages across 3 product lines. Defensible\n  starting numbers, not proven ones.)*\n- Negative space **0.32–0.52** · worst annulus **≥ 0.20** · zone density contrast\n  **max/min ≥ 1.5** · texture strokes **≥ 0.65 mm** apart.\n- **Four stroke weights in mm, never one:** 0.38 / 0.28 / 0.20 / 0.15.\n- **Report the measured figure every run, pass or fail.** A gate whose number is\n  not printed is a gate that can be switched off unnoticed — which is exactly how\n  `mandala_book` shipped 30 pages against a **disabled** check.\n- **No implementation invents its own threshold.** They all import from\n  `colouring_qa/geometry.py`. When they did invent their own, the same plate\n  passed or failed depending on whose script ran.\n\n⚠ **A gate can be wrong in the strict direction too.** `geometry.analyse` divided\na full-page render by the live-area width, making every millimetre **1.1667×\ntoo small** for months. A page was CUT from a product on a false reading of 2.47%\nthat was really ~1.46%. Fixed 7 Sep 2026, proved by\n`colouring_qa/selftest_raster_scale.py`, 3 of 3. **Never quote a pre-7-Sep\ncolouring measurement.**\n\n---\n\n## 4. Look at it. Every time.\n\n**This is the step measurements cannot replace, and it is the one that keeps\ngetting skipped.** A product passed 1,329 automated checks and 60 QA gates,\ncleared a formal sign-off, and was judged *\"a A$3 auto-generated pack, not an\nA$8.50 product\"* the moment somebody actually looked.\n\n> QA numbers tell you what you are ALLOWED to say. They do not tell you the\n> product is good, and they never become the thing you say.\n\nThree separate pairs of eyes, in this order:\n\n1. **Yours.** Render the pages to PNG and read them. Claude reads rendered PNGs\n   directly — \"an LLM cannot see what it drew\" is true of generated SVG, and\n   **false** of a rasterised page. Look at the set as a contact sheet, so pages\n   are judged against each other.\n2. **An outside model, every round, with a FIXED prompt.**\n   `VISION_REVIEW_PROMPT.md` is that prompt — do not edit it to suit a product,\n   or round-to-round scores mean nothing. Route:\n   `python review_board/ask_openai_api.py --image <png>`.\n   Say the estimated cost in your reply before you call it; stop and ask at or\n   above US$0.10. Gemini goes through Vertex (`review_board/ask_gemini_vertex.py`),\n   never the Gemini API key.\n   Record it as `INDEPENDENT_VISION_REVIEW_<product>_<date>.md` **including bad\n   verdicts — especially bad ones.**\n3. **Rachel, for the cover.** `[HUMAN 2026-09-08]` Build a candidate contact\n   sheet, send it, and let her pick **before** the image goes up. The cover is\n   the one thing that wins or loses the click. Once chosen, name it as an\n   explicit constant (`COVER_PLATE`) so a rebuild can never silently change it —\n   `plates[len(plates)//2]` once put the muddiest page in the book on the shop\n   front.\n\n**Then cut.** The weakest page sets the perceived value of the whole product, not\nthe best. Thirteen good pages beat thirty mixed ones. Do not pad to a round\nnumber and do not excuse a weak page as \"advanced difficulty\".\n\n**Stop iterating** when a round produces no measurable improvement. Past that,\nit is sunk cost.\n\n---\n\n## 5. Claims — what may not be written anywhere\n\nEvery claim must trace to a measurement actually taken.\n\n**Banned unless specifically re-measured** *(full list and reasons:\n`QUALITY_STANDARD.md` §6)*: \"exactly symmetrical\" · \"true N-fold axis\" — the same\noverclaim in technical dress · \"every line closes where it should\" · \"sharp at\nany size\" / \"however large you print it\" · \"no AI artefacts\" as a consequence of\n\"no image model\" · **\"hand-drawn\"** — it is algorithm-drawn, never blur that line.\n\n**Any NUMBER in buyer-facing copy must be measured off the RENDERED artefact.**\nA build-metrics JSON records what the generator intended, not what printed.\nIf you cannot defend the number, **delete it — do not lower it.** Two different\ncorridor-width figures were published for one book and **both were false**.\n\n**Check four surfaces, not one.** The listing text is the one people check. The\nothers are where it keeps going wrong:\n\n- the **cover**\n- the **title page and front matter** — one printed \"sharp at any size\" after\n  that claim had been cut from the listing\n- the **PDF's hidden properties** (title, author, metadata)\n- the description, the bullets, and **the words baked into listing images**\n\n**Scope a claim to the thing it is true of.** The core Kawaii book is fully\nvector; its Cozy Animals bonus is placed PNG at 262 dpi. So \"fully vector\" is\nfalse of the bundle and true of the book. Both outside reviewers called that a\nblocker, independently, 8 Sep 2026.\n\n---\n\n## 6. Listing it\n\n⛔ **Rachel presses Publish. Not you.** Draft it, stage it, hand over the click.\nAmbiguous phrasing is not a yes.\n\n**The rule that costs money when it is broken: change the FILES and the WORDS in\nthe same action.** A description saying \"25 pages\" is *correct* while the\n25-page file is served, and becomes a lie the moment a 24-page rebuild is\nuploaded. One session fixed a title and told nobody; roughly 24 files went on\nrepeating the old claim, including the gate's own registry entry.\n\nChange together, or not at all:\n\n- the PDF files themselves\n- the page count and every other number in the description\n- the title, and the listing images if they carry a claim\n- `release_registry.json` (status, price, artefact list)\n- the record in `CLAUDE.md` and `HANDOVER.md`\n\n**Etsy specifics:**\n\n- **AI disclosure lives on TWO surfaces** and both must be set: a sentence in the\n  description, **and** the structured \"How it's made\" setting — `whatContent`\n  must read `ai_gen`, not `original`. Etsy explicitly permits AI-assisted\n  artwork; the disclosure is the condition.\n- **Price:** Etsy shows the seller the pre-GST base; the buyer sees about +10%.\n  A$5.91 base is A$6.50 to a buyer. **That is not a pricing bug — do not\n  \"correct\" it.**\n- **A real, time-limited sale is allowed** `[HUMAN 2026-09-08]`; a permanent\n  list-high-then-50%-off anchor is not. Prices themselves are hers.\n- **After uploading, verify from Etsy's server** — reload in a fresh tab and read\n  it back, ideally by SHA-256 of the file downloaded from the live listing. The\n  editor showing something is not evidence it saved.\n- **Read the live listing, never the file that describes it.** Three facts about\n  one listing — title, price and disclosure — were all wrong in the repo at once,\n  all the same way: somebody changed the shop and nobody changed the record.\n\n⚠ `ETSY_UPLOAD_SEQUENCE.md` has the field-by-field form walkthrough and is still\nuseful for that. **Its ordering advice is stale** — it says list the mandala\nfirst, and the mandala is now DO NOT LIST.\n\n**Amazon KDP is a different animal.** Editing locks during review, the AI-content\ndeclaration is a separate setting that has silently failed to save before, and a\nphysical print proof matters there in a way it does not for a download. Read the\nQuiet Atlas blocks in `CLAUDE.md` before touching KDP.\n\n---\n\n## What this skill does not cover, on purpose\n\n- **eBay and Temu** — different business, different skill (`ebay-listing`).\n- **Market numbers.** Derive them; do not carry them here. A number in a skill\n  file rots exactly like a number in any other file.\n- **The full geometry spec, the full banned-claims list, the full listing form.**\n  Pointed at, not copied.\n- **Whether the thing is any good.** No file in this repo can tell you that.\n  `release_check.py` says so itself: *\"any evidence at all that a buyer would\n  choose this over the thumbnail next to it — no check in this repo can see\n  that.\"*\n"}, {"id": "ebay-listing", "title": "ebay-listing", "shelf": "Skill books", "path": ".claude/skills/ebay-listing/SKILL.md", "kind": "md", "loaded": "On demand", "blurb": "The eBay listing steps.", "chars": 4478, "date": "09 Sep 2026", "body": "---\nname: ebay-listing\ndescription: Use when given an eBay listing CSV, an eBay upload result file, a supplier product URL (Temu, Artiss, LifeZeal, Costway), a Seller Hub export, or any request to scrape products, build a bulk-upload file, revise live listings, or restart the eBay side of the business. Read this BEFORE proposing any of it — the model lost money and one step of it breaks eBay policy.\n---\n\n# eBay listing pipeline\n\n## Read this first — two things stop work before it starts\n\n**1. Temu as a supplier is dead. −$604 across 39 sales.**\n`HANDOVER.md`, standing rule. Do not scrape Temu. Do not propose it.\nRead it precisely: **Temu as a SOURCE is dead — the eBay ACCOUNT status is unconfirmed.**\nA session once read the compound version, told Rachel her eBay business was shut, and she\nchallenged it. Nobody has opened the account. Do not assert either way.\n\n**2. Buy-after-sale dropshipping breaks eBay policy.**\neBay AU, read live 8 Sep 2026: *\"Listing an item on eBay and then purchasing the item from\nanother retailer or marketplace that sends it directly to your customer is not allowed.\"*\nPenalty includes account suspension. Fulfilling from **pre-purchased wholesale stock is fine**.\nFull reasoning: `Desktop/temu/EBAY_AUTOMATION_DESIGN_2026-09-08.md`.\n\nSo: **anything that automates buy-after-sale is refused, not built.** Say so and stop.\n\n---\n\n## What the numbers actually said\n\n| | |\n|---|---|\n| Live listings at peak | 190 |\n| Sold | 5 |\n| Where those 5 sales came from | **older non-Temu stock** |\n| Sales from the 120 Temu listings | **0** |\n| eBay's own banner | *\"Your prices are 32% higher than similar items\"* |\n\nPriced at cost × 1.15 ÷ 0.87 — about 30% markup, **shipping not included**. On bulky items\npostage ate the margin. That is the mechanism behind the −$604.\n\n---\n\n## Where everything lives\n\n`C:\\Users\\soyan\\Desktop\\temu\\`\n\n| Script | Does |\n|---|---|\n| `scrape_products_v2.py` | Supplier page → structured fields, via Gemini on Vertex |\n| `build_bulk_csv.py` | Category mapping + pricing → upload CSV |\n| `build_master.py` | One file, all products, Action column per row |\n| `build_sheet_master.py` | Strips the huge columns so it fits in Sheets |\n| `merge_sheet_export.py` | Puts them back after a Sheet edit |\n| `rebuild_csv_from_jsonl.py` | **Run whenever the column list changes** |\n\nNotion board: <https://app.notion.com/p/3c5d360cea8381818d18cacacb1c259f>\n\n---\n\n## If work is genuinely authorised, the mechanics that cost hours to find\n\n**Scraping**\n- **Scroll back to the top before collecting images.** Temu virtualises the DOM — a full-page\n  scroll unmounts the gallery and 34 products came back with zero photos.\n- **Close leaked tabs after every product.** Gallery clicks open `target=_blank` tabs; they\n  reached 108, Chrome choked, and two long runs died.\n- **Click \"See all details and dimensions\"** or you capture only the battery safety notice —\n  which made 16 unrelated products all look like \"Rechargeable Battery\".\n- **Strip `?imageView2/...` from image URLs.** The bare URL is the native original and is always\n  equal or larger; the parameter caps at 1600px and re-compresses.\n- Headless Playwright is blocked. Visible Chrome over CDP works. Chrome 151 refuses remote\n  debugging on the **default** profile — use a separate `--user-data-dir`.\n\n**Building the CSV**\n- **The scraper appends.** A stale header silently drops newly added columns.\n- **CustomLabel is the title truncated to 60 chars**, so near-identical products collide on one\n  SKU and eBay treats them as one inventory item.\n- **Item specifics are per category.** Furniture wants dimensions; headphones want Model +\n  Connectivity + Colour; watches want Compatible OS + Band Material + Case Size; power tools\n  want Voltage + Battery Included. Expect a rejection round and add the fields eBay names.\n- Dimensions are **not** universally required — assuming they were wasted a day.\n\n**Sheets**\n- `IMAGE()` cannot load `img.kwcdn.com`. Photos will not render.\n\n---\n\n## Settled, do not reopen\n\n- **Google/Gemini always via Vertex**, project `gen-lang-client-0626840434`, location `global`.\n  Never the AI Studio key — it has no credit.\n- **Storage: Google Sheets**, not Airtable.\n- **No dispatch-speed or reply-speed promises** in any listing description.\n- **Apify was tested and rejected** for Temu — 1 image per product, null specs.\n\n---\n\n## The one number nobody has\n\nWhether the eBay account is open. **Check it before saying anything about it.**\n"}, {"id": "notion-summary", "title": "notion-summary", "shelf": "Skill books", "path": ".claude/skills/notion-summary/SKILL.md", "kind": "md", "loaded": "On demand", "blurb": "How work gets written back into Notion.", "chars": 12219, "date": "09 Sep 2026", "body": "---\nname: notion-summary\ndescription: Read a Notion page, database or set of Notion notes and give Rachel a glanceable summary in her answer style, ending with a clickable .md file. Use this whenever a Notion link or page name comes up and she wants to know what is in it or what changed — \"summarise this Notion page\", \"catch me up on the Command Center\", \"what does START HERE say now\", \"what's in my Master Tasks\", \"digest my Notion notes\", \"is that page still current\" — and also when a question can only be answered by reading a Notion page. Use it even when she does not say the word \"summarise\". Do NOT use it for YouTube or video transcripts; the `summarise` skill owns those.\n---\n\n# Summarising Notion for Rachel\n\n## Why this skill exists\n\nHer Notion is the business's memory: current state, decisions, logs, research. It has\ngrown faster than anyone has pruned it, so the job is not \"shorten the page\". It is\n**tell her where things stand, and warn her where the page is lying to her.** A summary\nthat quietly repeats a stale number is worse than none, because she will act on it.\n\nThe difference this makes, measured on real pages: a plain read *transcribes* what a\npage claims. A good read *interrogates* it — opens the evidence behind a row marked\nDone, adds up a table and checks it against the total the page itself states, notices\nthat two sections disagree. That interrogation is the whole value. Everything below\nexists to make it happen reliably.\n\nShe also listens rather than reads for part of the day, so **the .md file is the\ndeliverable**, not a courtesy at the end.\n\n## When NOT to use this\n\n- **Video or podcast transcripts** — the `summarise` skill owns those. If a Notion page\n  turns out to BE a transcript (Transcript Archive, Deep End library, meeting notes),\n  say so and hand over rather than doing a worse version here.\n- **Writing to Notion.** Read only. Changing a page is a separate job that alters shared\n  state — confirm first.\n\n## Step 1 — Get the right page, and be sure of it\n\n- A URL or ID → `notion-fetch` directly.\n- A name → `notion-search`, or `notion-list-recent-pages` for \"the one I was just in\".\n- Her front doors when she is vague: `🚦 START HERE — AI Handoff (live state)`,\n  `🌸 Command Center`, `🗺️ Workspace Map`, `NOW`.\n\nHer workspace holds deliberate near-duplicates — `… — TEST` copies, archived versions,\ntwo databases with similar names. **Check the title that comes back against the words\nshe used, even when she gave you a URL.** A URL proves which page you fetched; it does\nnot prove it is the one she meant. If two candidates are plausible, name both and say\nwhich you read.\n\n## Step 2 — Read all of it, and know the size of what you did not read\n\n### The fetch will fail on her big pages. Plan for it.\n\nHer most important pages are the largest. `START HERE` measured 93,316 characters when\nread on 9 Sep 2026, and a single fetch of it **exceeds the tool's limit and returns a\nfile path instead of content**. (That figure carries its reading date because this skill\nasks the same of every number it reports — including its own.)\n\nWhen that happens: read the persisted file in slices of about **24,000 characters** until\nyou have covered all of it. The tool's own error message suggests spans of 80,000, which\nwill blow a smaller session's context — pick the smaller number and take more passes.\nDo not summarise the first slice and stop. Sampling a live-state page and presenting it\nas a summary of the page is the failure this whole skill exists to prevent.\n\n### Do not trust missing fields to mean \"nothing was cut off\"\n\n`notion-fetch` *may* return `truncated`, `unknown_block_count` and `unknown_block_ids`.\n**It often does not, and a database fetch never does.** Absence is not reassurance —\ninferring \"nothing was truncated\" because the field is missing is the same mistake as\nconcluding an empty folder means a quiet day.\n\nSo establish coverage by counting the content itself:\n\n| What you fetched | The unit to count |\n|---|---|\n| A page | `##`, `###` and `####` headings, and callout blocks — all four, counted separately |\n| A database | rows returned vs rows the database holds (`has_more`). **None of the heading units above exist on a database fetch — do not go looking for them. `references/databases.md` governs from here.** |\n\nAll three matter, and reporting only the top level is how two readers report the same\nnumber having read wildly different amounts. On her pages the ⛔ and 🚨 callouts often\ncarry the most load-bearing content, and sub-headings frequently carry more than their\nparents — the Etsy traps and the open-item lists live at `###`, and 25 `####` blocks on\nthat page hold the KDP tax fix, the mandala diagnosis and the false-claims tables.\nStopping at `##` understates what you read by about a fifth.\n\nThen report coverage with every unit stated — *\"21 sections, 36 sub-sections, 25\nsub-sub-sections, 4 callouts\"*, *\"49 of 60 rows\"* — so two different sessions reading the same page report\nthe same figure.\n\n**If your count disagrees with a count someone recorded earlier, the source may be\nmoving rather than one of you being wrong.** Her task database was measured three times\nin one hour with three different status splits and a constant row total. Say when you\nread it, and let the two readings stand side by side. Never write \"everything\", \"the whole page\", or \"nothing else of note\".\n\n**Sub-pages and embedded databases are not read automatically.** Count them, name them,\nand say they were not read. Listing what you skipped is what makes the count honest.\n\n## Step 3 — Sort what you read into five buckets\n\n| Bucket | What goes in it | Why it is separate |\n|---|---|---|\n| **Where it stands** | The current state the page describes | What she came for |\n| **Already decided** | Decisions with a person and a date on them | So nobody re-opens a settled thing |\n| **Traps already paid for** | Things that failed before, and the workaround someone bought with real time | Often the most useful content on her pages, and it fits nowhere else |\n| **Waiting on you** | Money, anything public, anything hard to reverse, anything the page marks unanswered | The only part needing her hands |\n| **Don't trust this** | Stale figures, passed dates, the page contradicting itself or contradicting a source outside Notion | Her documented failure mode is a corrected fact left wrong in five other places |\n\nThe template is a **floor, not a ceiling** — add a section when the page holds something\nthese five do not fit, and drop any that would be empty. If \"Waiting on you\" is empty,\nsay so in one line; that is good news and she should see it.\n\n### How to fill the last bucket properly\n\nThis is the part that separates a real summary from a transcription. Three moves:\n\n1. **Undated numbers.** Her own test: a number with no reading date is a rumour with a\n   decimal point. Flag figures with no \"as at\" date, dates that have passed, and\n   statuses like \"pending\" or \"in flight\" that are older than a week — **measured\n   against today's date, and stamp today's date in the file** so the summary ages\n   visibly instead of silently.\n2. **Do the arithmetic, on the page's numbers and on your own.** Add up every count and\n   check it against the total claimed. A table that does not reconcile with its own total\n   is a finding, and it has been caught in real runs.\n\n   **Your own counts are held to the same standard, and this is where it goes wrong.** A\n   real failure from a run of this skill: it wrote \"nine of the fifteen finished rows hold\n   up\" alongside six it disputed — but one row appeared in both lists, so it had accounted\n   for fourteen and quietly lost one. Nine plus six equalling fifteen was never checked.\n   So: **name the items, do not just count them, and check that nothing appears twice and\n   nothing is missing.** A number you did not enumerate is a claim about your own\n   completeness, which is the one claim you are not allowed to make.\n3. **Open the evidence on at least one settled thing.** A row marked Done whose evidence\n   field describes the broken state is not done. Status fields are claims; evidence\n   fields are the check on them.\n\nWhere two things disagree, **show both sides, say which is newer, and edit nothing.**\nHer standing rule is that newer wins, but the older text stays until she says otherwise.\n\n**When the newer claim is the less credible one, say so.** Her rule already allows this:\nwhere a newer entry was clearly never meant to settle this case, that is a question for\nher rather than a clash to resolve. A real example from her own page — a 5 Sep entry\nreports opening the Etsy search check with specific findings, and a 7 Sep entry says it\nhas \"still never been opened\". Newer wins on the date and loses on the evidence. Put\nboth in front of her and name which you would trust.\nThis applies whether the disagreement is inside the page or between the page and\nsomething outside it.\n\n**Something true and important that is not on the page**: include it, but label it\nplainly as coming from outside the page. Scope is the page; her interests are not.\n\n## Step 4 — Write it in her style\n\nAnswer first. Very few bold lines. Facts before jargon.\n\n**This template is for a page. A database uses a different one — see\n`references/databases.md` before writing anything.**\n\n```markdown\n# <Page title> — where it stands\n\n**<The single most important thing, in one line.>**\n\n## Where it stands\n- <dot points, ELI10, plain words>\n\n## Already decided\n- <decision — who, when>\n\n## Traps already paid for\n- <what failed, and the workaround>\n\n## Waiting on you\n- <the thing only she can do, and why it needs her>\n\n## Don't trust this yet\n- <stale figure / contradiction — and what would settle it>\n\n## What I read\n<21 sections + 4 callouts. Not read: 6 embedded databases, 12 sub-pages (named).\nPage last edited <date>. Read <today's date>.>\n```\n\n**The length rule does not bind `Waiting on you` or `Don't trust this`.** Say every\nitem in both, however many there are — those are the sections she acts on, and a trimmed\naction list is a summary that costs money. It binds everything else, hard. Be honest with\nyourself about which is which rather than letting \"it's all important\" turn the whole file\ninto an action list. Tables compress better than prose and she has asked for them.\n\nAlso:\n- **Fact first, then the word in brackets.** \"383 people saw the ad, 3 clicked\n  (click-through rate).\" Never the other way round.\n- **Never narrate your own work.** No \"I fetched\", no \"you asked me to\". The coverage\n  line in `What I read` is the one permitted exception.\n- **Quote the page's own words** for anything load-bearing — a decision, a number, a\n  refusal. Paraphrase is where meaning drifts.\n\n## Step 5 — Hand it over as a file\n\nWrite the summary to a `.md`, send it with `SendUserFile`, and end the chat reply with\n`File: <full path>`.\n\nFilename: `NOTION_<YYYY-MM-DD>_<page-slug>.md` — slug lowercase, hyphen-separated,\nemoji and bracketed suffixes dropped (`🚦 START HERE — AI Handoff (live state)` →\n`start-here-ai-handoff`).\n\nPut it in the folder the work belongs to, not a scratch directory she cannot find.\n**If a caller pinned an output path or said not to send the file, the caller wins** —\nfollow the instruction and say which part of this you set aside.\n\n## Databases, logs and other awkward cases\n\nDatabases behave differently enough to be worth their own page. Read\n`references/databases.md` before summarising any database, including `Master Tasks`\nand the transcript libraries.\n\nQuick guidance for the rest:\n\n- **A log page** (`Daily Log`, `Run-Log`) → the trend and the last entry, not every\n  entry. Say when the last entry was and whether the log has gone quiet.\n- **An empty or near-empty page** → say it is empty. An absent thing does not look like\n  an error, it looks like a quiet day, and that has cost real work before.\n- **Permission or fetch failure** → name the page and the error. Never summarise around\n  a hole without saying there is one.\n- **She asked a question, not for a summary** (\"does the ads page say it's off yet?\") →\n  answer the question in the first line, then the short summary underneath. The question\n  is the job; the summary is context.\n"}, {"id": "board", "title": "/board", "shelf": "Commands", "path": ".claude/commands/board.md", "kind": "md", "loaded": "When you type it", "blurb": "", "chars": 1736, "date": "08 Sep 2026", "body": "---\ndescription: Refresh the published AI Handoff Board with the latest collected data\n---\n\nPush the current board data to the published AI Handoff Board. Three steps, no judgement.\n\n1. Rebuild the data and the page — plain scripts, no AI, no tokens:\n\n   ```\n   cd \"C:\\Users\\soyan\\claude desktoi\"\n   python board_data.py\n   python build_board.py\n   ```\n\n2. Push the data into the published page's store. One tool call:\n\n   Artifact, `action: \"write_db\"`, `db_op: \"set\"`,\n   `url: https://claude.ai/code/artifact/153db54e-b43e-44dd-b289-5a9a3ea413f4`,\n   `collection: \"board\"`, `doc_id: \"current\"`,\n   `file_path: C:\\Users\\soyan\\claude desktoi\\board_data.json`\n\n   Every open copy of the page updates. Republishing the HTML is only needed when the\n   page's own words or layout change — not when the numbers move.\n\n3. Stamp the hash so the scheduled job stops asking, and clear the marker:\n\n   ```\n   cd \"C:\\Users\\soyan\\claude desktoi\"\n   python -c \"import io,json,os,board_data; d=json.load(io.open('board_data.json',encoding='utf-8')); io.open('.board_last_pushed.sha256','w',encoding='utf-8').write(board_data.signature(d)); os.path.exists('BOARD_PUSH_NEEDED.txt') and os.remove('BOARD_PUSH_NEEDED.txt')\"\n   ```\n\n**Why a person has to run this.** Measured 4 Sep 2026: a headless `claude -p` session has\nno Artifact tool. A wrapper that called it anyway logged a push that never happened. The\nscheduled job therefore writes `BOARD_PUSH_NEEDED.txt` and stops, rather than pretending.\n\n**If a platform reading is stale**, the board says so and counts the days. Fixing it means\nopening Etsy or KDP, reading the value, and updating `board_facts.json` with the value\n**and its `read_on` date together**. Never update one without the other.\n"}, {"id": "pickup", "title": "/pickup", "shelf": "Commands", "path": ".claude/commands/pickup.md", "kind": "md", "loaded": "When you type it", "blurb": "", "chars": 6130, "date": "09 Sep 2026", "body": "---\ndescription: Pick the work back up on a different computer or Claude account, and find work stranded on one machine\n---\n\nRachel has changed computer, changed Claude account, or wants to know whether\nanything is stuck on the machine she is sitting at. Work out which, then act.\n\n## Why this command exists\n\nHer business is six GitHub repositories, a rule book, a register of current\nstate, and a pile of connectors and keys. **The files survive a machine change.\nAlmost nothing else does.** Two events get confused with each other and their\nrecovery pages say opposite things, so the first job is telling them apart.\n\n| The event | What survives | Which page |\n|---|---|---|\n| **New Claude account**, same computer | Every file, rule, hook and repository | `~/home-notes/RECOVERY.md` |\n| **New computer** | Only what reached GitHub | `~/home-notes/COMPUTER_RECOVERY.md` |\n| **Both at once** | Only what reached GitHub | COMPUTER_RECOVERY first, then RECOVERY |\n\n⛔ **Never state what survives from memory.** That claim has been wrong in this\nbusiness twice, most recently by naming three repositories when there are six.\nOpen the page and read it.\n\n## Step 0 — Measure which machine you are on. Never infer it.\n\nThe two machines use different paths for the same thing, and a session that\nguesses hands her a Windows path on the Mac.\n\n```\nuname -s 2>/dev/null || echo Windows\n```\n\n| | Mac | Windows |\n|---|---|---|\n| The register | `~/HANDOVER.md` | `C:\\Users\\soyan\\HANDOVER.md` |\n| The recovery pages | `~/home-notes/RECOVERY.md` | `~\\RECOVERY.md` |\n| The main shop folder | **not cloned on the Mac at all** | `~\\claude desktoi` |\n\n## Step 1 — Ask \"is any work stranded on this computer?\" before anything else\n\n```\npython3 ~/home-notes/status/check_stranded.py\n```\n\nReads only. Commits, pushes and deletes nothing. Exit 0 safe · 1 work is\nstranded here · 2 it could not scan, which is a refusal, not a pass.\n\n⛔ **Do not hand-roll a git one-liner instead.** A branch with no upstream makes\n`git rev-list @{u}..HEAD` fail, and a one-liner ending `2>/dev/null` turns that\nfailure into \"0 unpushed\" — a false all-clear, in a business whose recorded\nfailure mode is exactly false completion.\n\n⛔ **`check_stranded.ps1` is Windows-only and CANNOT run on the Mac** — no\nPowerShell is installed there, measured 9 Sep 2026. Any instruction telling a\nMac reader to run the `.ps1` is wrong; the `.py` runs on both machines.\n\n⭐ **It finds folders rather than being told about them.** The `.ps1` hardcodes\nfive Windows paths. The Mac has nine checkouts across six repositories, three of\nwhich no recovery page mentions. A hardcoded list reports a clean machine while\nwork sits in a folder the list never heard of.\n\n## Step 1b — If anything is stranded, the fix is usually one command\n\n```\npython3 ~/home-notes/status/sync_all.py\n```\n\nPulls what the other machine finished and pushes what this one finished, in **every** repository —\n`.claude/hooks/git_sync.py` is a PROJECT hook and only sees the folder Claude is in. Added 9 Sep\n2026 after `~/testing`, the folder the register calls the source of the live shop, was found **475\ncommits behind**. It runs itself every 30 minutes via launchd `local.claude-sync-all`; run it by\nhand when you need it now. `--status` reports without changing anything.\n\n⛔ **It will NOT save unsaved work for you** — an auto-commit ships another session's half-written\nfile. Unsaved files are reported only, so a stranded-work report can still need a person.\n\n## Step 2 — Read what is already running, so you do not repeat it\n\nOpen the register's **IN FLIGHT** table before starting anything. Two or three\nsessions work these folders at once, and two have already done the same job\nwithin an hour of each other.\n\nTrust lines by their tag — `[VERIFIED]` someone opened the file · `[REPORTED]`\nsecond-hand, re-check before acting · `[HUMAN]` Rachel said so.\n\n## ⛔ On the Mac there are TWO different registers with the same name\n\nMeasured 9 Sep 2026. They are not two versions of one file — they are two\ndifferent documents:\n\n| File | Size | What it is |\n|---|---|---|\n| `~/HANDOVER.md` | 238 lines | **The one the SessionStart hook actually loads.** Written on the Mac, jiwan2603 account, 8 Sep |\n| `~/home-notes/HANDOVER.md` | 435 lines | The versioned register in the `home-notes` repository — the one the recovery pages and the Windows machine mean |\n\nTheir headings do not overlap. Everything in the second one's IN FLIGHT table —\nTripshare, the AFR summary, the three live products with fixed files waiting —\n**reaches no Mac session at all.**\n\nSo on the Mac, read BOTH before you tell her what is in flight, and say which one\nyou read. On Windows the home folder *is* the repository, so there is only one.\n\n⚠ The hook's directive-loss guard runs `git -C ~`, and `~` is not a git\nrepository on the Mac. That guard has therefore never fired here.\n\n## Step 3 — Only now, open the right recovery page and follow it\n\nDo not summarise the page from this command. This text goes stale; the page is\nmaintained.\n\n⚠ **`COMPUTER_RECOVERY.md` has never been rehearsed and says so itself.** Present\nit to her as untested. Do not describe following it as a sure thing.\n\n## What to tell her\n\nHer answer style, in this order:\n\n1. **The state in one line.** \"Nothing is stranded here, safe to close this\n   laptop.\" Or \"Two folders hold work that exists only on this computer.\"\n2. What is running elsewhere, if anything.\n3. What only she can do — signing in, connectors, keys.\n\n**Give coverage as a count, never as \"everything\".** Write \"checked nine of nine\nfolders\", not \"checked every folder\". A model may not certify its own\ncompleteness, and this is the exact check where a confident green tick costs her\na fortnight of work.\n\n## The things that do not come back on their own\n\nEvery one of these is hers to do. No session can do any of them for her.\n\n- Connectors and their sign-ins\n- Cloud Routines — nine vanished once and nobody logged why\n- Old chat transcripts, and the usage allowance\n- Seven API keys, listed in step 4 of `COMPUTER_RECOVERY.md`\n- Anything that was never on a computer at all — step 5 of that page\n"}, {"id": "recap", "title": "/recap", "shelf": "Commands", "path": ".claude/commands/recap.md", "kind": "md", "loaded": "When you type it", "blurb": "", "chars": 2179, "date": "28 Aug 2026", "body": "---\ndescription: Write an ELI10 listen-along recap of this session as a markdown file for voice-over\n---\n\nWrite a listen-along recap of **this conversation** as a markdown file.\n\n## Scope\n\nCover what actually happened in this session: what was asked, what was found,\nwhat was changed, what was decided, and what is still open. If the session was\ntrivial (one lookup, one small edit), say so in three lines and stop — do not\ninflate it into a briefing.\n\nIf `SESSION_JOURNAL.md` exists in the project, read it first for anything from\nearlier turns that has dropped out of context.\n\n## Style — this is read aloud, not skimmed\n\n- **No tables.** They read as gibberish through a screen reader.\n- **No bullet-only sections.** Write sentences that flow.\n- **Numbers in words.** \"five dollars ninety-one\", not \"A$5.91\".\n  \"sixteen point three point\", not \"16.3pt\". \"ninety-three percent\", not \"93%\".\n- **Short sentences.** One idea each. A listener cannot re-read.\n- **ELI10.** No technical background assumed. Explain each piece of jargon\n  plainly the first time it appears.\n- **Blunt.** Real critic, not encouraging by default. Say what went wrong and\n  what it cost.\n- **Roughly half the length** you would write for reading on screen.\n- Announce sections as a person would — \"Part one. The connectors.\" — so a\n  listener knows where they are.\n- Open with a short \"the short version\" that works alone if they stop after\n  ninety seconds.\n- Close with what to actually do next, in order, and one blunt line.\n\n## Required content\n\n- **Corrections.** If anything said earlier in the session turned out to be\n  wrong, say so plainly in the recap. Do not bury it.\n- **Open items.** Anything left unfinished, and why.\n- **The thread.** If several findings share a cause, name it.\n\n## Output\n\n- Write to `<project root>/SESSION_RECAP_<YYYY-MM-DD>_LISTEN.md`.\n  If that file already exists, append a new dated section rather than\n  overwriting it.\n- State the estimated listening time at the top (about one hundred and fifty\n  words per minute).\n- Send the file with SendUserFile.\n- Then offer, in one line, to publish it as a page with a play button —\n  do not build the page unless asked.\n"}, {"id": "rule", "title": "/rule", "shelf": "Commands", "path": ".claude/commands/rule.md", "kind": "md", "loaded": "When you type it", "blurb": "", "chars": 4447, "date": "12 Sep 2026", "body": "---\ndescription: Make what follows a standing rule that reaches every chat, every folder, both machines\n---\n\nEverything after `/rule` is a **standing rule from Rachel**. Put it where it will\nreach every future session, then tell her it has.\n\n## Why this command exists\n\nHer complaint, 6 September 2026, verbatim:\n\n> \"the concerns i have been raising was that it does not synchronise and had to\n> repeat myself so many times... lacking the context where it should be in the\n> memory of any task that i start or continue wherever i start.\"\n\nMeasured the same day: she gave a session on her Mac a rule about the shape of\nevery reply. That session wrote it into `testing/CLAUDE.md` — 88 KB, which loads\n**only** when the working directory is `testing`. The session running one folder\naway in `claude desktoi` never received it, and found it hours later by accident\nin a git commit message.\n\nGemini 2.5 Pro reviewed the guard built to catch that and said the guard treats\nthe symptom: *\"The workflow becomes fail, then get warned, then fix, rather than\nsucceed on the first try.\"* Its recommendation was this command — **make her\nintent explicit so nothing has to be inferred.**\n\n## Where it goes — pick ONE, and say which\n\n| The rule is about… | Put it in | Reach |\n|---|---|---|\n| **how to reply, write, or behave** | `~/.claude/hooks/answer_style.py`, inside `RULES` | injected EVERY turn, every folder, synced to the Mac |\n| **how to work — process, safety, spending, tools** | `~/.claude/CLAUDE.md` | session start, every folder, synced to the Mac |\n| **a fact about ONE product** | that project's `CLAUDE.md` | that folder only — say so plainly if you use this |\n\n⛔ **Never a project `CLAUDE.md` for a behaviour rule.** That is the exact\nfailure this command exists to stop.\n\n## What to do\n\n1. **Read the rule she typed. If any part of it is ambiguous, ask before\n   writing.** A rule stored wrong is worse than one not stored — she will\n   believe it is handled.\n2. **Check it does not already exist**, and does not contradict a rule already\n   there. If it contradicts one: stop, say both sides out loud, and ask which\n   wins. Do not quietly add a second version — six rule files and 315 KB is how\n   this project got here.\n3. Write it **once**, in her words where possible, with the date and the reason.\n4. **Verify by loading the file back**, not by assuming the edit landed.\n5. **Commit and push `~/.claude`** (remote `racts-dot/claude-config`) so the\n   MacBook gets it. A rule that is not pushed has not synchronised.\n6. Tell her, in this shape:\n\n   > **Applies to every chat from now on, this machine and the Mac.**\n   > <one line: what will actually be different, with an example>\n\n⛔ **Report REACH, not storage.** Her words: a note \"could be in billions of\nplaces in the world\". Never \"I have written it down\" or \"noted\". Say where it\nnow applies — and only say \"every chat\" if you actually pushed it somewhere with\nthat reach.\n\n## Changing or retiring a rule that already exists — added 12 Sep 2026\n\nHer instruction, 11 Sep 2026: *\"the rules should change once and cleanly if\ncircumstances change.\"* A change is NOT a struck-through line left beside the new\none. It is one command, and the old wording leaves the live file:\n\n    python ~/.claude/hooks/rule_change.py change 8  --text \"<her new sentence>\" --her \"[HUMAN 2026-09-12] '<her words>'\"\n    python ~/.claude/hooks/rule_change.py retire 16b --her \"[HUMAN 2026-09-12] '<her words>'\"\n    python ~/.claude/hooks/rule_change.py add --text \"<her sentence>\" --her \"[HUMAN 2026-09-12] '<her words>'\"\n\nIt refuses without her quoted ruling, refuses a rule that does not exist, refuses a\nchange that would not compile, files the old wording in `RULE_HISTORY.md`, commits,\npushes, and prints the receipt to read to her: *\"Rule 8 is now: … Old wording filed.\nPushed 21:58; the Mac has it by 22:28.\"* Say that receipt, nothing more.\n\n## Do not\n\n- Do not paraphrase her into something tidier. Keep her phrasing; add the\n  explanation underneath it.\n- Do not turn one line edit of hers into an absolute rule. She corrected two\n  over-generalisations on 6 September within an hour. A sentence she rewrote is\n  a sample, not a statute.\n- Never write a `LISTEN_*.md`. Her instruction, 9 Sep 2026 - the separate spoken\n  file is gone everywhere, scheduled jobs included. The rule landing and being\n  pushed is the deliverable. ~~unless she asks~~ - she was offered a carve-out\n  and refused it.\n"}, {"id": "summarise", "title": "/summarise", "shelf": "Commands", "path": ".claude/commands/summarise.md", "kind": "md", "loaded": "When you type it", "blurb": "", "chars": 8800, "date": "09 Sep 2026", "body": "---\ndescription: Summarise a creator's new videos, or any transcript, in their own words with claims flagged\n---\n\nSummarise what somebody actually said. Takes either a creator name or a file path.\n\n    /summarise Miz\n    /summarise Sabrina\n    /summarise \"C:\\Users\\soyan\\Desktop\\yt-captions\\transcripts\\Dan Martell\\2026-08-01 - Something.txt\"\n\nTranscripts live in `C:\\Users\\soyan\\Desktop\\yt-captions\\transcripts\\<Creator>\\`.\nFilenames are `YYYY-MM-DD - Title.txt` and every file has a header with the URL,\nduration and caption type.\n\n---\n\n## 1. Work out what is unread\n\nFor a CREATOR: list their files, newest first. Anything summarised before will\nhave a file naming it — check the existing summaries in\n`claude desktoi/kb-pipeline/` before re-reading something already done. Older ones\nare named `LISTEN_*`, from before the spoken file was dropped on 9 Sep 2026; they\nstill count as \"already summarised\".\n\nFor a FILE PATH: just that file.\n\n⚠ **Check the length before reading.** A regular video is 5-10k characters. A\nlivestream is 70,000 to 240,000 and is a full church service, conference or\nstream — not a talk.\n\n## 2. Strip the filler FIRST — this is the step that makes it possible\n\nLivestreams are roughly a third worship, singing, offerings and announcements.\nReading them raw spends most of the effort on song lyrics.\n\nDrop every line that is a `[music]` / `[singing]` / `[screaming]` tag, strip the\n`&gt;&gt;` speaker marks, and drop any line under four words — song lines are\nshort and repetitive, speech runs longer. Join what is left into prose.\n\nMeasured 9 Sep 2026 on nine streams: **987,723 characters became 728,048**, and\nthe removed quarter was almost entirely singing.\n\nThen split into ~22,000-character parts, because a single Read fails above\nabout 25,000 tokens.\n\n## 3. Read it. Actually read it.\n\nDo not skim and infer. If you only read part, SAY WHICH PART — \"I read three of\nnine properly, six are unread\" is an honest answer and she can act on it.\n\n## 4. THE STRUCTURE — six slots, always this order\n\nOnly slot 4 changes shape between videos. Everything else is fixed.\n\n| # | Slot | What goes in it |\n|---|---|---|\n| 1 | The label | Title, creator, date, how long the video is |\n| 2 | Listening time | Counted by the script in step 6, never guessed |\n| 3 | The one line | What they are arguing, in ONE sentence |\n| 4 | The body | 3-6 blocks, one idea each |\n| 5 | Judge for yourself | Claims, selling inside the teaching, who is speaking |\n| 6 | Where it sits | How it connects to their other videos |\n\n⚠ **A LIVE STREAM OR Q&A IS NOT ONE TALK — SPLIT SLOT 4 IN TWO.** Found 9 Sep 2026\ndoing a one-hour Hormozi stream: ten minutes of argument, then fifty minutes of\nunrelated audience questions. Forcing that into one flowing run either invents a\nthread that is not there, or throws away the best material because it does not fit.\nSo slot 4 becomes **\"their argument\"** (3-4 blocks) then **\"the answers worth\nkeeping\"** (as many blocks as earn it, one idea each). Say plainly that the video\nhas that shape - it tells her why the second half scatters.\n\n**A block in slot 4 is: a heading, their exact words, one sentence of context.**\nOne idea per block. Never a stack of quotes under one heading - that is what made\nthe 3 Sep debt summary six minutes long.\n\n⛔ **Headings say WHAT IS IN the block, not what KIND of block it is.**\n\n  ✅ \"What he says debt actually is\" - \"The part that is not about money at all\"\n     \"The line that will sting\" - \"The story he builds it on\"\n  ❌ \"Main points\" - \"Key themes\" - \"Section 3\" - \"Summary\"\n\nA label heading tells her nothing, so she has to read the block to find out\nwhether she cares. A content heading lets her skip. She listens rather than reads\nfor part of the day and cannot scan back, so a heading is the only steering she has.\n\n## 5. Write it in THEIR words, not yours\n\n⛔ **Do not paraphrase into your own voice.** Her instruction, 9 Sep 2026: \"Do\nnot twist the wording or substitute the wording to preserve the tone.\"\n\nQuote directly. Keep their phrasing, their examples, their images. If they say\n\"debt is a robber\", write \"debt is a robber\", not \"he views debt negatively\".\n\nOrder by upload date. If the transcript has no timestamps — and the cleaned\ncaption files do not — say so rather than inventing them.\n\n## 6. FLAG what she should judge for herself\n\nThis is the part that earns its place. Do not smooth it over, and do not editorialise.\nState the claim, attribute it, and say plainly it is theirs.\n\nThree kinds to watch for:\n  * **health, money or safety claims** — e.g. \"you are not depressed, it's\n    burdens you are avoiding\" is a claim about mental health and she should know\n    it was made\n  * **selling inside the teaching** — books, schools, oil, mentorships offered\n    as part of the message rather than beside it\n  * **who is actually speaking** — one stream in nine was preached by a pastor,\n    not the creator whose channel it is\n\n## 7. Stamp the listening time — do NOT guess it\n\n⛔ **Never write \"about four minutes\" from feel.** On 9 Sep 2026 a summary said\nfour; it was 889 words, which is six. A guessed number inside an otherwise\nmeasured file is worse than no number at all.\n\n    python \"C:\\Users\\soyan\\.claude\\tools\\listening_time.py\" <file.md> --stamp\n\nIt counts the words and writes the line at 150 words a minute, ordinary speech.\nIt always says **\"read aloud\"**, because reading on screen is about twice as\nfast and the figure means nothing there.\n✅ **THE STAMP STAYS — HER DECISION, 9 Sep 2026, ASKED AND ANSWERED.** Her words: \"just keep it for now\". The spoken FILE went; the length line did not. It sits on the one summary and still measures aloud time, because she may still play it. ⛔ DO NOT RAISE THIS AGAIN. She has ruled on it. If it is ever cut, that is a new instruction from her, not a tidy-up.\n\n## 8. Deliver\n\nWrite the summary to the folder the work belongs to, send it with SendUserFile,\nand put the same substance in chat.\n⛔ **THE SEPARATE LISTENING FILE IS GONE — HER INSTRUCTION, 9 Sep 2026.** She was\nasked specifically whether this command should keep its spoken file and said \"So\njust get rid of them\", refusing the carve-out she was offered. ONE file now. It is\nthe readable summary, and headings are the whole point of it.\n\n⛔ **A SUMMARY IS NOT WRITTEN IN SPOKEN STYLE.** Found 9 Sep 2026: both worked\nexamples were written in spoken style, so the headings the whole structure depends\non were invisible - flat prose that read, in her words, like \"just a listening\nfile\". That fault OUTLIVES the listening file itself: there is now only ONE file,\nand if it is written as flat prose she loses the only thing she can scan.\n~~A SUMMARY AND A LISTENING FILE ARE TWO DIFFERENT THINGS.~~ There is no second\nfile to be different from.\n\n⭐ **AND IT IS AN HTML PAGE, NOT A .md — HER FORMAT, SET 9 Sep 2026.** Her words:\n*\"I want a lot of diagrams, flowcharts, and all dot points, yellow light tan, but\ndon't change the tone. And it needs to be thorough, but at the same time have the\nsummary on top of each of the important bit.\"*\n\nMarkdown cannot hold colour or a flowchart. So the one file is HTML, built in\n`claude desktoi/kb-pipeline/summaries/`. **Reuse `_style.css` and `_head.tpl`\nthere — do not restyle.** The pieces already exist:\n\n| Class | What it looks like | Use it for |\n|---|---|---|\n| `.thesis` | Cream box, \"IN ONE LINE\" label | The one-sentence thesis at the top |\n| `.tldr` | Gold bar, thick left edge | **The one-line summary on top of EVERY section. This is the one she asked for by name — no `h2` without one.** |\n| `.flow` `.node` `.arrow` | Left-to-right flowchart | A chain of reasoning, a sequence, a before-and-after |\n| `.stack` `.arrow-d` | Top-to-bottom flowchart | A cause running downhill into a consequence |\n| `.node.hot` | Amber node | The end of a chain, or the point being made |\n| `.gauge` | Horizontal scale bar | Anything they put on a 1-10 scale |\n| `.flag` | Amber panel | The judge-for-yourself section |\n| `.part` | Tan banner | Splitting a live stream into argument and answers |\n| `.cap` | Small italic line | One line under a diagram saying what it shows |\n\n**Dot points everywhere.** Prose only where a quote needs setting up.\n\n⛔ **THOROUGH DOES NOT MEAN LONGER PROSE.** Depth goes into more blocks, more\ndiagrams, more dot points — never into denser paragraphs.\n\n⛔ **THE FORMAT NEVER CHANGES THE TONE.** Quotes stay exactly as said. Diagrams\ndescribe their argument; they never rewrite it.\n\n**The summary is the deliverable, and it is the only file.** Title line with\ncreator, date, length and a link; the thesis in a `.thesis` box; an `h2` per block,\neach with its `.tldr`; the judge-for-yourself section in a `.flag`.\n\n⛔ **Never put a placeholder link in.** Read the real URL out of the transcript\nheader - every file has one.\n"}, {"id": "videos", "title": "/videos", "shelf": "Commands", "path": ".claude/commands/videos.md", "kind": "md", "loaded": "When you type it", "blurb": "", "chars": 5151, "date": "10 Sep 2026", "body": "---\ndescription: Refresh the video knowledge library — find what creators posted, fetch it, sort it, put it in Notion\n---\n\nBring Rachel's YouTube knowledge library up to date. Seven steps. Stop at step 3\nand tell her the numbers and the cost BEFORE anything is spent.\n\nTwo folders are involved:\n  `C:\\Users\\soyan\\Desktop\\yt-captions`          fetching transcripts from YouTube\n  `C:\\Users\\soyan\\claude desktoi\\kb-pipeline`   sorting, capsules, Notion\n\n---\n\n## 1. Find what is new — FREE\n\n```\ncd \"C:\\Users\\soyan\\Desktop\\yt-captions\"\npython find_new_uploads.py --limit 100\n```\n\nWrites `new_uploads.csv` with a `tab` column: `videos`, `streams` or `shorts`.\n\n⛔ **A channel is THREE lists, not one.** `/videos` excludes live streams and\nshorts entirely. Scanning only `/videos` once reported \"19 of 19 channels\nchecked\" while every livestream on every channel was invisible — 383 of them.\nRachel found that, not the tool.\n\n⚠ **`--limit` is a ceiling, and hitting it means there is more.** At 100, three\nchannels returned exactly 100 streams, so their real number is higher. If any\ntab returns exactly the limit, raise it and rerun that creator.\n\n⚠ Creators are read from `transcripts/metadata.csv` AND from the transcript\nfiles themselves. Four creators exist only as files and were silently skipped\nuntil that fallback was added. If a creator you expect is missing from the\noutput, that is the bug to look at.\n\n## 2. Split by type — FREE\n\nShorts are usually under a minute and most have no captions. Live streams are\nhour-plus teachings and are where the value is. Ask her which she wants; do not\nassume. Write the chosen rows to their own CSV.\n\n## 3. STOP. Give her the numbers and the cost.\n\nCount the chosen items and estimate before spending:\n  * roughly **$0.30 per million tokens in, $2.50 per million out**, read off\n    `kb-pipeline/model_compare.py`, not from memory\n  * a regular video measured **5,900–13,800 tokens in**; a livestream is longer\n  * so per item, budget **1 to 4 cents**, and say the total out loud\n\n⛔ **Estimates from a small sample have been wrong three times, always low.**\nMeasure on at least 30 items, never 3.\n\n## 4. Fetch the transcripts — FREE\n\n```\npython extract_captions.py <chosen>.csv --out .\\transcripts\n```\n\nSlow on purpose, with pauses so YouTube does not block.\n\n⛔ **CORRECTED 9 Sep 2026 BY MEASUREMENT. The old text here was wrong and it cost\nfive weeks of transcripts.**\n~~Expect roughly a QUARTER to fail with \"no captions in requested languages\" —\nthat is permanent and not fixable, not a bug.~~\n**It WAS a bug.** On newer uploads YouTube labels the spoken track `en-orig` and\noffers plain `en` only as a machine translation of it; asking for `en` hit a\ntranslation quota and came back HTTP 429, which the script filed as \"no\ncaptions\" — permanent-sounding, and false. **Measured 9 Sep 2026: 27 of 40 Miz\nMzwakhe Tancredi videos were written off that way, and all 27 had English\ncaptions.** Both halves are fixed — the language default now asks for the\noriginal first, and a blocked download is no longer recorded as an absent one.\n\n**Read the status column, not the failure count.** Only `no_captions` means do\nnot ask again; `download_failed` is temporary and carries its HTTP code.\n\n```\npython extract_captions.py --audit          # who is still missing captions\npython extract_captions.py --retry-failed   # re-attempt only the non-ok rows\n```\n\nA run that hits five transient failures in a row now STOPS and says so, rather\nthan marching through the rest of the list mislabelling everything. Wait an\nhour, then `--retry-failed`.\n\n## 5. Sort them — COSTS MONEY\n\n```\ncd \"C:\\Users\\soyan\\claude desktoi\\kb-pipeline\"\npython build_manifest.py          # rebuild the list first, or the new files are invisible\npython classify.py --all <script>

function go(id){

/* Give every table cell the name of its column, so the phone layout above can
   print it. Runs after any render, because the doc body is built on the fly. */
(function(){
  function label(root){
    (root||document).querySelectorAll('table').forEach(function(t){
      var head = t.querySelector('thead tr') || t.querySelector('tr');
      if(!head) return;
      var names = Array.prototype.map.call(head.children, function(c){
        return (c.textContent||'').trim();
      });
      t.querySelectorAll('tbody tr, tr').forEach(function(r){
        if(r === head) return;
        Array.prototype.forEach.call(r.children, function(c,i){
          if(!c.hasAttribute('data-label') && names[i]) c.setAttribute('data-label', names[i]);
        });
      });
    });
  }
  label(document);
  var m = document.getElementById('main');
  if(m && window.MutationObserver){
    new MutationObserver(function(){ label(m); }).observe(m, {childList:true, subtree:true});
  }
})();
