<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rachel's Rule Shelf</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  --paper:#eef0f3; --surface:#ffffff; --ink:#15181e; --muted:#5b6270;
  --line:#d7dbe2; --line-soft:#e7eaef; --accent:#1f56c4; --accent-soft:#e6ecfb;
  --flag:#a6301c; --flag-soft:#fbe9e5;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e1116; --surface:#161a21; --ink:#e4e7ec; --muted:#98a1b2;
  --line:#262c37; --line-soft:#1e242d; --accent:#7ba4ff; --accent-soft:#18243c;
  --flag:#e58a72; --flag-soft:#2c1b18;
}}
:root[data-theme="dark"]{
  --paper:#0e1116; --surface:#161a21; --ink:#e4e7ec; --muted:#98a1b2;
  --line:#262c37; --line-soft:#1e242d; --accent:#7ba4ff; --accent-soft:#18243c;
  --flag:#e58a72; --flag-soft:#2c1b18;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:16px;line-height:1.62;
  -webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}
code,pre{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%}

nav{background:var(--surface);border-right:1px solid var(--line);
  position:sticky;top:env(safe-area-inset-top,0px);align-self:start;
  max-height:100vh;overflow-y:auto;padding:24px 0 48px}
.brand{padding:0 20px 16px;border-bottom:1px solid var(--line-soft);margin-bottom:10px}
.brand span{font-family:Archivo;font-size:10.5px;color:var(--muted);letter-spacing:.13em;
  text-transform:uppercase;display:block;margin-bottom:4px}
.brand b{font-family:Archivo;font-size:16px;letter-spacing:-.015em;display:block;font-weight:700}
.shelf-label{font-family:Archivo;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);padding:18px 20px 6px;font-weight:600}
nav a{display:block;padding:7px 20px 7px 17px;border-left:3px solid transparent;
  font-family:Archivo;font-size:13.5px;color:var(--ink);text-decoration:none;cursor:pointer}
nav a:hover{background:var(--line-soft)}
nav a.on{border-left-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
nav a em{display:block;font-style:normal;font-size:10.5px;color:var(--muted);
  font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;margin-top:1px}
nav a.on em{color:var(--accent)}

main{padding:40px 44px 120px;max-width:1040px;min-width:0}
.topbar{display:none}
.eyebrow{font-family:Archivo;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0;font-weight:600}
h1.doc{font-size:31px;line-height:1.16;margin:.3em 0 .12em;letter-spacing:-.022em;text-wrap:balance}
.blurb{color:var(--muted);font-size:15px;max-width:62ch;margin:6px 0 18px}
.factbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;padding:12px 0 18px;
  border-bottom:1px solid var(--line);margin-bottom:30px}
.factbar span{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.factbar span b{color:var(--ink);font-weight:700}
.pill{font-family:Archivo!important;font-size:11px!important;padding:3px 9px;border-radius:2px;
  background:var(--accent-soft);color:var(--accent)!important;font-weight:600;letter-spacing:.01em}

.lede{max-width:64ch;font-size:18.5px;line-height:1.56}
.lede strong{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin:14px 0 4px}
.card{background:var(--surface);padding:16px 17px 17px;cursor:pointer;
  display:flex;flex-direction:column;gap:7px;text-align:left;border:0;font:inherit;color:inherit}
.card:hover{background:var(--accent-soft)}
.card h3{margin:0;font-size:15.5px;letter-spacing:-.012em}
.card p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5;
  font-family:"Source Serif 4",Georgia,serif}
.card .m{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);
  margin-top:auto;padding-top:10px;font-variant-numeric:tabular-nums;line-height:1.5}
.shelf-head{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  font-family:Archivo;margin:40px 0 0;font-weight:600}
.note{border-left:3px solid var(--flag);background:var(--flag-soft);padding:13px 17px;
  margin:26px 0;font-size:14.5px;max-width:66ch;line-height:1.55}
.note b{font-family:Archivo;font-weight:700}
.tnote{font-size:14px;color:var(--muted);max-width:66ch;margin:10px 0 14px;line-height:1.55}
.tnote em{font-style:italic;color:var(--ink)}
.tnote code{font-family:"JetBrains Mono",monospace;font-size:12px;background:var(--line-soft);padding:1px 5px}
table.meas{border-collapse:collapse;font-size:13.5px;width:100%;
  font-family:Archivo,Helvetica,Arial,sans-serif}
table.meas th,table.meas td{border:1px solid var(--line);padding:8px 11px;text-align:left;
  vertical-align:top;background:var(--surface);overflow-wrap:break-word}
table.meas th{background:var(--line-soft);font-size:12px;font-weight:600;letter-spacing:.01em}
table.meas .num{text-align:right;font-family:"JetBrains Mono",monospace;
  font-variant-numeric:tabular-nums;white-space:nowrap}
table.meas .bad{color:var(--flag);font-weight:700}
table.meas .good{color:var(--muted)}
table.meas .warn{color:var(--muted)}
.pathcell{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted)}

.doc-body{max-width:70ch;overflow-wrap:break-word}
.doc-body h1,.doc-body h2{font-size:21px;margin:2em 0 .5em;letter-spacing:-.016em;
  padding-bottom:7px;border-bottom:1px solid var(--line-soft);text-wrap:balance}
.doc-body h3{font-size:16.5px;margin:1.7em 0 .4em}
.doc-body h4,.doc-body h5,.doc-body h6{font-size:13.5px;margin:1.5em 0 .3em;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted)}
.doc-body p{margin:0 0 1em}
.doc-body ul,.doc-body ol{padding-left:1.35em;margin:0 0 1em}
.doc-body li{margin:.35em 0}
.doc-body li>ul,.doc-body li>ol{margin:.35em 0}
.doc-body code{background:var(--line-soft);padding:1px 5px;border-radius:2px;font-size:.85em;overflow-wrap:anywhere;word-break:break-word}
.doc-body pre{background:var(--surface);border:1px solid var(--line);padding:13px 15px;
  overflow-x:auto;font-size:12.5px;line-height:1.55;max-width:100%}
.doc-body pre code{background:none;padding:0;font-size:1em;overflow-wrap:normal;word-break:normal}
.doc-body blockquote{margin:1em 0;padding:3px 0 3px 17px;border-left:3px solid var(--line);
  color:var(--muted)}
.doc-body blockquote p:last-child{margin-bottom:0}
.doc-body hr{border:0;border-top:1px solid var(--line);margin:2.4em 0}
.doc-body img{max-width:100%}
.doc-body table{border-collapse:collapse;font-size:13.5px}
.doc-body th,.doc-body td{border:1px solid var(--line);padding:7px 11px;text-align:left;
  vertical-align:top}
.doc-body th{background:var(--line-soft);font-family:Archivo;font-size:12.5px;font-weight:600}
.tablewrap{overflow-x:auto;margin:0 0 1.3em;max-width:100%}
.plain{white-space:pre-wrap;word-break:break-word;font-family:"JetBrains Mono",monospace;
  font-size:12.5px;line-height:1.64;background:var(--surface);border:1px solid var(--line);
  padding:22px 24px;overflow-x:auto;max-width:100%}
.foot{margin-top:72px;padding-top:16px;border-top:1px solid var(--line);
  font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);line-height:1.7}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  nav{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);
    display:none;padding:16px 0 24px}
  nav.open{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;
    top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);
    border-bottom:1px solid var(--line);padding:11px 16px}
  .topbar b{font-family:Archivo;font-size:14px;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .topbar button{font-family:Archivo;font-size:13px;background:var(--accent-soft);
    color:var(--accent);border:1px solid var(--line);border-radius:3px;padding:7px 12px;
    cursor:pointer}
  main{padding:24px 16px 96px}
  h1.doc{font-size:24px}
  .lede{font-size:17px}
}

/* ── PHONE: stack every table instead of making her scroll sideways ──
   Measured 19 Sep 2026 at 375 px: table.meas was 454 px and a doc table 532 px,
   so columns collapsed to one word per line ("every / folder / (the") and each
   table needed its own sideways scroll. Her words: "The shelf is not phone
   friendly". Below 560 px each row becomes a small card: every cell on its own
   line, headed by its column name, nothing hidden and nothing truncated. */
@media (max-width:860px){
  .tablewrap{overflow-x:visible}
  table.meas, .doc-body table{display:block;width:100%;border:0}
  table.meas thead, .doc-body table thead{position:absolute;width:1px;height:1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  table.meas tbody, .doc-body table tbody,
  table.meas tr, .doc-body table tr{display:block;width:100%}
  table.meas tr, .doc-body table tr{border:1px solid var(--line);margin:0 0 10px;
    background:var(--surface)}
  table.meas td, .doc-body table td{display:block;width:100%;border:0;
    border-top:1px solid var(--line-soft);padding:9px 13px;text-align:left!important;
    white-space:normal!important;overflow-wrap:anywhere}
  table.meas tr td:first-child, .doc-body table tr td:first-child{border-top:0;
    font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:700}
  table.meas td::before, .doc-body table td::before{
    content:attr(data-label);display:block;font-family:Archivo,Helvetica,Arial,sans-serif;
    font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
    margin-bottom:3px}
  table.meas td:first-child::before, .doc-body table td:first-child::before{content:none}
  table.meas .num{text-align:left}
  .plain{padding:16px 13px;font-size:12px}
  .doc-body pre{font-size:12px;padding:11px 12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script id="docsdata" type="application/json">[{"id": "global", "title": "The global book", "shelf": "Rule books", "path": ".claude/CLAUDE.md", "kind": "md", "loaded": "Every session, every folder", "blurb": "Standing instructions, who decides what, the product bar, spending rules, tool routing, where files live.", "chars": 29570, "date": "17 Sep 2026", "body": "# Always loaded — every session, every folder on this machine\n\n<!-- LESSONS.md: one line per reusable finding from AI reviews and from her (goal 7, 12 Sep 2026). Loaded here so the AI reads it. -->\n@LESSONS.md\n\nThese are the rules that apply to ALL work: printables, eBay/Temu, video, research,\nanything. Project-specific rules live in that project's own CLAUDE.md — see the\nbottom of this file.\n\n## ⛔ PICK UP HERE — `C:\\Users\\soyan\\HANDOVER.md`\n\n**One register, every job, every AI. Read it before doing anything; update it before you stop.**\n\n- **Read the IN FLIGHT table first.** Something may already be running — a ChatGPT tab, a\n  Higgsfield batch, another Claude session. Do not duplicate it, and do not assume a blank\n  table means \"nothing running\" unless you checked.\n- Trust lines by their tag: `[VERIFIED]` (someone opened the file), `[REPORTED]` (second-hand —\n  re-check before acting), `[HUMAN]` (Rachel said so).\n- **Before you stop:** update IN FLIGHT, update the NEXT ACTION for whatever you touched, and\n  bump the timestamp. A Stop hook stamps a **POSSIBLY STALE** banner on the file if you edited\n  work files and left the register alone — if you see that banner, verify before you trust it.\n- `[HUMAN 2026-09-12]` **On the Mac, exactly as on Windows: the register loads first, then the folder's own `CLAUDE.md`; the 30-minute sync keeps both machines level.** (her pick, goal 4)\n\n## ⭐ RACHEL'S STANDING INSTRUCTIONS — she should never have to repeat these\n\n\n   `[HUMAN 2026-09-14]` **FOR NOW, CHROME EVERY SIXTH REVIEW, NOT EVERY FIFTH.** Her words:\n   *\"So, Chrome every six times then.\"* and *\"Applicable for another five days.\"* Runs through\n   19 Sep 2026; on 20 Sep it returns to every fifth by itself (`review_route.py` reads the date).\n   GPT still reviews every time; only the Chrome round moves.\n   Her words, second and current: *\"Use API for the reviews, but do it in the Chrome\n   with highest intelligence every fifth time. And then you, when you do on Chrome,\n   make sure that you do put as much as possible in there, and also try to go below\n   ten cents per API for OpenAI, but you can do you don't have any cap for Vertex.\"*\n   ```\n   python \"claude desktoi/review_board/review_route.py\" queue \"<question>\" --who <job>\n   ```\n\n\n   ```\n   python \"claude desktoi/review_board/review_route.py\" next\n   python \"claude desktoi/review_board/review_route.py\" done --id <token>\n   ```\n   ⛔ **Run BOTH before acting.**\n   Her words: *\"It is like constructive feedback, not like to attack. I ask for\n   weaknesses and advices.\"*\n   ✅ **Use `claude desktoi/review_board/REVIEW_PROMPT_STANDARD.md` verbatim.**\n   **Run each on its HIGHEST intelligence setting** — added 2 Sep 2026 when she\n   said *\"with the highest in intelligence\"*. Both accounts are Pro. **Read the\n   model picker before sending, never infer**: a fresh chat was once found\n   silently defaulted to the weakest model. Same principle for subagents —\n   judgement work on Opus, only mechanical work on haiku.\n1b. **WHO DECIDES.**\n   `[HUMAN 2026-09-07]` *\"you don't dictate what you're doing. But you're doing it again\n   and again and again. I'm just a bit too confused. Let's just do. Can you just go to GPT\n   over and over again... it is good at what it is doing when it comes to giving you the\n   answer, even if it doesn't do the work properly.\"*\n   - **A decision you would have put to her → PUT IT TO GPT AND ACT ON THE ANSWER.**\n     Go back to it as many times as the job needs. Do not hand her a menu of choices.\n   - **GPT and Gemini AGREE → act on it.** Unchanged.\n   - **They DISAGREE → ⛔ AMENDED `[HUMAN 2026-09-10]`. THE TIE-BREAK IS A CHROME\n     ROUND, NOT AN API ONE.** Her words: *\"if AIs have contradicting answers, do\n     chrome the most intelligence in gpt-sol review on chrome. make sure the\n prompts are the same.\"*\n     ⛔ **THE SAME PACKET, BYTE FOR BYTE.**\n     ```\n     python \"claude desktoi/review_board/review_route.py\" packet --id <rid> --who gemini --file <packet>\n     python \"claude desktoi/review_board/review_route.py\" packet --id <rid> --who gpt    --file <packet>\n     python \"claude desktoi/review_board/review_route.py\" tiebreak --id <rid>\n     ```\n   - **Money, public, or hard to reverse → always her**, however they voted. Unchanged,\n     and this is now close to the only category that reaches her.\n\n1c. **CLAUDE SUBAGENTS ARE THE THIRD SEAT — her instruction 2 Sep — but they do NOT vote.**\n   ⭐ **ROUTINE, SET BY RACHEL 6 Sep 2026: \"make it a routine\".** She was given a\n   recommendation and made it standing. **Two of the four are now DEFAULT, not optional:**\n   - **`stale-fact-sweeper` runs BEFORE every correction to a fact, number, status,\n     price, date or verdict.** No exceptions.\n   - **`remeasure-verifier` runs BEFORE anything goes live, public or irreversible** -\n     listing, uploading, publishing, pressing a button a buyer can see.\n   - **`browser-hand` unchanged** - clicking, typing, reading a value back, downloading.\n\n2. **Iterate until a round finds nothing new**, then say so. ⭐ **THE CEILING IS NOW\n   100 — `[HUMAN 2026-09-10]`: *\"iterate up to 100 times until i have the solid\n products\"*.** It is still a CEILING, not a\n   target, and one round is still not enough.\n   ⛔ **THE STOPPING CONDITION IS NOW EXPLICIT — `[HUMAN 2026-09-08]`, her words:**\n   *\"if you’re doing anything, do not stop until you have any results or exhausted\n   all those feedback or weaknesses or advices from AI reviews\"*.\n   **There are exactly TWO exits. Either you have a RESULT, or the review feedback is\n   EXHAUSTED — every weakness and every piece of advice either acted on, or named in\n   writing as refused with the reason. Nothing else ends the job.**\n   ⚠ **It does NOT override what genuinely stops work:** money, anything public or hard\n   to reverse, and a real blocker. Those still go to her — but **\"blocked\" has to be\n   SAID OUT LOUD, never quietly treated as finished.**\n3. **Finish so she can delete the task.** Nothing half-built, everything committed,\n   every unfixed thing named in writing. **Half-built but honestly reported still fails\n   this — the two exits in rule 2 are the test.**\n4. **Delegate mechanical work to cheap models — but ONLY where the quality is the\n   same.** Clicking, typing, reading a value, downloading → the `browser-hand`\n   subagent (haiku). Judgement is never delegated.\n   ⭐ **HER QUALIFIER, added 5 Sep 2026 in her own words: \"only if the quality is\n   the same\".** This is the test, and it replaces \"is this task mechanical?\" as the\n   question to ask. Category is a bad test — plenty of clicking turns out to need\n   judgement halfway through, and a cheap model will not notice it has crossed that\n   line. Ask instead: **would the output be identical whoever produced it?** If yes,\n   delegate. If it might be worse, keep it. Cost never buys a worse answer.\n   🚨 **WHERE THE CHEAP MODEL ACTUALLY BREAKS: CHECKING WORK. Do not give haiku a\n   verification job.**\n   **The line is: haiku may DO things, it may not JUDGE\n   whether they were done right.**\n   ⛔ **So: never let a cheap model be the thing that says a gate passed, a claim held,\n   or a file was correct.** If a subagent's output would be quoted as evidence, it is\n   not mechanical work.\n4b. **A MODEL MAY NOT CERTIFY ITS OWN COMPLETENESS.**\n\n   > A model may not certify its own completeness. A QA run is COMPLETE only when\n   > the runner accounts for every predefined input unit and every required out  wording.\n- Order is always: draft → GPT reviews (free, browser) → then generate.\n\n#### Already settled — do not re-propose these\n\n\n**Two results closed so nobody re-proposes them**\n\n- ⛔ **Hollow outlined pupils: rejected.** They do cut solid-black failures, but\n  every animal reads as blind or vacant. The gate cannot see this; a person can.\n  The pupil fix is smaller eyes, not unfilled ones.\n- ⛔ **4K does not fix thin-stroke failures.** A native 3392x5056 render failed\n  at the identical measurement. Thin strokes track fine-textured subjects -\n  spines, petals, rain, fur - not resolution. Do not pay for 4K to solve it.\n\n**Nothing under roughly 20 generations per arm is evidence.** Image generation\n\n**The instruction can BE the defect. Read the existing wording before adding\nanother constraint.** Pages kept failing with eyes too large and solid black.\n\n**Correcting a measurement is allowed. Loosening a gate is not.**\n\n- ❌ **Loosening** - the number moves so the current failures pass. Forbidden.\n  That is a gate that moved to fit the result.\n- ✅ **Correcting** - the number stays, but the measurement stops standing in\n  for the wrong thing. A thin-line gate reported an identical 0.145 for four\n  failing pages that actually carried 39.7, 44.6, 130.5 and 663.6 mm of\n  hairline: one number hiding a 17x spread. The fix added how much line is\n  actually too thin, reported only, and moved no threshold.\n- Adding a metric: report-only first; never calibrate a new gate on the pages\n  currently failing; prove the known-good set is unchanged; record old value,\n  new value, date and reason for any threshold that ever moves.\n\n**Bold and easy beats intricate - market data, not taste.** Bold-and-easy:\nn=32, median 115 reviews, 34.4% bestsellers. Intricate: n=9, median 21 reviews,\n**0% bestsellers**. The answer is never \"add more detail\". Aim for a ~60% keep\nrate, not 90%: going 47% to 60% saves only ~0.9 credits per accepted page, so do\nnot make pass-rate optimisation the main project.\n\n### ⛔ Before anything is built: the research gates\n\n\n**The governing rule.** Research is satisfactory when it is strong enough to\nmake the next reversible decision and further broad research is unlikely to\nchange it. NOT because a large number of pages were scraped.\n\nEvery load-bearing conclusion states: source and date · sample and method ·\nwhat the evidence supports · **what it does not prove** · material bias,\nmissingness or confounders · FACT / INFERENCE / HYPOTHESIS.\n\n**Level 0 - insufficient. Any one of these is NEEDS EVIDENCE / NO-GO:**\n\n\n**Level 1 - permits TEST only.** 20 directly relevant live offers across at\nleast 3 search intents and 5 sellers, capturing price, format, scope,\npositioning, visible proof and buyer promise. 30 buyer-language items from\nreviews/questions/complaints across at least 8 sources. WHO, trigger, job,\npain, current alternative and cheapest test all filled. Source manifest kept.\n\n**Level 2 - permits BUILD SAMPLE / GO.** 30+ offers across at least 10 sellers,\nincluding winners AND middle-of-market AND low-review new entrants, not winners\nalone. 50+ qualitative excerpts across at least 10 sources, including at least\n15 critical/problem statements where available. Saturation: the last 15\nrelevant excerpts add no new pain, choice or failure theme. Quant and qual\nconverge on the same WHO/JOB/GAP, or the contradiction is explicitly recorded.\nEvery important claim carries two independent evidence types or one stronger\ndirect-behaviour source. 5-10 closest alternatives benchmarked for why buyers\nchoose them and where they fail. One falsification test specific enough to run.\n\n**Level 3 - behaviour-validated.** A direct signal from our own offer or a\ngenuinely comparable funnel. Poor test design or tiny exposure is still\nlabelled honestly.\n\n**Stop rule. Stop broad research when ALL are true:**\n\n1. WHO, trigger, job, pain, current alternative, choice criteria, winner\n   pattern and gap are concrete.\n2. The last 15 qualitative items add no material theme.\n3. The next 20 similar listings would be unlikely to change GO/TEST/NO-GO.\n4. Remaining uncertainty is one testable question with a cheapest test.\n5. An independent reviewer has attacked the conclusion and material objections\n   are answered or recorded as unresolved.\n\nOtherwise do targeted research on the unresolved question. Do not restart the\nwhole market scan.\n\n\n**THE SCORE NEVER OVERRIDES A HARD GATE.**\n\n**Hard gates before BUILD SAMPLE / GO - all must be true:**\n\n- WHO/buyer, trigger/job and current alternative are concrete\n- \"Why choose this\" is one defensible sentence\n- evidence link and cheapest falsification test exist\n- Research sufficient is checked\n- **Evidence quality >= 4 · Gap strength >= 4 · Buyer choice >= 4**\n- Material contradiction is NOT checked\n- factual listing claims are traceable to evidence\n\n**Bands.** 80-100 and all gates: BUILD SAMPLE / GO. 65-79, or one material\nassumption unproven: TEST. Under 65, vague buyer, cosmetic gap or no switching\nreason: NO-GO / REWORK.\n\n**The buyer-choice sentence, this exact shape:** For [specific buyer] in\n[trigger/situation], choose [our product] over [closest alternative] because\n[observable difference] produces [desired result], supported by\n[evidence/test].\n\nReject any sentence resting only on: premium · unique · beautiful · high\nquality · AI-powered · more pages · printable. **Difference is not decoration**\n- a colour swap, a new cover, more generic AI images or extra filler pages is\nnot a defensible gap.\n\n**A GO authorises 3-5 representative samples, not production.** The sample must\nstill pass the mechanical, use, visual, claim and market QA.\n\n<<<<<<< HEAD\n**NOTHING ENFORCES ANY OF THIS.** Notion computes the weighted score; no code\nchecks that Evidence quality is 4 before a build starts, and nothing forces\nNO-GO when a gate is false. That is the same structure a res, dated. Perimenopause, diary, puzzle, large-print seniors. Item 4 of the QA score is 0 without one of these. |\n| `factory/consolidation/reviews/` | ChatGPT vision-review rounds, with the pages that were shown. |\n| `upload_packs/listing_NN/` | Copy-paste-ready packs. `.REFUSED` means a human has not approved the pages — that gate cannot be cleared by an AI. |\n\n**The three things left undone, as of 4 Sep 2026:**\n\n1. **The caregiver binder's live file is out of date.** Fixed PDFs sit in\n   `upload_packs/listing_12/files/`. The live listing still serves the version\n   whose respite page says \"ring me\" with no name and no number.\n2. **Listing `4565000185` (ADHD Bundle, AU$8.95) is live with unknown files.**\n   Its attached zips exist nowhere in this repo. Nobody can say what a buyer\n   downloads. This is the only real risk in the shop.\n3. The Evidence File and Appointment Kit have had no vision-review round.\n\n**And the fact that outranks all of it:** five live products, zero sales ever,\nand Etsy search has sent this shop zero visits. **Do not answer \"what next?\"\nwith another product.** The free, never-taken step is Shop Manager → Etsy\nsearch visibility, ten minutes, which says whether the shop is findable at all.\n\n## Which model runs which job\n\nHer rule, 5 Sep 2026: **cheap models do the clerical work, and the saving only\ncounts if the quality is the same.** The condition comes first and overrides\neverything below. This lives in a rules file rather than in code because model\nchoice is made by whoever writes the agent call, and nothing checks it.\n\nTwo sections used to say this, a hundred lines apart, and they had drifted into\ncontradicting each other — one opened \"the default is the strong model\", the\nother opened \"cheap models do the clerical work\". Merged here on her\ninstruction, 5 Sep 2026. Her own record says why: *every fix that regressed had\nthe same fact written in two or more places.*\n\n### The gate: one comparison, and it never closes\n\n**Her decision, 5 Sep 2026 `[HUMAN]`, chosen from three options.** The previous\nwording required both tiers to be run over the same input and compared *before\nany stage* could be cheapened. Nobody ever ran it. So by the letter of this\nfile nothing was ever allowed on a cheap model, and a Windows session drove\n~20 Etsy browser steps on Opus with `browser-hand` (haiku) sitting unused. **A\nrule that says no in every real case is not a safety measure, it is a dead\nrule.**\n\nSo, instead: **run the comparison once, over one real job. If the outputs\nmatch, clerical work goes to the cheap model from then on and needs no further\npermission.** Not once per stage — once, and the question is settled.\n\n**Settled is not permanent.** Her point, 5 Sep 2026: *\"it could change — we\nmight find that the cheaper one is not as good going forward.\"* So the\nsettlement is revocable, and revoking it needs no second comparison and no\nmeeting. **One real miss reopens it.** A cheap stage caught passing something\nthe good model would have refused sends that stage back to the expensive model\non the spot, and the date and what it missed get written into this section. If\na defect reaches a built PDF or a live listing and a cheap model touched that\nstage, that is the evidence — do not wait to be told, and do not argue that the\nstage was probably fine. The cost of being wrong here is a one-star review; the\ncost of over-reverting is about a dollar.\n\n✅ **RUN 5 Sep 2026. The first stage tested FAILED, and was reverted the same\nday.** The 12 adversarial verifiers of the colouring-book review were moved to\nHaiku at low effort. **6 of the 12 failed outright** — *\"Output does not match\nrequired schema: /verdicts\"*. Not worse judgement: no output at all.\n\nThe failure was worse than the rubber-stamping this rule watches for, because\nit is **silent**. `pipeline()` drops a failed item to `null`, so those six\ndimensions reached the synthesis stage carrying no verification at all, and\nnothing in the result said so — the synthesis reads as though everything had\nbeen checked. A rubber-stamp at least leaves a verdict you can go back and\nre-read. A dropped item leaves a hole shaped exactly like success.\n\nSo the US$10.75 saving on that stage **is not available at this quality**. What\ngeneralises is not \"Haiku is bad\". It is that **a stage which must emit\nstructured output against a schema is not clerical work, however clerical its\nsubject sounds.** Counting characters in a chat reply is clerical. Emitting 40\nschema-valid objects is a different job, and it is where the cheap tier broke.\n\n✅ **SECOND RUN, SAME DAY, DIFFERENT STAGE — HAIKU FAILED THIS ONE TOO, in a\ncompletely different way.** Stage: verifying that every claim in a 198-line\nplan is traceable to a source file in this repo. Identical prompt, identical\ninput, both told to *\"default to REFUTED or NOT FOUND when you cannot verify\"*.\n\n| | Haiku 4.5 | Opus 5 |\n|---|---|---|\n| Claims checked | 24 | **78** |\n| CONFIRMED | 24 | 56 |\n| REFUTED | 0 | **2** |\n| NOT FOUND | 0 | **20** |\n\nHaiku checked under a third of the claims, confirmed every one it looked at,\nand concluded: *\"Every factual claim in frame_v1.md — every number, date,\nprice, count, and direct quotation — matches source text.\"*\n\n**That sentence was false, and it is the whole finding.** It silently skipped\nan eight-claim section in which NOT ONE claim was traceable to any artefact in\nthe repo, skipped every derived number, and missed two real errors Opus caught\n— an internally inconsistent price table, and a \"widest observed gap\" claim the\nsource directly contradicts.\n\n**Note what did NOT happen: Haiku never marked anything REFUTED that Opus\nconfirmed.** It failed entirely in the dangerous direction. It chose a subset\nit could verify, verified it correctly, then generalised the verdict to the\nwhole document. Every individual verdict it gave was right. The summary was a\nlie, and the summary is what a reader acts on.\n\n**This is the rubber-stamp failure this rule was written to catch**, and it is\nworse than the schema failure above in one respect: the schema failure left a\nvisible hole, and this one left a confident green tick.\n\nSo **claim verification stays on the expensive model.** Do not re-open it\nwithout a new measurement.\n\n**What the two runs together establish.** Both stages sounded clerical. Both\nwere given the cautious instruction. Both failed, by unrelated mechanisms —\none emitted nothing, one emitted false completeness. The pattern is not \"Haiku\nis bad at X\". It is that **\"this task sounds mechanical\" keeps being wrong,\nwhich is exactly the condition Rachie attached when she approved the rule.**\nThe burden of proof on going cheaper is now higher than it was this morning,\nand the only clerical claims still standing untested are counting characters,\ncounting tags and comparing two lists.\n\nWhat the comparison looks for is **asymmetric**. Two disagreements are not\nequally bad:\n\n    cheap REFUTES what the good model CONFIRMED   costs a true finding. Annoying.\n    cheap CONFIRMS what the good model REFUTED    ships a false one. This is the\n                                                  one that reaches a buyer.\n\nCount the second kind. **One of those and that stage goes back to the expensive\nmodel permanently, whatever it saves.** A cheap model told \"default to REFUTED\nwhen unsure\" fails by being agreeable, not by being harsh.\n\n### Which tier\n\n- **No model at all — always try this first.** Counting pages, measuring\n  contrast, hashing, grepping, rendering a PDF, checking a file exists. These\n  are `$P` scripts and Bash: exact, and free. The rule was written after a run\n  spawned **35 subagents on the strongest model**, several of which only\n  counted pages or re-read a JSON file. Most of those belonged here, on no\n  model at all — the fix for that waste is not \"use cheap models more\", ing-book\nbrief: 573k cache-write + 4.86M cache-read + **27.7k output**. So\n\n    reading the files   ~90% of the bill\n    writing the answer  ~10%\n\nwhich inverts the usual instinct. **Dropping a model tier saves real money;\nswitching thinking off saves almost nothing**, because thinking is output and\noutput is a tenth of the total. Suppress thinking on clerical stages anyway —\nit is her rule and it costs nothing to honour — but do not expect it in the bill.\n\nRates per million tokens: Opus 5 $5/$25 · Sonnet 5 $2/$10 · Haiku 4.5 $1/$5.\nHaiku is exactly 5x cheaper than Opus, Sonnet 2.5x. One Opus agent over this\nbrief measured **US$1.12**. Applied as above, the 30-agent colouring-book review\ncosts **~$23 instead of ~$34** — 12 of the 30 agents are the clerical ones.\n\n**Wall-clock is core count, not model choice.** This Mac has 8 cores and the\nworkflow cap is cores-minus-2, so **6 agents run at once**, not 30. A 30-agent\nworkflow is five waves: budget 25-35 minutes, not the 10 it looks like. Picking\na cheaper model does not make it finish sooner.\n\n## A second AI reviews the work — floor 70%, and it is counted\n\n✅ **PRE-AUTHORISED 6 Sep 2026: use the STRONGEST model, no asking, for three\nkinds of review.** Anything a **buyer** will read. Anything that **spends\nmoney**. Anything about **how Claude or this system itself should work**.\nEverything else goes on the standard tier.\n\nThis lifts the 10-cent stop in the spend rules for those three only. She said\nyes after seeing what the difference bought: `gpt-5.2-pro` cost **US$0.18** on\none listing and caught reviewer process notes — \"GPT-5 recommended…\" — sitting\ninside the buyer-facing copy, which three cheaper rounds had each walked past.\n\n**The routing is CODE, in `ask_review.tier_for()`, not a sentence here.** This\nfile's own record is that a rule written only in markdown does not hold. Change\nthe routing there. Do not restate the keyword list in this file.\n\n⛔ **AND THE PRE-AUTHORISATION IS CAPPED AT US$0.25 A CALL. Her decision,\n6 Sep 2026, chosen from four options after she asked \"so did you spend money or\nnot\".** The session had spent US$1.31, and US$1.11 of it was ONE call to\n`gpt-5.5-pro` that nobody had priced before running it. The pre-authorisation\nabove had no ceiling, so \"use the strongest model\" could mean one cent or a\ndollar and nothing in between caught it.\n\n**The cap is `CAP_USD` in `ask_review.py`, enforced before the call, not after.**\nA total measured afterwards is a receipt, not a gate. `ceiling()` prices the\nworst case from the prompt in hand and hands OpenAI a `max_output_tokens`, so\nthe limit is the provider's job. Refusals are logged too. Prove it still works:\n\n    python3 ask_review.py --selftest    # 16 checks, offline, bills nothing\n\n⚠ **Two consequences, stated because they change what you get, not buried.**\nFirst, **`TOP` is no longer `gpt-5.5-pro`** — a real pro review measures ~$1.12,\nso routing buyer work there would refuse every review and deliver nothing. TOP is\nnow `gpt-5.5`, the strongest model that fits her cap. That is a recorded model\nchange, not a silent one. Second, **a pro model now needs her yes**, passed as\n`review(..., models=(TOP_PRO, GEMINI), allow_usd=1.20)`. `allow_usd` is RACHIE'S\nfigure. A session setting it to get its own call through is the exact failure the\ngate exists to stop.\n\n✅ **THE RATES ARE NOW VERIFIED — 10 Sep 2026, read off\ndevelopers.openai.com/api/docs/pricing that day.** ~~The dollar figures rest on\nUNVERIFIED rates... Fix the rates before trusting the cap to the cent.~~ Struck,\nnot deleted: it was true when written, and it named the right risk.\n\n⛔ **FOUR OF THE FIVE OLD RATES WERE TOO LOW, AND THE CAP WAS THE CASUALTY.**\n`gpt-5.5` was priced at $1.25/$10.00 against a real $5.00/$30.00 — a **3x**\nunderstatement. `gpt-5.5-pro` was 2x out, `gpt-5.2-pro` and `gpt-5.2` 1.4x. Only\nplain `gpt-5` was right. Because `ceiling()` prices the worst case from that\ntable, **a call approved as 25 cents could really bill up to a dollar. The\nUS$0.25 cap has never enforced the number Rachie set.**\n\n⛔ **EVERY `usd_estimate` IN `qa/review_costs.jsonl` WRITTEN BEFORE 10 Sep 2026\nUNDERSTATES WHAT WAS BILLED.** Recomputed at the real rates, the 13 logged\nOpenAI calls cost **~US$2.47, not the ~US$1.47 the log claims**; an ordinary\n`gpt-5.5` review was **~5.7c, not ~1.9c**. Old rows are left as written — they\nwere honest at the time and carry `UNVERIFIED` — but **do not sum them and quote\nthe total as spend.** Rows written after this date carry\n`VERIFIED 2026-09-10 openai pricing page`.\n\n⚠ **AND THE DEFAULT MODEL MOVED, forced by the correction rather than chosen.**\nAt its real price `gpt-5.5` needs ~US$0.28 for a full answer, so this file could\nno longer run its own default under her cap. `TOP` and `STD` are now\n**`gpt-5.6-sol`** ($4/$20, ~US$0.19 for the same answer). That needed no decision\nfrom her because `SHARED_RULES.md` already named sol the default on 8 Sep and\nonly the code had not caught up — her 9 Sep ruling, the newer rule wins. **The\ncap itself did not move.** `python3 ask_review.py --selftest` passes 16 checks\nafter the change, and the two cases that had encoded the wrong price as an\nexpectation were corrected, with the reason written beside each.\n\n⚠ **Still not checked, and it is the only thing that would settle this to the\ncent: her OpenAI billing dashboard.** The card and the bill can disagree.\n\n⚠ Also measured that day: five review rounds had run on plain `gpt-5` because\nnobody had listed what the key could reach. It reaches 125 models. **Check the\nmodel list before assuming you are on the best one.**\n\n⛔ **DO NOT RUN THE CHEAP-VERSUS-STRONG COMPARISON YET. Decided 6 Sep 2026.**\nThe rule above says a stage may only drop a tier after both tiers have been run\nover the same input and compared. Asked how to run that comparison, gpt-5.2 and\ngemini-3.1-pro-preview agreed on the method — test
