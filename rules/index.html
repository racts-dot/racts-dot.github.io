ews and bestseller badges as evidence of conversion; the\n  same refusal applies here, and social makes the temptation worse because the\n  numbers are large and instant.\n- **Building the campaign before checking the free thing.** Shop Manager → Etsy\n  search visibility is ten minutes, costs nothing, and has still never been\n  opened. It says whether the shop is findable at all. Do it alongside, not\n  instead — but a plan that ignores it is a plan that never looked.\n\n## This machine\n\n    P=~/.venvs/product-factory/bin/python     # 3.14.6. There is no other.\n\n- **`.venv-planner` does not exist** and must never be recreated under\n  `~/Desktop`: iCloud evicts packages and `import reportlab` hangs for minutes\n  at 0% CPU with no error. Every `.venv-planner\\Scripts\\python.exe` in BUILD.md\n  and POSTING_CHECKLIST.md is a Windows path from the other machine.\n  `POSTING_CHECKLIST.md:83-84` tells you to prefer it. Ignore that line.\n- `BUILD.md` mandates `requirements.lock.txt`. It does not exist. Use\n  `requirements.txt`.\n- **Never `git add -A`.** `upload_packs/` is untracked and not gitignored.\n  iCloud also leaves conflict copies named `... 2.jpg`, and\n  `build_upload_packs.py`'s glob stages them as real photos.\n  **Cleared 6 Sep 2026** — the six in `listing_images/` were verified\n  byte-identical to their originals and deleted; `Planner_Journal_Bundle` now\n  resolves to 6 files, not 12. They come back whenever iCloud syncs badly, so\n  check before staging:\n  `find . -path ./.git -prune -o -name \"* 2.*\" -print`\n- **Two or three sessions work this folder at once.** `git worktree list` shows\n  extra checkouts. Two once did the same page-restore within an hour; two\n  verdict files differ only by a truncated filename\n  (`verify_The_Focus_Soft_Life_Clear_Mind_Pla.json` and `...Plann.json`).\n  `git status` before you start and before you stop. Expect files you did not\n  write. Commit only paths you touched.\n\n## Build order that works\n\n    $P rebuild_all.py          # interiors, covers, bundle preview (two passes)\n    $P bundle_builder.py       # delivery ZIPs\n    $P listing_images.py       # NO ARGUMENTS\n    $P build_bundle_images.py  # bundle gallery — BUILD.md omits this step\n    $P build_upload_packs.py   # stages listings by QA verdict\n    $P make_manifest.py        # hashes into LIVE_MANIFEST.md\n\n- `listing_images.py <name>` rebuilds one product and leaves the rest silently\n  stale. `PROJECT_GUIDE.md:162` tells you to do that. Don't.\n- `puzzle_generator.py` is the one generator that never imports `reproducible`,\n  so running it alone produces a different file from the one `rebuild_all.py`\n  ships. Always go through `rebuild_all`.\n- `HANDOVER.md` is a 19 Aug wedding-album handover with nothing about this\n  project. `PROJECT_GUIDE.md` §10 says nothing is listed; the shop is open.\n  Neither describes current state.\n\n## The price rule, in the only place that enforces it\n\nThere have been **zero sales, ever**. Nothing has been sold at any price, so\nthere is no higher price to compare against. **No strikethrough, no \"was\"\nprice, no \"original\", no discount percentage and no \"% off\" may appear on any\nlisting until that item has genuinely sold at the higher price.** A price you\nplan to charge later is not a price you once charged: raising the price after\nreviews land is fine, showing the raise as a discount is not.\n\n`POSTING_CHECKLIST.md:166-183` and `LISTING_READY_focus_planner.md:224-229`\nhave said this all along, citing ACCC enforcement, and **no Python file reads\neither** — which is exactly why it came back. The pipeline reads\n`listing_text.md` (`build_upload_packs.py:33`) and `bundle_builder.LISTINGS`,\nso that is where the rule has to live. It is now enforced on both by\n`test_products.py:214 test_no_invented_price_comparison`, which is on the\npre-upload path. Fix a price claim there or it has not been fixed. Do not\nre-state this rule in another markdown file; add to the check instead.\n\n## The worksheet packs\n\nTwelve maths and literacy packs built by `worksheet_generator.py` on\n`house_style.py`. They are the one part of this repo with a check on the\nshipping path, so the rules below are the rules that make that check real.\n`PIPELINE.md` has the sourced reasoning; this is what you act on.\n\nRun them with `python3 build_worksheets.py` (there is deliberately no\n`if __name__` block in `worksheet_generator.py` — `TASK_KINDS` resolves\nrenderers lazily, and one defined below a `__main__` block dies with\n`NameError`. That bit twice).\n\n### Gotchas\n\n- **Never carry a page value as a float.** Integer minor units — pence,\n  minutes — formatted at the last moment. `0.1 + 0.2 != 0.3` makes the gate\n  reject correct pages.\n- **Small question spaces repeat.** A tenths page has nine possible questions\n  for eight slots. Draw without replacement.\n- **Comparison pages need two independent paths.** Derive the glyph from the\n  values you print; verify by parsing the strings you drew.\n- **Fonts must be embedded.** `house_style.register_fonts()` loads the\n  vendored OFL faces in `fonts/`, and the canvas starts on one\n  (`initialFontName`) — reportlab otherwise emits a Helvetica resource even\n  when nothing uses it, and KDP substitutes a font and reflows the book.\n  `test_products.py` asserts embedding and the absence of any Helvetica\n  reference.\n- **A failed build leaves no new PDF but does not delete the old one.**\n  `build_worksheets.py` removes it; calling `build()` directly does not.\n\n### Safety framing is not optional\n\nThe SEN pack opens with \"Before You Use These\" and the homeschool pack with\n\"About These Records\", both before the contents. Deep pressure has to be\nchild-initiated; anything involving being wrapped needs an adult present; home\neducation reporting duties differ by country and state. Do not drop either\npage to save a page, and keep the caveats if you rewrite the copy.\n\nNever name a SEN or education framework in copy. Zones of Regulation® and\nPECS® were both caught here. Describe the function.\n\n### Before shipping a pack\n\n    python3 vacuity.py        # the new kind must catch a corrupted page\n    python3 test_products.py\n\nThen render two or three pages and **look at them**. The gate catches wrong\nanswers; it cannot see a layout. A \"flower\" dot-to-dot once shipped as a\nheptagon, and three handwriting rows shipped fused together.\n\nRead the page count off the built PDF — you cannot predict it — and write that\nnumber into `listing_text.md`. Etsy title ≤140 characters, exactly 13 tags of\n≤20 each. `test_etsy_limits` now really does check all three: it counts the\ntags (it only ever measured their length, so a block of 16 passed), reads both\nthe `|` and `·` separators and both the `**Tags` and `## Tags` headings, and\nrefuses a title with no tag block at all — which is how three bundle listings\nsat here unpostable, with a title, a price and no tags.\n\n### AI disclosure\n\nQuestions and artwork drawn by this code need none — not created by an AI\ntool. `mandala_generator.py` uses Gemini and does: Etsy wants it *within the\nlisting description*, not the title. KDP treats AI-drafted prose as\nAI-generated \"even if you applied substantial edits\", so record who wrote any\nstring that reaches a page — which is why the covers say \"no AI-generated\nquestions or answers\" rather than the unqualified negative.\n\n\n"}, {"id": "website", "title": "The apps book", "shelf": "Rule books", "path": ".site-publish/CLAUDE.md", "kind": "md", "loaded": "Loads in .site-publish", "blurb": "Her separate book for the website and every app, split out of the global book on 19 Sep: the kit every app carries, the icon rulings, the six checks, and how things deploy.", "chars": 15652, "date": "21 Sep 2026", "body": "# The website and every app — Rachel's rule book for this work\n\n`[HUMAN 2026-09-19]` her words: *\"separate - so the main rule stays as it is, but with the website and\neverything I will want something separate ... rules specifically for that, separate to the digital products.\"*\n\n**Scope:** everything a person opens on a phone or in a browser that is hers - this folder\n(racts-dot.github.io and every app in it), the pages.dev copies (prayer-points, morning-and-evening,\ncreator-reading-room), stay-ledger, and the Notion relay. **Not** the digital products; their book is\n`~/claude desktoi\\CLAUDE.md`. The global book (`~/.claude/CLAUDE.md`) still loads first and\nstill wins on money, public and hard-to-undo.\n\n## Her rules for the apps\n\n- `[HUMAN 2026-09-17]` **EVERY APP CARRIES THE KIT: Aa text size, Read aloud, the 🎙 feedback button, swipe, and Notion.\n  A NEW APP IS NOT DONE UNTIL `python status/app_kit_check.py` SHOWS IT WITH NO GAP.** Her words: \"Every app I told\n  you to have all those things, like to be wired into Notion and everything like that... there's nothing on the new\n  apps\", and \"Why have it not been applied that the swipe for every app?\" Her pick: \"Yes, rule + nightly check\".\n  An app is excused from a piece only by a written reason in that script's NOT_NEEDED. Windows Task Scheduler\n  **`app-kit-check`** runs it at 23:30 every night (no AI) and writes any gaps at the top of HANDOVER.md.\n  Why: each piece had been added by hand to the apps that existed on the day she asked, so Priest Hood shipped with 3 of 5.\n\n- `[HUMAN 2026-09-17]` **THE ICON SET SHE APPROVED STANDS.** Shown all eighteen at phone size on a dark\n  background, her words: *\"I like the thumbnail to be as the above.\"* An icon is replaced only by a\n  full-size redraw of the SAME picture, or on her word. Her picks are read from the artifact database\n  behind her tick-box page, never from a README or a summary of it - the summary was a day stale.\n\n- `[HUMAN 2026-09-17]` **ICONS ARE DRAWN AT SOURCE, NEVER CUT OUT OF A CONTACT SHEET.** Her *\"Go ahead\"*\n  after being shown the halo: a tile cropped from a 30-design sheet is ~175 px, so 512 is an upscale, and\n  the crop carries the sheet's grey into the rounded corners. Regenerate on Vertex (gemini-3-pro-image,\n  US$0.12 each through spend_gate), full bleed to the edge; a tile that comes back floating on a field is\n  cut to alpha or cropped to the tile, and the result is LOOKED AT on a dark background before it ships.\n\n- **NO LIKENESS OF A REAL PERSON AS AN ICON** - a session's call, 18 Sep 2026, said out loud not assumed:\n  her notes *\"Maybe just Hormozi\"* and *\"Maybe just Doser\"* were drawn as what those apps hold (coins and\n  an arrow; a flow of steps), not as faces. If she wants a face, she says so.\n\n- `[HUMAN 2026-09-18]` **NOTHING IS UNPINNED OR MERGED ON A CLAIM OF DUPLICATION UNTIL THE CLAIM IS MEASURED.**\n  Her *\"as long as it is the same duplicate that we have on recipes\"* was checked and failed: Hormozi\n  held 202 items Recipes lacked, Workflows 69. The condition was hers; the measurement decides.\n\n- `[HUMAN 2026-09-17]` **WHAT SHE ASKS FOR ON ONE APP IS ASKED FOR ON EVERY APP, AND IT STAYS ASKED.**\n  Her words: *\"Just apply for the things that I apply for every other app\"* and *\"Probably the rule applies\n  for the same app going forward unless it's asked.\"* A piece she asks for JOINS THE KIT LIST the same day -\n  in `status/app_kit_check.py` - not only the app she happened to be looking at. Only she takes a piece back.\n  ⛔ Why it is written down: on 19 Sep TripShare still had no swipe, two days after the kit rule - *\"There are\n  no swipe and I ask you to put that um one into the list\"* - and pull-to-refresh, which she has asked for\n  repeatedly, is live in 3 of 19 apps because it was never added to the list.\n\n- `[HUMAN 2026-09-18]` **READ ALOUD USES A NATURAL VOICE.** Her words, and she asked for this to be the rule:\n  *\"Put it in the rule book that it has to have the um natural voices.\"* Creator Reading Room is the reference\n  implementation - match it, do not build a second voice stack. Four more of hers about the same voice, all\n  still open:\n  - it reads only what was asked for - *\"a better voice that only reads the questions\"* (Glaucoma study)\n  - the control sits at the TOP of the page, not the bottom - *\"Voice on top not at the bottom\"* (Prayer Points)\n  - voice and speed change by TAP, not a dropdown - *\"tap to change instead of drop box\"* (the Desk)\n  - she can select a part and hear just that part, and SEE what is being read - *\"i want the select to hear the\n    specitic part\"* (Recipes), *\"get things highlighted once you ... activate this ... so we know which pages\n    being talked about\"* (TripShare)\n  - it stops when she leaves the page - *\"the voice gets out of it when I quit. So it has been fixed but\n    hasn't\"* (the Desk). Read as: audio keeps playing after she leaves, and the earlier fix did not hold.\n\n- `[HUMAN 2026-09-17]` **HIGHLIGHTS AND NOTES ARE A KIT PIECE, not a Reading Room feature.** Her words:\n  *\"I will need the highlight versions highlighters as well and the notes probably\"* (Daily Chapter) and\n  *\"Just like the creators reading - make highlights and notes for you to know which needs to be ammeded\"*\n  (Rule Shelf, 19 Sep). Reference: Creator Reading Room.\n\n- `[HUMAN 2026-09-19]` **NOTHING LINKS OUT IF IT COULD LIVE IN THE APP.** Her words: *\"I don't want it in a\n  separate links or some sort. I'll want it like in the same app\"* (Recipes), *\"not to link to somewhere but to\n  like um have the notes so you can do the work here\"* (the Desk), *\"it's better if you have it on the tab not\n  the link\"* (TripShare). A tab, a panel or a pop-up inside the app beats sending her to another page.\n\n- `[HUMAN 2026-09-17]` **EVERY BOX MOVES AND RESIZES, AND IT DRAGS FROM ANYWHERE ON IT.** Her words: *\"all the\n  floating things should be movable, no matter where you're dragging\"* and *\"in every boxes, even for this one,\n  I want to be able to have the option to resize, move it around\"* (Daily Chapter), *\"it doesn't drag if you\n  touch the bottom of a part and there's too much of a bezel\"* (16 Sep), *\"I can't really drag this thing\"*\n  (Rule Shelf, 19 Sep).\n\n- `[HUMAN 2026-09-16]` **AN APP'S CONTENT COMES FROM HER OWN SOURCES.** Her words: *\"I will need it from my own\n  resource. All those information. Do not find it from elsewhere\"* and *\"Everything has to be from the resources\n  like if it is not just mention reference. So I was wanting to get things from the Notion notes and to be\n  here\"* (Priest Hood). Her Notion notes and her files are the source; anything from elsewhere is labelled a\n  reference, never presented as hers. And the source is linked: *\"I will want the link to where it was sourced\n  from, the photos and everything\"* (the Desk).\n\n- `[HUMAN 2026-09-18]` **AN APP WITHOUT ITS ICON IS NOT DONE.** Three notes, three apps, same sentence -\n  Sales Tracker *\"I would like to have some thumbnail for this one, like the app thumbnail\"*, Glaucoma study\n  *\"I will need the thumbnail for the application\"*, Rule Shelf *\"I don't have the um app thumbnail here\"*.\n  The icon is a kit piece; her pick is read from the tick-box page, never from a summary of it.\n\n🚨 **CORRECTED 19 Sep 2026, SAME DAY, BY A WINDOWS SESSION. ~~`status/app_kit_check.py` is in no repo's\n`origin/main`~~ — THAT WAS WRONG AND IT WAS MY SEARCH THAT WAS WRONG.** The file has been on home-notes\n`origin/main` since 17 Sep (`ae18d3a6`), last changed 19 Sep (`b61c19ef`, the viewport piece), 11,882 bytes,\nand `status/` has an exception in that repo's `.gitignore`. My `git ls-tree | grep kit | head` truncated before\nreaching it, so a zero came back from a search that never finished — the 18 Sep lesson, one day late.\n\n⚠ **WHAT IS ACTUALLY TRUE, re-derived on the Mac 19 Sep:** the file is not on the Mac's DISK because\n`~/home-notes` is **99 ahead and 958 behind** `origin/main`, and the 30-minute sync fails on it **every run** —\n`pull FAILED: fatal: Cannot fast-forward to multiple branches` in `status/sync_all_log.txt`, with 2,431 modified\nfiles in that checkout. So every check, rule and register Windows has written for weeks has never reached a Mac\nsession. **That is the machine-level reason her instructions keep having to be repeated, and it is not fixed.**\nUntil it is: run the check from origin without touching the worktree —\n`git -C ~/home-notes show origin/main:status/app_kit_check.py > /tmp/k.py && python /tmp/k.py`.\n\n⚠ **THE CHECK IS ALSO WINDOWS-SHAPED IN TWO WAYS.** `SITE_REPO = HOME/\".site-publish\"` does not exist on the\nMac (the clone here is `~/website`), and the rule's own `python status/app_kit_check.py` is a path that resolves\nonly on Windows, where home-notes IS the home folder. Both need a both-machines form, not the Mac's.\n\n🔴 **AND THE THING THAT MATTERS MOST. RUN ON THE MAC 19 Sep IT REPORTED `25 apps, 4 gaps` — while she was\ntelling us, that same day, that TripShare has no swipe.** It scores swipe by finding the WORD in the served\npage. Her 17 Sep lesson already said a reference is not a load; this is the next step of the same mistake —\n**a reference is not a working feature.** It also does not test five of the things she asks for most:\nnatural voice, pull-to-refresh, highlights and notes, boxes that drag and resize, and the app icon.\n**A green check is why nothing changed for weeks. Do not quote it as evidence until it tests behaviour.**\n\n## The checks (mechanisms, no AI) - an app is not done until these say so\n\n| Check | What it proves | Run |\n|---|---|---|\n| `python status/app_kit_check.py` | Aa, Read aloud, 🎙, swipe, Notion are REFERENCED | nightly 23:30, `app-kit-check` |\n| **Asset sweep** | every file each live page asks for LOADS (a reference is not a load - 18 Sep: two kit scripts 404'd on a page scored 5/5) | fetch each page, request every `src`/`href`, expect 200 |\n| **Corner check** | no sheet grey / white field in the four corners of any icon | read the corner pixels |\n| **Served bytes** | what is live is what is on disk | md5 of the served file = md5 on disk, never a 200 alone |\n| **Read the page, not the folder** | `/videos/` is 출처 찾기, a word-search inside videos, not a library | open the page before drawing for it |\n\n## Deploying\n\n- `[HUMAN 2026-09-21]` ⭐ **SHIPPING THE WEBSITE AND THE APPS NO LONGER NEEDS HER WORD FIRST.** Her words,\n  asked directly after the collision below was put to her: *\"Its ok change so that you dont need my word\"*.\n  Commit, push, wait for Pages, then the served-bytes check - and say in the reply what went live.\n  ~~racts-dot.github.io: commit, push, wait for Pages, then the served-bytes check. Public - so her word first.~~\n  ⛔ **WHY IT CHANGED, and it is not a relaxation - it is admitting what was already true.** Rule 59's\n  save-as-you-go Stop hook commits and pushes EVERY tracked repo at the end of every turn, and\n  `.site-publish` is a tracked repo like any other. Measured 21 Sep 2026: a session held four app-kit fixes\n  back for her word and the hook pushed them public at 11:00 regardless, as\n  \"Save as you go (rule 59): 5 file(s)\". **A rule her own mechanism bypasses on every single website edit\n  is not a safeguard, it is a thing sessions report after the fact.** One of the two had to give, she was\n  shown both, and she chose this one.\n  ⛔ **WHAT THIS DOES NOT TOUCH, and none of it moved:** the global book's rule 7 stands unchanged -\n  **money, Etsy listings, anything bought, sold or hard to reverse still comes to her.** This covers\n  pushing and deploying CODE to racts-dot.github.io and the pages.dev / workers apps. Nothing else.\n  ⚠ **It removes the ASKING, not the CHECKING.** Every deploy still ends with the served-bytes check and\n  a line saying what is now live. Shipping unasked and shipping unverified are different things.\n- The pages.dev apps deploy with wrangler **from the Mac only** (Windows wrangler is not logged in). Windows\n  commits; a Mac chat runs `npx wrangler pages deploy` ~~on her word~~ (no longer needed, 21 Sep) and reports\n  the URL; Windows checks the bytes.\n- Never relay her \"go\" to another session as authorisation for something she was not shown. If a session\n  needs her yes, it asks her. (18 Sep, the Mac was right to refuse.)\n\n---\n\n## Sales Tracker and this folder — the traps already paid for\n\nThis folder IS the live website. It publishes to https://racts-dot.github.io/\n\n### The one rule\n\n**There must only ever be ONE copy of this folder on this computer, and it is\nthis one: `~/Desktop/Sales Tracker Website`.**\n\n- Never copy or duplicate it anywhere else — not Downloads, not Google Drive,\n  not a backup folder.\n- Never put it in a Drive-synced folder. Drive fights with the hidden `.git`\n  record and corrupts it silently.\n- To work on it from another computer, `git clone` a fresh copy. Never carry\n  the folder across.\n\n**Why:** on 9 Sep 2026 there were two copies. They drifted apart, and one held\nTripShare — 1,210 lines that existed nowhere else and had never been sent up.\nIt was nearly deleted. The duplicate was removed the same day.\n\n### Before you finish, always\n\n    git add -A && git commit -m \"what changed\" && git push\n\nWork sitting on this disk and not on GitHub is work that can vanish. If a push\nis refused, say so plainly — do not leave it unsaid.\n\n### What is in here\n\n| Path | What it is |\n|---|---|\n| `app.html` | Sales Tracker — the resale stock/sales app |\n| `tripshare/` | TripShare |\n| `todo/`, `worklog/` | the other two pages |\n| `index.html` | front page linking them |\n| `AppsScript-Code.gs` | connects the app to Google Sheets |\n| `DEPLOY-INSTRUCTIONS.txt` | how to set that connector up |\n\n### app.html — the trap that has already broken it once\n\nThe data is baked into the page as `data-*` attributes on\n`<div class=stock>` cards and `<tr class=fb>` rows. ~~There is no data file and no\ngenerator script.~~\n\n⛔ **CORRECTED 10 Sep 2026 BY MEASUREMENT — THE DATA FILE AND THE GENERATOR BOTH\nEXIST. They are just not in this repo.** They are in Google Drive, at\n`My Drive/01 BUSINESS & CREATION/Ecommerce integration/racts-tracker-backup/`:\n\n| File | What it is |\n|---|---|\n| `June Sales Tracker.xlsx` | the master data — one sheet, 296 rows |\n| `gen_tracker_html.py` | 70 KB. Builds the whole page and writes `Tracker_View.html` |\n| `gen_stock.py`, `html2pdf.py` | build the printable stock list and its PDF |\n\n⛔ **DO NOT REGENERATE `app.html` FROM IT. It would delete four things.** The\ngenerator was saved 2 Aug. Everything added by hand after that is missing from\nit — checked by searching both files on 10 Sep 2026:\n\n| Feature | in `app.html` | in the generator |\n|---|---|---|\n| `markSoldPrompt` | yes | **no** |\n| Apps Script link (`script.google.com`) | yes | **no** |\n| Mark Sold button | yes | **no** |\n| Test products section | yes | **no** |\n\nSo `app.html` is the newer artefact and the generator is behind it. Treat the\ngenerator as a record of how the page was first built, not as a way to rebuild\nit. Anyone who runs it and copies the result over `app.html` loses the Sheets\nconnection.\n\n- **Plain search-and-replace on it is unreliable.** Attribute values contain `>`\n  characters, and some cards nest blocks holding the opposite `data-sold` value,\n  so naive counting double-counts #67, #111 and #114.\n- **Counting brackets is not a syntax check.** On 24 Aug an edit produced\n  `markSoldPrompt(''+d.num+'')`, which reads as three strings jammed together.\n  The whole page died — every tab, filter and button — and the bracket check had\n  passed.\n- **So: load the page in a real browser and read the console before pushing.**\n  That is the only check that would have caught it.\n"}, {"id": "quality", "title": "The quality standard", "shelf": "Rule books", "path": "claude desktoi/QUALITY_STANDARD.md", "kind": "md", "loaded": "Digest injected at session start", "blurb": "The release gate, the geometric gates, claims discipline, the iteration loop. Binding on every product.", "chars": 17075, "date": "10 Sep 2026", "body": "# Quality standard — every product, every time\n\n**This applies to all printable products: colouring, mandala, maze, word search,\nsudoku, dot-to-dot, planners, diaries, notebooks. Any new line inherits it.**\n\nWritten 24 Aug 2026, after two independent visual reviews judged a fully\nQA-passing product *\"a A$3 auto-generated pack, not an A$8.50 product.\"*\n\nEvery gate below exists because something real went wrong. Nothing here is\ntheoretical.\n\n---\n\n## 00. THE RELEASE GATE — overrides everything below\n\n> **You may not start or substantially revise another product until the current\n> product has been viewed exactly as a buyer will see it, every buyer-facing\n> factual claim has evidence, and the product has either been LISTED or KILLED.**\n>\n> Not \"approved.\" Not \"ready.\" Not \"finished.\" **Listed or killed.**\n\nThe diagnosis, 24 Aug 2026: *\"You have a factory with no release gate.\"*\nThirteen finished products on disk, zero listed. The working definition of\nfinished had become `files + copy + listing assets = complete`. **The actual\nproduct is what a stranger sees on the storefront, plus what they receive after\npaying** — and nobody was inspecting that object.\n\nEvery defect in this document is one mistake wearing different clothes:\n**production outran verification and publication.**\n\nFull reasoning: `RELEASE_GATE.md`.\n\n---\n\n## 0. The rule that caused all the others\n\n> **QA numbers tell you what you are ALLOWED to say. They do not tell you the\n> product is good, and they never become the thing you say.**\n\nA product passed **1,329 automated checks** and **60 QA gates**, cleared a\nformal preflight sign-off, and was still judged commodity-grade the moment\nsomebody actually looked at it. Measurements confirm absence of defined faults.\nThey cannot confirm presence of quality.\n\n---\n\n## 1. LOOK AT IT. Every time. No exceptions.\n\n**Before any product is listed, a rendered image of the actual output must be\nviewed — not the metrics, not the source, the picture.**\n\n- Claude reads rendered PNGs directly. Use that. \"An LLM cannot see what it drew\"\n  is true of generated SVG/HTML; it is **not** true of a rasterised page.\n- **Get an independent visual read** from a second model before listing.\n  Vertex AI works and costs a fraction of a cent — see §7 for the exact call.\n- If the reviewers disagree, that disagreement is the most useful signal you\n  will get. One reviewer said \"cut plates 14–30\"; the other said \"there are weak\n  early pages and worthwhile late pages.\" The second was right.\n\n**Never ship a product no human or vision model has looked at.**\n\n---\n\n## 2. Shop images are chosen by eye. Never by index.\n\nThe cover plate for The Botanical Wheel was selected by:\n\n```python\nplates[len(plates) // 2]        # the middle filename of a sorted list\n```\n\nThat returned the muddiest page in the book, and it became the shop thumbnail —\nthe single thing that wins or loses the click.\n\n**Rules:**\n- Every listing image is named as an explicit constant at the top of the build\n  script (`COVER_PLATE`, `SAMPLE_OPEN`, `SAMPLE_DENSE`, `SAMPLE_DETAIL`).\n- A rebuild must never be able to silently change which image is the cover.\n- **Build a candidate contact sheet and choose by comparison**, not in isolation.\n- The cover must lead with the product's *strongest* work. Obvious, and it was\n  still got wrong.\n- ⭐ **AND RACHEL PICKS IT. `[HUMAN 2026-09-08]`** Chosen during the rule walk over\n  a version where the assistant chose by eye alone. **Send her the candidate\n  contact sheet and let her pick BEFORE the image goes up.** This deliberately\n  adds a wait on her — she took that trade knowingly, because the first picture a\n  buyer sees is the thing that wins or loses the click.\n\n---\n\n## 3. Curate ruthlessly. Fewer good pages beat more mixed pages.\n\n> \"I would rather see 13 good pages at A$3.95 than 30 mixed-quality pages at A$8.50.\"\n\n- **The weakest page sets the perceived value of the whole product**, not the best.\n- Do not pad to a round number. Thirty is not a target.\n- Do not justify weak pages as \"advanced difficulty.\" Difficulty is not their\n  problem; compositional failure is.\n- **Cut before you list.** Every weak page is a future 2-star review.\n\n**Gate:** if a reviewer would not personally use a page, it does not ship.\n\n---\n\n## 4. Hard geometric gates — colouring and line-art products\n\nFrom `mandala_book/ENGINEERING_BRIEF_quality.md`. Numbers are the standard; do\nnot quietly alter them.\n\n| Gate | Threshold | Why |\n|---|---|---|\n| **Minimum enclosed-region width** | **inscribed circle ≥ 2.5 mm** (target 3.0 mm), within the tolerance below | Area is the wrong metric — a 0.6 × 12 mm sliver has 7.2 mm² and is horrible to colour. Below ~2.5 mm the user pokes pigment into a crevice instead of making a colouring motion |\n\n### The sub-2.5 mm tolerance — amended 27 Aug 2026\n\nThis gate previously stated 2.5 mm and stopped, saying nothing about how much\nsub-2.5 mm area a page may contain. A gate with no tolerance is not\nenforceable, so every implementation invented its own and they all disagreed:\n`qa_ai.py` redefined \"too small\" as 1.5 mm, `mandala_book` had the region gate\n**switched off**, and `colouring_qa` used an unwritten 5%. \"Passes QA\" therefore\nmeant nothing across products — the same plate passed or failed depending on\nwhose script ran.\n\nMeasured, not assumed (`colouring_qa/calibrate_tolerance.py`, 300 dpi A4):\n\n| case | % of colourable area under 2.5 mm |\n|---|---|\n| Only large clean shapes | **0.00%** |\n| Plus ordinary crossing and tangential line detail | **0.29%** |\n| Dense hatch at the texture-spacing limit — a real defect | **23.64%** |\n\n**A zero tolerance is not absurd.** It had been argued that antialiasing alone\nmakes zero impossible; that is false. Antialiasing slivers carry negligible\n*area*, and this metric is area-weighted, so a clean page really does score\n0.00%. Zero is merely impractical for deliberately detailed work.\n\n**The permitted share depends on positioning**, because one number cannot serve\nboth ends of the catalogue: the 25 Aug review evidence shows intricate buyers\ncomplain about *insufficient* detail while bold-and-easy buyers complain about\n*excessive* detail. Record the positioning in the product README before QA runs.\n\n| Positioning | Max % of colourable area below 2.5 mm | Basis |\n|---|---|---|\n| **Bold and easy / large print** | **1.0%** | the format's whole promise is easy colouring; normal line detail costs 0.29% |\n| **Standard adult** (cozy, botanical, animal) | **2.0%** | A4-prepped cozy pages measure 1.44% |\n| **Intricate / mandala** | **3.5%** | mandala plates measure 1.49–3.68%; detail is the point |\n| **Any positioning — hard stop** | **8.0%** | the killed pancake-bear page measured 5.30%; dense-hatch failure 23.64% |\n\n**Report the measured figure in every QA run, pass or fail.** A gate whose\nnumber is not printed is a gate that can be switched off unnoticed — which is\nexactly how `mandala_book` shipped 30 pages against a disabled check.\n\n**No implementation may define its own threshold.** All colouring QA imports\nthese constants from `colouring_qa/geometry.py`. Any threshold *not* in this\ndocument must be a named constant that prints its own provenance in the failure\nmessage.\n\nTwo corollaries, both learned the same day:\n\n- **A deliberate frame is not clipping.** All 12 butterfly plates reported an\n  identical 28,336 px of \"edge clipping\" that was the series' own double-rule\n  border. Detect the frame and measure inside it.\n- **Gate prepped output, never raw generations.** `cat_library_v3.jpg` raw is\n  REJECT; the identical image after `to_a4()` clears every gate. The pipeline is\n  generate → prep → gate → regenerate.\n\n**Unresolved, and it blocks a product.** `colouring_qa` measures the mandala\nplates at 1.49–3.68%, which passes even the intricate band, while this project\nrecords 14 of 30 failing once `mandala_book`'s own region gate is enforced. Two\ngates disagree about the same pages. **This amendment does not clear\n`mandala_book`; the DO NOT LIST order stands until that is reconciled.**\n\nSample behind the bands: 20 pages, 3 product lines, one machine. Defensible\nstarting numbers, not proven ones — revisit once a labelled pass/fail set exists.\n| Minimum region area | ≥ 6.0 mm² | secondary to the width gate |\n| Negative space inside the design | **0.32 – 0.52** | measured inside the active footprint, from silhouette union — NOT ink coverage, NOT the white page around it |\n| Worst annulus negative space | **≥ 0.20** | a global average hides a dark belt |\n| Zone density contrast | **max/min ≥ 1.5** | uniform pressure everywhere reads as \"filled\", not \"designed\" |\n| Texture stroke spacing | **≥ 0.65 mm** apart | closer than this and texture becomes a black bar |\n\n### Line hierarchy — four weights, defined in mm, never one\n\n```python\nSTROKE = {\"silhouette\": 0.38, \"structure\": 0.28, \"secondary\": 0.20, \"texture\": 0.15}\n```\n\n> \"A premium drawing tells me which line is important. Here almost every line is\n> equally loud.\"\n\nTexture must never become a second contour system.\n\n### Scale hierarchy — stop making everything the same size\n\nFocal motifs **1.5–2×** ordinary motifs. Typical: focal 28–35 mm, main elements\n12–18 mm, supporting 8–12 mm, detail 3–6 mm.\n\n---\n\n## 5. Anti-generator rules\n\nThe buyer must stop thinking *\"generator\"*. These are the tells:\n\n- **Radial/grid stamping.** Never one module rotated k times. Generate\n  independent variants with structural counterparts.\n- **Independent random jitter.** Also a tell. Drive variation from a smooth\n  cyclic field so geometry drifts gradually rather than looking randomised.\n- **Isolated closed symbols.** Floating circles read as clip-art. Elements need\n  **attachment logic** — berries hang from pedicels, veins spring from a midrib.\n- **Perfect primitives.** A mathematically exact circle looks CAD-made. Low\n  amplitude harmonic distortion keeps it visibly round but drawn.\n- **Vocabulary sprawl.** Three well-developed families per page beats eight\n  generic symbols. Repetition inside a coherent language looks designed.\n\n---\n\n## 6. Claims discipline — what you may print\n\nEvery claim in listing copy, on a cover, or inside a product must trace to a\nmeasurement that was actually taken.\n\n**Banned unless specifically re-measured:**\n- \"exactly symmetrical\" — measured 0.845, not exact\n- \"true N-fold axis\" — **the same overclaim in technical dress**. This was\n  proposed as the *safe* replacement by a formal QA doc and it was not safe\n- \"every line closes where it should\" — requires a topology test nobody ran\n- \"sharp at any size\" / \"however large you print it\" — vector geometry scales;\n  PDF viewers, printer drivers, resolution and paper do not\n- \"no AI artefacts\" as a *consequence* of \"no image model\" — does not follow.\n  Procedural code produces ugly geometry too, and this project proved it\n- \"hand-drawn\" — it is algorithm-drawn. Never blur this line\n\n**Check the product too, not just the listing.** The Botanical Wheel's own title\npage printed \"sharp at any size\" after that claim was cut from the listing.\n\n---\n\n## 7. The iteration loop — run it until it passes\n\nNever \"generate once and ship\". Every generation round:\n\n```\nGENERATE  →  MEASURE (§4 gates)  →  SCORE  →  VISION REVIEW  →  FIX  →  REGENERATE\n```\n\n**Ask a vision model on EVERY round, not just the first.** Send the rendered\nplates and use a *fixed* evaluation prompt so answers are comparable round over\nround — a fresh essay each time cannot show whether you are improving.\n\n### Working Vertex call (verified 24 Aug 2026, costs a fraction of a cent)\n\n```\nproject  [project id removed]   account [email removed]\nendpoint https://us-central1-aiplatform.googleapis.com/v1/projects/{PROJ}\n         /locations/us-central1/publishers/google/models/{MODEL}:generateContent\nauth     Bearer $(gcloud auth print-access-token)\n```\n\n- `gemini-2.5-flash` works. ✅ **CORRECTED 1 Sep 2026: `gemini-2.5-pro` WORKS TOO** — re-tested live against this project, HTTP 200. This bullet said it returned HTTP 429 and to fall back to flash. That was true when written and stopped being true on 30 Aug; the correction was applied to the global CLAUDE.md and to nowhere else, so this file — the one the project calls **binding on EVERY product** — kept contradicting it. ⚠ **Re-test a model before trusting any \"does not work\" note: a quota block is temporary, but a note about one reads as permanent.** Pro pricing, verified: $1.25 in / $10.00 out per 1M tokens (<=200k prompts). ⛔ **~~`gemini-3-pro-preview` is NOT available on this project (404).~~ WRONG, CORRECTED 10 Sep 2026: THAT NAME DOES NOT EXIST.** The real one is `gemini-3.1-pro-preview` - with a `.1` - and it ANSWERS (HTTP 200). A 404 from a guessed name was written down as \"not available\" and quoted for over a week. **Enumerate the catalogue instead of typing names: `python review_board/ask_gemini_vertex.py --catalogue` - free, lists 26 Gemini models.** ⚠ The 3.1 preview's price is UNVERIFIED; 2.5-pro stays the priced fallback.\n- Pass the token via an env var: `gcloud` is a `.cmd` on Windows and\n  `subprocess` cannot execute it directly.\n- ⛔ **CORRECTED 7 Sep 2026: the browser is NO LONGER the default route.**\n  It costs nothing in dollars but ~170,000 Claude tokens per review, against ~4,000\n  for `review_board/ask_openai_api.py` at ~9c. That script takes `--image`, so vision\n  reviews go through it too. Chrome is for logged-in sites only.\n  **Beware: the composer can auto-select the Pro model, which has its own small\n  quota separate from the main allowance.** Hitting it burns the attempt.\n\n### Stopping rules\n\n- **Ship** when every hard gate in §4 passes AND an independent vision review\n  says it reads as designed rather than generated.\n- **Stop and rethink** when a round produces no measurable improvement over the\n  previous one. Iterating past that point is sunk cost.\n- Detailed scorecard with weights and pass mark: see\n  `mandala_book/BUILD_PLAN.md` once the current build workflow lands.\n\n---\n\n## 8. Price follows the weakest page\n\n- Price is set by what a stranger sees, not by effort spent or QA passed.\n- Never use the list-high-then-50%-off anchor. 62% of the market does it, which\n  makes it **common, not effective**, and a permanent fake discount destroys the\n  only thing a launch measures: *will a stranger pay this?*\n- Above the category median needs a visible reason. A$8.50 against a A$3.79\n  median is defensible only if the interior is consistently good.\n- **A cover that promises more than the interior delivers is the actual failure\n  mode.** Not ugly drawings — a broken promise.\n\n---\n\n## 9. The honest ceiling\n\nWith good procedural geometry plus ruthless automated **and human** curation,\n~**80–90%** of high-end illustrated quality is reachable in a narrow ornamental\nstyle. The last 15% is hundreds of page-specific human judgements and is\nextremely expensive to encode.\n\nThat is enough. The threshold to clear is not \"beat a famous illustrator\" — it\nis **\"the buyer stops thinking generator.\"**\n\n---\n\n## Pre-listing checklist\n\nNothing gets listed until every box is ticked.\n\n**Box zero, and it is a command, not a sentiment — added 2 Sep 2026:**\n\n```\npython release_check.py <product>\n```\n\nIt reads `release_registry.json`, runs every gate that product has DECLARED as\nrequired, and hashes the exact files a buyer receives before and after the run.\nIt fails if a required gate is missing, if a declared gate script is not on disk,\nif a product has zero required gates and no written reason, or if an artefact\nchanged while it ran. It prints how many of those gates have never been proved\nable to fail, and it never prints the bare word PASS.\n\nWhy it exists: ChatGPT Pro and Google Gemini Pro, blind to each other, both\njudged this quality system not good enough on 2 Sep 2026. ChatGPT's single\nhighest-return change, verbatim: *\"Build one mandatory, versioned release runner\nwith a machine-readable gate registry, executed against the final exported\nfiles.\"* Its three rules, which that script mechanises: **a gate that exists but\nis not run is not a gate; a threshold that cannot fail is not a threshold; a\nresult that is not bound to the released files is not release evidence.**\n\n⛔ **A clean run is permission to LOOK. It answers \"is this file valid\". It does\nnot answer \"does this look competent\" or \"is there a reason to buy it\", and the\nword PASS was hiding the difference.**\n\n- [ ] `python release_check.py <product>` run, and its evidence file kept\n- [ ] Rendered output has been **looked at**, not just measured\n- [ ] An **independent vision review** has been run and its verdict recorded\n- [ ] Weak pages **cut**, not padded or excused\n- [ ] Cover chosen **by eye** from a candidate sheet, named as an explicit constant\n- [ ] All §4 geometric gates pass\n- [ ] Every claim in the listing traces to a real measurement (§6)\n- [ ] Claims **inside the product** checked too — covers, title pages, footers\n- [ ] Price justified against category median, no fake discount anchor\n- [ ] The listing's promise matches what the interior actually delivers\n"}, {"id": "history", "title": "Rule history", "shelf": "Rule books", "path": ".claude/RULE_HISTORY.md", "kind": "md", "loaded": "On demand — the archive", "blurb": "Every retired and reworded rule, kept word for word with your quote. Nothing is deleted, only moved here.", "chars": 144214, "date": "19 Sep 2026", "body": "# Rule history — the stories behind the rules\n\n**Moved here 8 September 2026, at Rachel's instruction.** She chose *\"keep the rule, move the story out\"* after going through the rule book one row at a time.\n\n**Nothing here was deleted.** Each rule in `hooks/answer_style.py` keeps its instruction and its before/after example. What moved is the account of the incident that caused it — the part that was being pushed into every single reply and had grown to be most of the file.\n\n**Read this when:** you are about to change or delete one of these rules, or someone asks why a rule exists. Do not quote it as a current instruction; the operative copy is in `answer_style.py`.\n\n---\n\n## Row 5 — Never invent a substitute\n\n`[HUMAN 2026-09-06]` her words: *\"stop making things up and put it into the rule??????????????? there is part 3 of 4\"* — said after exactly this failure.\n\n**What happened.** She sent \"Part 1 of 4\". Parts 2–4 did not arrive in that session. Instead of saying so and stopping, the assistant picked a different document, declared it a stand-in for \"part 2\", walked her through it, **invented a numbered sequence for it**, and then referred to \"item 3\" as though it were something she was waiting on. It was not. None of it existed.\n\n**Never carry an invented structure forward.** Once a substitute is named, its numbering, its items and its \"still open\" list all become fake work she is asked to track. That is worse than the original gap.\n\n**Saying \"I don't have it, so I am using X instead\" does NOT make it acceptable.** The assistant did say that, once, and then behaved for an hour as though X were real. Flagging an invention does not license it.\n\n---\n\n## Row 6 — Permission comes before the act\n\n`[HUMAN 2026-09-07]` Built at her instruction after the review loop closed. This is the first of the three gaps ChatGPT named and the evidence rule does not cover.\n\nChatGPT, verbatim: *\"The assistant could remove the tool, verify its absence, and accurately report an unauthorised action. Permission must be established before the removal. Completion evidence cannot supply missing authority.\"*\n\n**The real incident, 6 Sep 2026.** She said *\"make it a routine\"* about a recommendation that contained a deletion. That was read as approving the deletion. It was not. She caught it herself: *\"why are you deleting or taking away what needs to be done\"* and *\"its getting questionable\"*. Her ruling when it was restored: *\"i do not understand so until i get the understadning, put it back\"*.\n\n**Approval of a recommendation is not approval of every part of it.** If a recommendation contains a removal, the removal must be named separately and agreed separately. \"Make it a routine\", \"go ahead\", \"yes\" and \"do it\" cover what was ASKED, not what was bundled.\n\n**The argument may still be made.** Say why it should go, then leave it in place until she says otherwise. That costs one message. Acting alone cost her trust.\n\n---\n\n## Row 9 — The shape of every chat reply\n\nHer instruction, 6 Sep 2026. She gave this to a session on her Mac, where it landed in ONE project's CLAUDE.md and so reached no other folder. It is a reply rule, not a project rule, so the operative copy lives in `answer_style.py`, injected every turn.\n\n**Her sharpening, the same day:** *the bold lines read alone must BE the whole answer.* A label is a failure.\n\n**The withdrawn part.** Point 2 used to say: end every reply with ONE line, twenty words or under, the SAME line every time. Her words withdrawing it, 7 Sep 2026: *\"do not get the rule where you remind every single time about the things to do like etsy listing its really annoying\"*. It was repeated verbatim for a whole session and she stopped reading it, which is the opposite of what it was for. **Do not restore it.**\n\n**On jargon**, 6 Sep 2026: *\"you can say some jargons i would understand.\"* She is building marketing and analyst skill deliberately — the profile says she wants to reach the top tier at communicating tech and business. Writing round every term keeps her a beginner and makes replies longer, not shorter. The test is whether it gives her a word she can reuse with someone else, not whether it sounds expert.\n\n**Feedback versus rules.** Settled 6 Sep 2026 over two corrections, the second reversing the first. She first rewrote \"you gave me six writing rules, now permanent\" into \"six writing feedbacks to apply going forward\". That was read as \"do not claim permanence\". Her next message corrected it again: *\"m feedback to apply as rules to be made permanent *?\"* **So both halves hold.** What she gives is FEEDBACK — never call her input \"rules\". What the assistant does with it is turn it into a PERMANENT RULE, and saying so is right, because she wants to know it will not be lost.\n\n---\n\n## Row 11 — The implication never gets cut\n\nHer correction, 6 Sep 2026. It overrode what had been written an hour earlier.\n\nThe assistant had turned her *\"just write the fault\"* into a general ban on consequence clauses. She struck it down with two questions:\n\n> *\"who is the one that tells which is obvious?\"*\n> *\"implication is the most important thing\"*\n\nShe was right, and the rule contradicted her own standing instruction from the same day — that the closing bullets must say what a thing MEANS FOR HER.\n\n**The meta-fault to avoid: do not promote one of her line edits into an absolute rule.** She corrects a sentence; that is a sample, not a statute. Two of the six rules written up on 6 Sep were over-generalised this way within the hour, and she caught both.\n\n---\n\n## Row 1 — how the spoken-ending rule got built\n\nTraced 8 September 2026 at her request, after she said *\"the spoken summary doesn't stay plain words… do not set such rule. find out how come you ended up that way.\"*\n\nIt was not invented. One true fact of hers, then three more caps stacked on top:\n\n1. **8 Sep, her words:** *\"just send one sentence after whatever you have replyed just so that i can Play the audio for just the last paragraph\"*. She plays audio of the last paragraph. A table read by a speaking voice is gibberish. **This part is real and she has not withdrawn it.**\n2. **8 Sep, hours later:** *\"if I told you to do it in one paragraph and one sentence for whatever I need to know but it's too still long\"* — became a hard cap of 25 words.\n3. **8 Sep:** *\"before the last paragraph… you have to give a few sentences the whole context\"* — became a second paragraph capped at 70 words.\n4. **4 Sep:** an outside review said tables *\"are especially difficult because their relationships are visual\"*. That advice was about the **.md file she listens to**. It was applied to the **chat reply's ending** as well.\n\n**Result: about 95 words with no structure allowed** — which is why the part she says matters most had become the thinnest part of every reply. Nobody decided that. It accumulated.\n\n**Her decision, 8 Sep 2026: option B plus C.** A glance block she can scan, then a spoken block underneath that carries structure aloud (\"three things — one, two, three\"). The 25-word cap is withdrawn.\n\n---\n\n## Row 16b — one minute, not two\n\n`[HUMAN 2026-09-09]` her words: *\"So I'm aware that there's going to be just two\nminutes in replies and I probably want one minute.\"*\n\n    Was: stays under TWO MINUTES. One minute is ideal. Aim 150, never 300.\n    Now: stays under ONE MINUTE. About 150 words, and 150 is the ceiling.\n\n**Why the old wording failed.** It gave two numbers — a preference and a limit —\nso every reply drifted to the limit and none of them was ever wrong. One number\nnow, and it is the same 150 rule 8 already carries and close to the 140 the\nlength check already enforces.\n\n`[HUMAN 2026-09-09]` and immediately after: *\"Don't add to the rule part, just\nfor the rule book. Keep examples how it is.\"* The first version of this change\nwrote eight lines of reasoning into rule 16b itself. **The rule got the new\nnumber and nothing else; the account of it lives here.** That is the same call\nshe made on 8 September — keep the rule, move the story out.\n\n## Rule 60 added — 9 Sep 2026\n`[HUMAN 2026-09-09]` Rachel: *\"Whenever I'm working on it, can you not disconnect\nany of the remote controlled task?\"* Then, asked to make it reach the Windows PC:\n*\"what about windows\"*.\n\n**Added, nothing changed:** rule 60 in group 3 (WHEN TO ACT ON YOUR OWN). No\nexisting rule was reworded or removed. Group 3's header list now reads\n\"rules 13, 39, 52, 53b, 60\".\n\nIt was first saved only to the Mac's own memory, which Windows never reads. This\ncommit is what carries it across. **Windows does not have it until someone runs\n`git pull` in `~/claude-config` there.**\n\n---\n\n## Row 61 — the digital-product value bar\n\n`[HUMAN 2026-09-10]` her words: *\"add in the digital product bit, you can put it\nneeds to be better than, in value, 0.01% top competitors.\"*\n\n**Where the bar already lived, swept before this was added:**\n\n| Place | Wording |\n|---|---|\n| Rule 13 | \"better value than the top 0.01% available\" — one clause inside a rule about how sure you are, in the WHEN TO ACT ON YOUR OWN group |\n| `CLAUDE.md`, THE PRODUCT BAR leg 2 | \"best value-for-money in its market — not the cheapest, and not merely defect-free\" |\n| `SHARED_RULES.md` in the printables repo | the same paragraph again — that file mirrors the shared body |\n\n**So the bar existed three times and fired none of them.** It was never in the\nproduct group, which is where anyone building a product looks. Rule 61 puts one\ncopy there, in her words, naming competitors rather than \"available\".\n\n**Rule 13 was NOT touched.** Rule 55 reserves rule wording to her, so the\noverlap is flagged inside 61 and the merge is hers to call.\n\n`[HUMAN 2026-09-10]` **Asked which copy should stay, she chose \"leave both as they\nare\"** — shown three options including cutting the clause from rule 13. So rule 13\nkeeps \"better value than the top 0.01% available\" AND rule 61 says it in her words.\n⛔ **Do not \"tidy\" this into one rule.** It is a deliberate duplicate she was warned\nabout and kept. The ⚠ pointer inside 61 stays so the overlap is never a surprise.\n\n\n## Removed 11 Sep 2026, 23:15 — the Higgsfield \"cap at 20\" amendment\n\n`[HUMAN 2026-09-11]` Her words, asked what unit \"20\" was: *\"it does not need to be a rule, it can be clarified, let's get rid of it.\"* So the whole amendment below leaves the global book. The standing Higgsfield rule above it — ask first, every time it costs credits — is what remains. Moved here word for word:\n\n- ⭐ **AMENDED BY RACHEL 11 Sep 2026 — THERE IS NOW A STANDING CREDIT ALLOWANCE, SO THE\n  \"ASK EVERY TIME\" ABOVE IS SOFTENED, NOT DELETED.** Her words, verbatim:\n  *\"use the credits is fine. just cap at 20 fornow.\"*\n  **Read as: up to 20 CREDITS may be spent without asking again. Above 20, stop and ask.**\n  ⚠ **The unit is READ as credits, not dollars — the conservative reading, and it was not\n  stated.** She said it in reply to a list where the only \"credits\" item was Higgsfield cover\n  artwork, and the API spend in that same list was quoted in cents. **If a job would spend\n  more than a couple of dollars, confirm the unit with her before committing.**\n  ⛔ **THE OTHER HALF OF THE OLD RULE STANDS AND IS NOT SOFTENED: STATE THE MODEL, THE COUNT,\n  THE RESOLUTION AND THE CREDIT TOTAL BEFORE GENERATING.** An allowance is permission to\n  spend, never permission to spend silently. Log every generation against the 20.\n  ⛔ **\"for now\" is hers and it is a clock with no end date on it. Treat 20 as the live\n  ceiling until she changes it, and re-raise it rather than assuming it renews.**\n  📒 **SPENT AGAINST IT SO FAR: 0 credits.** The covers it was granted for turned out to be\n  already made — see `HANDOVER.md`. The allowance was never touched.\n  ✅ **And the prompt-review rule below still binds every credit spent: draft prompt → GPT\n  reviews it → only then generate.** Rework, not the base rate, is what actually costs.\n\n\n## Crossed-out lines moved out of the loaded rule books — 11 Sep 2026, 23:20\n`[HUMAN 2026-09-11]` Her words: *\"I can just get rid of the cross-out lines because it is going to add all those characters.\"* Each fragment below was struck-through wording sitting inside a file the AI reads every session or every turn. Removed from the live file, kept here word for word with the line it sat in, so nothing is lost and nothing is loaded.\n\n**21 fragments in all.**\n\n- **global rules**, line 46: ~~Draw a diagram where one helps.~~\n  in: `asks for them. Explain any jargon inline. ~~Draw a diagram where one helps.~~`\n- **global rules**, line 321: ~~GPT breaks the tie~~\n  in: `prompts are the same.\"* ~~GPT breaks the tie~~ — struck: the ROUTE is now`\n- **global rules**, line 397: ~~Up to 30 times~~\n  in: `products\"*.** ~~Up to 30 times~~ struck, not deleted. It is still a CEILING, not a`\n- **global rules**, line 591: ~~3 Sep: Word Search `4562427400` only, 1 view, 0 clicks, US$0.00.~~\n  in: `~~3 Sep: Word Search `4562427400` only, 1 view, 0 clicks, US$0.00.~~ **Struck, not`\n- **global rules**, line 604: ~~⛔ **A HUMAN MUST SWITCH THE CAMPAIGN OFF ON 9 SEP.**~~\n  in: `~~⛔ **A HUMAN MUST SWITCH THE CAMPAIGN OFF ON 9 SEP.**~~ ✅ **DONE — struck, not`\n- **global rules**, line 611: ~~⛔ \"COST NOTHING\": 136 views, 0 clicks, US$0.00 across 8 Aug – 7 Sep.~~\n  in: `~~⛔ \"COST NOTHING\": 136 views, 0 clicks, US$0.00 across 8 Aug – 7 Sep.~~ **Struck.**`\n- **global rules**, line 612: ~~🚨 SUPERSEDED: 383 views, 3 clicks, US$1.09. It is STILL RUNNING.~~\n  in: `~~🚨 SUPERSEDED: 383 views, 3 clicks, US$1.09. It is STILL RUNNING.~~ **Struck too.**`\n- **global rules**, line 634: ~~TRIGGER: 30 listings. Today 4 active + 1 draft. Do not spend until it reaches 30.~~\n  in: `- ~~TRIGGER: 30 listings. Today 4 active + 1 draft. Do not spend until it reaches 30.~~`\n- **global r
