  var out = text.replace(/[A-Z][A-Z''’-]{1,}/g, softenWord);
  /* A sentence must still start with a capital after the softening. */
  out = out.replace(/(^|[.!?:]\s+|—\s+)([a-z])/g, function(_, a, b){ return a + b.toUpperCase(); });
  /* Line-based book: the first letter of a LINE is a sentence start, even when the
     line opens with an emoji, a dash or a bullet. Without this the rule that begins
     with a no-entry sign kept its small t. */
  /* ⛔ ONLY a line that opens with a MARKER - an emoji, a bullet, a dash, a number.
     Capitalising every line start broke her wrapped prose into "the more cautious /
     Wins" and "eight / Contradictions", which is worse than the fault it fixed. A line
     that simply continues a sentence is left alone; the pass above already handles a
     line that follows a full stop. */
  return out.replace(/(^|\n)(\s*[^\sA-Za-z0-9\n][^A-Za-z\n]*)([a-z])/g,
    function(_, a, b, c){ return a + b + c.toUpperCase(); });
}
function walkSoften(node){
  for (var i = 0; i < node.childNodes.length; i++){
    var c = node.childNodes[i];
    if (c.nodeType === 3){ var t = soften(c.nodeValue); if (t !== c.nodeValue) c.nodeValue = t; }
    else if (c.nodeType === 1 && c.tagName !== "CODE" && c.tagName !== "PRE") walkSoften(c);
  }
}
function paintEasy(d){
  var body = main.querySelector(".doc-body") || main.querySelector(".plain");
  var btn = document.getElementById("easybtn"), foot = document.getElementById("docfoot");
  if (!btn || !foot) return;
  var on = easyOn();
  if (on && body){
    /* Kept so the switch back is the real text, not a second guess at it. */
    if (!body.getAttribute("data-raw")) body.setAttribute("data-raw", body.innerHTML);
    body.innerHTML = body.getAttribute("data-raw");
    walkSoften(body);
    body.classList.add("easy");
  } else if (body && body.getAttribute("data-raw")){
    body.innerHTML = body.getAttribute("data-raw");
    body.classList.remove("easy");
  }
  btn.textContent = on ? "as written" : "easy read";
  btn.setAttribute("aria-pressed", on ? "true" : "false");
  foot.innerHTML = on
    ? "Easy read: the capitals are softened and the rules are spaced out, so this is <b>not</b> " +
      "how the file looks. Nothing in " + esc(shownPath(d.path)) + " was changed. Press " +
      "<b>as written</b> above for the real text.<br>" +
      "To change a line, say which one and what it should say instead."
    : "Verbatim from " + esc(shownPath(d.path)) + ".<br>" +
      "To change a line, say which one and what it should say instead.";
  btn.onclick = function(){
    try { localStorage.setItem(EASY_KEY, easyOn() ? "0" : "1"); } catch(e){}
    paintEasy(d);
  };
}

function renderDoc(d){
  tbTitle.textContent = d.title;
  var body = (d.kind === 'txt')
    ? '<div class="plain">' + esc(d.body) + '</div>'
    : '<div class="doc-body">' + marked.parse(d.body, { gfm: true, breaks: false }) + '</div>';
  main.innerHTML =
    '<p class="eyebrow">' + d.shelf + '</p>' +
    '<h1 class="doc">' + esc(d.title) + '</h1>' +
    (d.blurb ? '<p class="blurb">' + d.blurb + '</p>' : '') +
    '<div class="factbar">' +
      '<span class="pill">' + esc(shownLoaded(d.loaded)) + '</span>' +
      '<span><b>' + fmt(d.chars) + '</b> characters</span>' +
      '<span>last changed <b>' + d.date + '</b></span>' +
      '<span>' + esc(shownPath(d.path)) + '</span>' +
      '<button class="easybtn" id="easybtn" type="button"></button>' +
    '</div>' + body +
    '<div class="foot" id="docfoot"></div>';
  paintEasy(d);
  var tables = main.querySelectorAll('.doc-body table');
  for (var i = 0; i < tables.length; i++){
    var t = tables[i], w = document.createElement('div');
    w.className = 'tablewrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  }
}

var CURRENT = 'home';
function go(id){
  CURRENT = id;
  var links = nav.querySelectorAll('a');
  for (var i = 0; i < links.length; i++)
    links[i].classList.toggle('on', links[i].getAttribute('data-go') === id);
  if (id === 'home') renderHome();
  else {
    var d = null;
    for (var j = 0; j < DOCS.length; j++) if (DOCS[j].id === id) d = DOCS[j];
    if (d) renderDoc(d); else renderHome();
  }
  window.scrollTo(0, 0);
  if (window.innerWidth <= 860) nav.classList.remove('open');
  try { localStorage.setItem('shelf.last', id); } catch (e) {}
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-go]');
  if (t) { e.preventDefault(); go(t.getAttribute('data-go')); }
});
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-mach]');
  if (!t) return;
  try { localStorage.setItem(MACH_KEY, machine() === 'mac' ? 'win' : 'mac'); } catch (err) {}
  go(CURRENT || 'home');
});
document.getElementById('menuBtn').addEventListener('click', function(){
  nav.classList.toggle('open');
});

var start = 'home';
try {
  var s = localStorage.getItem('shelf.last');
  if (s === 'home') start = 'home';
  else if (s) for (var k = 0; k < DOCS.length; k++) if (DOCS[k].id === s) start = s;
} catch (e) {}
go(start);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>

<script>
/* Give every table cell its column name so the phone layout can print it. Re-runs on
   each render because the doc body is built on the fly. */
(function(){
  function label(root){
    (root||document).querySelectorAll('table').forEach(function(t){
      var head = t.querySelector('thead tr') || t.querySelector('tr');
      if(!head) return;
      var names = Array.prototype.map.call(head.children, function(c){ return (c.textContent||'').trim(); });
      t.querySelectorAll('tbody tr, tr').forEach(function(r){
        if(r === head) return;
        Array.prototype.forEach.call(r.children, function(c,i){
          if(!c.hasAttribute('data-label') && names[i]) c.setAttribute('data-label', names[i]);
        });
      });
    });
  }
  label(document);
  var m = document.getElementById('main');
  if(m && window.MutationObserver){ new MutationObserver(function(){ label(m); }).observe(m,{childList:true,subtree:true}); }
})();
</script>
