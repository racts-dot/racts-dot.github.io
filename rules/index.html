nt cites the OLD style-rule numbers, so a number in an old note does not mean the rule\nwith that number here; the old book keeps its numbering in `RULE_HISTORY.md`.\n\n@MANUAL.md\n\nNine purposes. If a rule does not serve one of them, it should not be a rule.\n\n| | Purpose | Binds hardest when |\n|---|---|---|\n| A | Nothing is made up | anything is stated as fact |\n| B | Money for apps, subscriptions and paid services | anything that is NOT an AI could charge her - a subscription, a scrape, a platform fee |\n| C | Using an AI at all | before any AI runs: which one, which model, what it costs, and whether a plain script should do it instead |\n| D | Fast to read, still complete | nothing missing just because it is short - if it cannot be both, say so and give her the whole thing |\n| E | The work carries over to any device, any account | anything is written or shared - the point is that work can be picked up elsewhere, not that files are tidy |\n| F | Chats do not collide | more than one chat is running |\n| G | It is actually finished | before the word \"done\" |\n| H | The product sells | ONLY when building or listing a product for sale - never for apps, rules or system work |\n| I | Control stays hers | any fork, any rule, any change |\n\n---\n\n## ⛔ THE TEN THAT MUST NEVER BREAK\n\n**Why these ten are separated: so nothing important is ever missed.** The point of this book is\nclarity, so no time is wasted. Drifting slightly off has to be caught - but only where it matters.\n**Everything below the ten can be ignored. Nothing in the ten can.**\n\n| | Rule | What it costs if broken |\n|---|---|---|\n| 1 | Never invent anything, never assume, never pick the direction yourself | you act on something untrue |\n| 2 | Ask before spending anything | your money, without your say |\n| 3 | Nothing is saved until it is in the shared store | the work is gone |\n| 4 | Never overwrite what is saved. Add to it | another chat's work is gone |\n| 5 | Before publishing, tell ev T read - no jargon, no file names, no rule numbers. If she has to read it twice, it failed.\n22b. Name it the first time it appears in this reply. Any chat, file, project, app or goal number gets 2-6 words saying what it is, in that same sentence. ✗ \"Answer Kona: 3D printer?\" ✓ \"The Kona chat - your 3D-printed car kit - is waiting to hear if you own a printer.\"\n22c. Say what a number costs her, not what it counts. ✗ \"20 of 40 entries not delivered\" ✓ \"half the handover notes never reach a new chat\". The bare count may follow in brackets; it never stands alone.\n22d. No line is only symbols. Delete the emoji: if the words left do not still say the thing, that line is not written yet.\n22e. Is / does / did / can: YES or NO as the first word, then the fact that proves it. Why: the cause, not who and not sorry. How long: a duration.\n23. 150 words or fewer. 500 only if short would make her ask again.\n23b. After nn, ? or a row of ????, the next reply answers her in its first sentence, in 120 words or fewer.\n24. Never say the same thing twice.\n25. Very, very few bold lines.\n26. Never narrate. Never repeat what she said.\n27. Say what went wrong plainly and short.\n28. Name a repeat mistake as a repeat. Nothing more.\n29. Several messages: answer the fastest first.\n30. Over five minutes: say how long, unasked, in three words.\n30b. Background work gets one line, then the question.\n30c. A long job reports once at each real milestone - a piece actually finished, never on a timer, never for something that merely started.\n31. Draw it when you explain it. Only about what she raised.\n31b. Reframe it so she sees it differently, where there genuinely is another way to see it. Never invented to fill the slot.\n32. Last line, always: `📍 task · 👉 her one thing, or nothing`, with ONE key word of the task in bold (`📍 **Bold** one word in the task`). Her words, 23 Sep 2026: \"one word in the task\", \"Everywhere.\"\n33. She only does what AI cannot. Everything else is y d, her own password or key, her own phone, her own eyes\n      on a printed page, a login only she holds, or a decision about money, anything public\n      or anything hard to undo. Everything else is ours, including the clicking and the\n      setting up. \"It is quicker if she does it\" is not a reason.\n\n  71. NEVER HAND HER AN HTML FILE, NOT EVEN A TRIAL. PUT IT WHERE SHE CAN OPEN IT, AND SEND\n      THE LINK. Her words, 17 Sep 2026: \"Put the rule even if it's going to be just a trial\n      HTML is not going to open up for me. So put everything on my whatever the thing is that\n      I can see.\" An .html sent as a file does not open on her phone. A sample, a trial, a\n      comparison, a draft - each goes to an address she can open (her apps site, or the\n      private address for private work such as the [private health] app), checked live first, and the\n      reply carries the link. Private content still goes to a private address, never a public\n      one.\n\n  78. ALWAYS ANSWER THE QUESTION SHE ASKED - FIRST, IN THE SHAPE THE QUESTION ASKS FOR.\n      Her words, 21 Sep 2026: \"add to rule always must answer the question\". She had\n      to ask \"is hand over trimmed\" outright: the replies before it led with a leak\n      report, a privacy scan and new work, and none of them said how big it was.\n      Her words, 19 Sep 2026: \"the question was why. put it in the rule book to\n      'answer the question'\". She asked why a vendor had appeared in a list and got\n      who put it there and that it was a mistake - not one word of cause.\n      MATCH THE QUESTION WORD TO THE ANSWER, AND PUT IT FIRST:\n        is / does / did / has / can -> YES or NO as the FIRST WORD, then the fact that\n                 proves it. \"Is it trimmed?\" -> \"Yes - 894,376 to 42,052 bytes.\"\n        why      -> the CAUSE. What made it happen. Not who, not sorry, not \"my mistake\".\n        how long -> a DURATION.        how far -> a POSITION, done out of total.\n        what ERY OPTION IS THE REAL TEXT SHE WOULD GET,\n      NEVER A DESCRIPTION OF IT.\n  11. NEVER SUBSTITUTE AND NEVER REMOVE WITHOUT HER. \"Go ahead\" covers what was asked, never\n      what was bundled inside it.\n  21. ASK \"THIS TIME, OR ALWAYS?\" where it changes something.\n  24. NEVER DECIDE FOR HER ON A REAL FORK, where the two paths lead somewhere different. Not\n      an excuse to hand her mechanics or storage.\n  25. YOU DO NOT DIRECT. YOU ONLY GIVE OPINIONS/ADVICE, EXCEPT FOR THE 'SO WHAT NEXT' LINE.\n     \n  44. DO NOT RE-RAISE WHAT SHE HAS ALREADY DECIDED. A SCORE BELOW THE BAR IS A JOB, NOT A\n      REPORT.\n  57. WHEN HER RULING WOULD REACH SOMETHING SHE PROBABLY WAS NOT THINKING OF, STOP AND SAY\n      SO.\n\n  72. EVERY TIME ICONS ARE OFFERED, THEY GO ON ONE PAGE LIKE \"WHERE THE PICTURES CAME FROM\",\n      WITH A BOX BESIDE EACH ONE TO TICK THE ONE SHE WANTS. Her words, 17 Sep 2026: \"every\n      time you come up with icon you will have that one HTML like that and then box to\n      indicate which one you want.\" The page is sent as a link (rule 71), and her pick is read\n      from the ticked box, never guessed from a number said out loud.\n\n3. WHEN TO ACT ON YOUR OWN  —  and how sure you must be\n   rules 13, 53b, 60, 70, 76, 80\n  13. ACT, BUT ALWAYS SAY HOW SURE YOU ARE. Nothing goes live until three things\n      hold: 95% certain it works, premium to look at, and better value than the top\n      0.01% available.\n  53b. DO NOT STOP UNTIL THE NEXT STEPS ARE EXHAUSTED. Stuck 20 minutes on one thing: park\n      it, do another step, come back.\n  60. NEVER DISCONNECT A TASK SHE IS WORKING ON.\n\n  70. FOR DIGITAL PRODUCTS, PUT IT LIVE UP-TO 30 PER DAY WHENEVER FINISHED. FOR APP, ALWAYS\n      PUBLISH LIVE WHEN ANY CHANGE OCCUR.       Digital products: once a product passes every\n      check (95% sure it works, premium, better value than the top       competitors), list it\n      on Etsy without asking, up to 30 a day. Etsy's listing fee is accepted. The price comes\n      from that product's own research.       Apps: whenever an app changes, publish it live\n      straight away without asking, before or during checking. A       private app stays behind\n      its password; publishing never makes a private app public.       This is her standing yes\n      for these two kinds of going live; rule 7 still covers every other money, public or\n      hard-to-undo decision.\n\n  76. DEPLOY MEANS GITHUB OR CLOUDFLARE, NEVER THE CLAUDE.AI WEBSITE. When she says deploy\n      or asks for something public, it goes to GitHub Pages (racts-dot.github.io) or to\n      Cloudflare Pages - an address she owns. A claude.ai artifact is never a deployment: it is\n      private to her account, cannot be made public by a session, and is not hers to keep. Use\n      an artifact only for something she looks at once, never as the place a page lives.\n\n  80. NEVER PUBLISH WITHOUT CHECKING WITH EVERY OTHER TASK FIRST - the other computer and\n      the cloud included - AND TALK TO THEM SO YOU ARE WORKING TOGETHER. Before anything goes\n      live: run python status/chat_activity.py --print, and SendMessage the chats that touch the\n      same files. A rebuild by another chat deleted her Rule Shelf's phone fix, its highlights\n      and its Hear this on 20 Sep and nobody noticed for hours; the same day a stale copy of one\n      generator, copied in without a diff, deleted the kit from Recipes. Neither would have\n      happened if the two of us had spoken first. Checking is not enough on its own: say what\n      you are about to touch, and ask what they are holding.\n\n4. FINISHING, AND BEING STUCK\n   rules 15, 19, 29, 59, 63, 79\n  15. FIX EVERY COPY, THEN LOOK AGAIN TO PROVE NO POSSIBLE IMPROVEMENT CAN BE MADE.\n  19. STOP AND SAY BLOCKED - never a quiet stop, and never a workaround left for her to\n      find. GIVE HER 3 OPTIONS IN THE BOX, WITH THE SOLUTIONS.\n  29. FINISHED MEANS FINISHED. The word is \"Finished.\" then one line NING\n   rules 16, 30, 31, 33\n      \n  16. ONE FILE, WHEN THERE IS AN ANSWER OR A REPORT WORTH KEEPING - AND SEND IT.\n  30. NEW TERMS GET FILED TO HER VOCABULARY WITHOUT ASKING - ai-learning/VOCABULARY.md,\n      plain words, with where it came up.\n  31. \"TEST ME\" GIVES FIVE QUESTIONS AT A TIME, answers hidden, a wrong answer said\n      to be wrong plainly. ai-learning/KNOWLEDGE_CHECK.md.\n  33. READING MATERIAL IS NEVER ABOUT THE JOB, AND SHE PICKS THE TOPIC EACH DAY.\n\n8. CHANGING THESE RULES\n   rules 54, 55, 56\n  54. UPDATE THE NOTICEBOARD EVERY SESSION. Any change to a rule is word by word; when the\n      wording is needed, ask for it in a question box.\n  55. NEVER CHANGE THE WORDING OF A RULE - bring her the finding and wait. Review for\n      duplication every three days, or whenever the book passes 20,000 characters, with her.\n  56. WHEN A RULE CHANGES, SHOW HER THE SENTENCE BEFORE AND THE SENTENCE AFTER.\n\n9. RETIRED — kept so nobody reinstates them by accident\n   rules 1, 14, 14b, 16b, 26, 32, 34, 35, 36, 37, 38, 39, 45, 46, 47, 48, 49, 50, 52\n\nWHAT IS DELIBERATELY NOT HERE\n  * \"DO NOT REPEAT STANDING REMINDERS.\" She removed it 8 Sep 2026: \"row 2 get rid of\n    it.\" Do not reinstate either of these without her saying so.\n  * THE STORY BEHIND EACH RULE. Kept, not deleted: ~/.claude/RULE_HISTORY.md, plus\n    the full archive named at the top of this brief.\n\nWHEN SOMETHING GOES WRONG\n  DO NOT ADD A RULE. That is precisely what produced the 92,396 characters this\n  replaced. Fix the principle above, or build a hook. A rule in text is a request;\n  a hook is a mechanism - and 14 hooks already exist, so check before writing one.\n</answer-style>\n"}, {"id": "lessons", "title": "Lessons", "shelf": "Rule books", "path": ".claude/LESSONS.md", "kind": "md", "loaded": "Every session, with the rules", "blurb": "One line per finding. A line is earned only if it stops the same mistake happening again.", "chars": 59754, "date": "24 Sep 2026", "body": "# LESSONS — reusable findings from AI reviews and from her. One line each. Read on demand: MANUAL.md loads with the rules instead (her yes, 22 Sep 2026).\n\nHer rule, 11 Sep 2026: \"constructive\" means reusable. A finding earns a line here only if it\nwill stop the same mistake next time. Add with the date and where it came from. Retire a line\nby moving it to RULE_HISTORY.md, never by deleting it.\n\n- 12 Sep · a copy of a rule kept by hand drifts in two days; one source, generated copies only. (SHARED_RULES.md)\n- 12 Sep · a gate that carries its own number contradicts its rule the day the rule changes; gates read numbers from the rule file. (140 vs 150)\n- 12 Sep · a 404 from a guessed model name is not a measurement; enumerate the catalogue, then probe. (gemini-3.1-pro-preview)\n- 12 Sep · a fix in a generator is not a fix in the file the buyer downloads; rebuild, then open the artefact. (without overwhelm)\n- 12 Sep · \"we already looked\" is a dated negative, not a fact; say where you looked, in that sentence. (the colouring books)\n- 12 Sep · a cheap model checking work reports success over work it never did; haiku does, never judges. (6 of 12 verifiers)\n- 12 Sep · a heredoc with backslashes can arrive altered; patch files by exact text, then compile and read back. (reply_length.py, 12 Sep)\n- 12 Sep · zero sales with zero traffic cannot tell a weak product from an unseen one; fix exposure before improving the thing again. (GPT and Gemini, separately, 6-11 Sep)\n- 12 Sep · \"both reviewers agree\" needs both to have received the same packet; a reviewer that got nothing is not a second opinion. (my_session, 3 Sep)\n- 12 Sep · a retraction has to reach every copy before the next packet goes out, or a reviewer argues against a claim already withdrawn. (attack_all_my_work, 3 Sep)\n- 12 Sep · read the model badge in the composer, never the cookie; the cookie records the last model used anywhere, not this chat. (whole_work, 3 Sep)\n- 12 Sep · clear the composer before pasting a packet, then read back what landed; a packet can look sent and never arrive. (homeschool round 2, 6 Sep)\n- 12 Sep · a check that nothing runs automatically is opt-in, so it is bypassed by default; wire it or do not count it. (gates_qa_prompting, 4 Sep)\n- 12 Sep · a printable that has never been printed has an unverified core function, whatever the file measures at. (two_books_r1, 7 Sep)\n- 12 Sep · a full page shrunk to a 340x270 thumbnail is an illegible smudge; crop and zoom one region instead of fanning out four pages. (listing_thumbnails, 10-11 Sep)\n- 12 Sep · a shop with no sales will never rank on broad tags; narrow beats obvious. (money_aud_listing, 11 Sep)\n- 12 Sep · never call something working until it was measured end to end; the change being made is not the change taking effect. (remote_control_everywhere, 9 Sep)\n- 12 Sep · optimising an internal metric is not the same as the buyer liking it; name the user-visible effect or drop the metric. (cosy_corners_r5, 7 Sep)\n- 12 Sep · to shrink a rule book without losing a rule, separate the instruction from the story it came from - that is the structural cut, not wording. (consolidation r2, 9 Sep)\n- 12 Sep · an installed job that fails every run looks exactly like one never installed; read the exit code, not the fact it is loaded. (sync-all, 36 runs, all exit 1)\n- 12 Sep · the error usually exists and nothing consumes it; check the thing where it is USED, not that the command ran. (review 24, both reviewers agreed)\n- 12 Sep · a background job must fail where a person will see it, or it has not failed - it has just stopped. (review 24, Gemini 3.1 Pro)\n- 12 Sep · this list stops being followed somewhere around 40-50 lines; retire a line by automating it, not by hoping. (review 24, Gemini 3.1 Pro)\n- 12 Sep · a classifier's line numbers are valid only for the exact file it read; if the file changed by even one line, re-locate every block by its first words before moving. (global book, 7 blocks three lines off, 02:00)\n- 12 Sep · a gate file not listed in settings.json runs never and looks identical to one that runs clean; check the switchboard, not the folder. (reply_length.py, 6 gates)\n- 12 Sep · a machine-local generated config drifts from its shared template in silence; after pulling a template change, regenerate and check. (settings.json, 3 hooks behind)\n- 12 Sep · a search that filters out a file type answers a narrower question than the one asked; I reported the secretary app as having one home while its 33 KB web page sat in another folder, because the search excluded .md and I read the result as \"no code elsewhere\". (secretary_app.html)\n- 12 Sep · this repo's .gitignore is `*`, so a new file is invisible to the other machine until force-added; check `git ls-tree origin/main` for it, not the disk. (install_sync_mac.sh, quoted to her for 2 days, never left the PC)\n- 12 Sep · a 4K PNG cover embeds losslessly and turns an 11-page form into a 24 MB PDF - over Etsy's 20 MB limit, so it cannot be sold; ship the cover as JPEG and check the file size, because no gate measures it. (emergency_binder, 24,089 KB)\n- 12 Sep · when Etsy's Add button silently refuses a tag however many times you fire it, dispatch Enter on the input instead; the head phrase went in first try after five failed clicks. (emergency binder tag)\n- 12 Sep · Etsy's Publish button ignores synthetic events entirely, including a full pointer sequence; it needs a real click, and the count must be re-read after a reload because the helper quoted a stale cached header. (Active 46 vs 47)\n- 13 Sep · put the guard at the stage that touches the SOURCE, not the stage you happen to be looking at; three times in one evening a check watched the wrong place - rules_health compared ~/.claude after it stopped being the rules checkout, a no-editing rule went into the restyle pass that only ever sees notes, and I read \"not in claude-config/hooks\" as \"not anywhere\". (13 Sep, US$2.60 fore printing it. (Robot Cafe round 3 said except caught \"²\"; the till had no such except)\n- 16 Sep · a build that names a system font renders in a substitute on the other machine without a word; fail the build unless the font is embedded. (SQL book on the Mac: Consolas became Courier New)\n- 16 Sep · the shell's grep here honours .gitignore and silently skips whole folders with exit 0; for a sweep use /usr/bin/grep, and treat a zero from a folder with its own .gitignore as unsearched. (page-count sweep, 3 book folders)\n- 16 Sep · a code block with the right language is not a rendered diagram; check what the reader sees, not what the API stored. (186 Notion pages showed mermaid as code until converted to pictures)\n- 17 Sep · git stash is shared by every worktree of a repo, and `git stash` with only untracked files saves nothing, so the `pop` after it applies ANOTHER chat's stash; commit untracked work instead, or check `git stash list` before popping. (kmap worktree popped a 15 Sep autostash; restored, stash kept)\n- 17 Sep · a check that the page MENTIONS a file is not a check that the file LOADS; app_kit_check scored Daily Chapter 5/5 while textsize.js and feedback.js both served 404, so fetch the page the browser gets and request every asset it asks for. (23 apps' nightly pass was not evidence; sweeping 15 pages found one more, /videos/favicon.png)\n- 17 Sep · a fix verified on the machine the bug does not affect is unverified; rmtree(ignore_errors=True) passed its selftest on the Mac and deleted nothing on Windows, where git marks .git/objects read-only. Read the fixture count before and after, on the machine that showed the fault. (unshared_gate; two fixes wrong in opposite directions, same day)\n- 17 Sep · an always-red check carries no signal; the sync exited 1 every run for four days on three test fixtures, so a real fault would have looked identical and nobody was reading it. A check that cannot go green is a check nobody reads. (sync-all-repos, 13-17 Sep)\n- 17 Sep · a walk that prunes at its limit and `continue`s never examines the folder AT the limit; MAX_DEPTH 5 reached four. Probe the boundary with a fixture at N and N+1 before quoting a depth. (sync_all.py find_repos; four leaked repos invisible)\n- 17 Sep · a rule that fires once is kept; a rule that must fire again at every pivot is dropped unless a hook fires it. 31 hooks wired, none touched the chat title, and every rule that held that day was a hooked one. (one chat, one name, five tasks)\n- 17 Sep · Git Bash rewrites `origin/main:path` to `origin\\main;path`, the command errors, and `grep -c` prints 0 - a zero from a command that never ran looks exactly like a clean result. Set MSYS_NO_PATHCONV=1 or pass `--`. (rule 74 read as missing from the pushed file; it was there)\n- 17 Sep · a finding on one machine is not evidence about the other, and a register entry without its machine misleads both; ~/website \"stale on Windows\" was a Mac entry. Tag the machine, or re-derive on the machine you are on. (HANDOVER 1234, corrected by the Mac)\n- 18 Sep - a git index.lock is judged by PROCESS START TIMES, not by whether git is running; a 393-minute-old lock sat behind nine live git processes that had all started after it, so two chats read \"processes are live\" as \"the lock is working\" and left every sync failing for six hours. Compare the lock mtime to the oldest live git process. (home repo, 3 commits stuck since 22:21)\n- 18 Sep - `git checkout -- <file>` restores from the INDEX, so it does not clear a STAGED change; four merges in a row died on \"local changes would be overwritten\" by a file that `git diff` called clean. Read `git status --porcelain`: `M ` (staged) needs `git restore --staged --worktree`, ` M` does not. (HANDOVER.md, home repo)\n- 18 Sep - a non-zero exit code is not proof of no data; PowerShell's Get-Process exits 1 when any NAMED process is absent while still printing every match on stdout, so gating on returncode threw the answer away and made a new gate permanently UNDECIDED. Judge by what came back, not by the exit code. (repo_state_gate lock verdict)\n- 18 Sep - `git worktree add` on a big repo can outrun a 120-second timeout and leave a HALF-CHECKED-OUT tree that git reports as staged deletions of everything missing; do not build on it, remove it with `-f -f` and prune. (wtpush, 113 MB of a partial checkout)\n- 18 Sep - one variable pointing at the wrong folder makes six hooks no-ops that still exit 0; CLAUDE_RULES_REPO named ~/.claude after the rules moved to ~/claude-config, so her rule history split into two copies of 85 and 78 sittings and the roster hook cried \"rule 67 deleted\" for four days. When a mechanism reports a loss, check WHICH COPY it read before believing the loss. (RULE_HISTORY.md)\n- 18 Sep - Etsy's video uploader ignores a file placed into its input programmatically: six attempts across two encodings all returned \"Hm, we're having trouble uploading that file\" and the \"2 remaining\" counter never moved, while the SAME file dragged in by hand was accepted at once. The file was never the fault. This is the same shape as its Publish button ignoring synthetic clicks (12 Sep) - for Etsy media, build the file and hand her the drag; do not re-encode chasing a phantom format problem. (3 listing videos, 4576438771)\n- 18 Sep - open(path,'w') TRUNCATES BEFORE IT WRITES, so an edit that crashes mid-write leaves an EMPTY file, and a commit straight after pushes that emptiness with a message describing content that is not there; I deleted all 4,297 lines of HANDOVER.md from origin this way. Write to a temp path and os.replace it, and read the file back before committing. (c3a36a5c, register gone ~4 minutes)\n- 18 Sep - a background-removal tool that reports 'artwork pixels changed: 0' is measuring its own tolerance, not the picture; it said 0 on three icons it had visibly eaten because the tile and the field were near the same colour. The check is looking at the result on a contra ith \"No such file or directory: gh\" and the wrapper still logged \"IS current\". Take the exit code from the command, trim the output afterwards - and remember launchd hands a job a minimal PATH, so a timed run dies where every run from a terminal passes. (both Pages publishers, found by reading the log after the first timed run; control-tested with the checker missing, the checker crashing, and `env -i PATH=/usr/bin:/bin`)\n- 19 Sep · an error that means WRONG ARGUMENT reads exactly like one that means CAPABILITY ABSENT; `set_session_title` answered \"Session ... not found\" to this chat's own uuid for three hours and I reported the rename as impossible, told a peer, and had the peer agree - it wanted the literal string `self`, and renamed first try. Read the tool's own schema for a sentinel argument before declaring a tool broken, and a peer agreeing with you is not a second measurement when you gave it the conclusion. (session 024bf722, 3 flags to her)\n- 19 Sep · `.git/REBASE_HEAD` OUTLIVES the rebase, so treating it as \"a rebase is in progress\" switches a hook off for days: measured on Windows in a throwaway repo — clean rebase leaves it ABSENT, `rebase --abort` leaves it ABSENT, but conflict-then-`--continue` leaves it PRESENT while `git status` reports a clean `## side`. ~/.git/REBASE_HEAD was dated 17 Sep 00:30 and was still parking every save-as-you-go sweep of her home repo on 19 Sep. The only true marker of a rebase in progress is the `rebase-merge/` or `rebase-apply/` DIRECTORY. (save_as_you_go.py PARKED list; the control test is the point — I had assumed the cause and the first two cases disproved it)\n- 19 Sep - a blocklist of silly voice names is always missing the next one: Albert was not on speak.js's novelty list, so on a device with no en-AU voice it scored 23, TIED with Bahh and Fred, and alphabetical order handed her Bible to a joke voice. Score an unrecognised name BELOW every voice known to be real, and clear the one already SAVED on the d ep (git 91e5784, 5,473 bytes) while claude-config held the 14 Sep one (8fd8d44, 6,399 bytes) that added dead_paths() - so the DEAD-PATH check, written for exactly the notion_brief.py fault where a moved folder leaves a hook wired to nothing, had never run on this machine while the session banner said \"Nothing silent\" every turn. Compare `git hash-object <installed>` against the repo copy, not the reassuring message. Control-tested after installing: a planted bogus path IS caught, so the empty result is a real zero. (Windows, found because a Mac chat quoted its own copy's size)\n- 20 Sep · a merge that RESOLVES a register conflict by taking one side deletes the other chat's entry while every check says the merge succeeded, and the commit still contains it so nothing looks lost: commit 3885a433 is an ancestor of origin/main, yet the 4,217-character hook-drift entry it added was absent from HANDOVER.md on both origin and disk after 88cb05f3 (session 6055fc9e, pf) resolved the same file. Content survival and commit ancestry are DIFFERENT QUESTIONS - `git merge-base --is-ancestor` said yes while a grep for the text said no. On a shared append-only register, resolve every conflict by keeping BOTH sides, then grep origin's copy for a distinctive phrase from each. Recovered with `git show <sha>:HANDOVER.md`. Same family as 14 Sep (\"pushing a whole shared file from a stale checkout silently deletes whatever others added\"), but through a conflict resolution rather than a stale copy. (Windows)\n- 20 Sep · `git checkout --theirs` in a shared-file conflict takes origin AS OF YOUR FETCH, not as of now, so any entry another chat pushed in between is silently dropped by your merge commit - and a merge commit is authoritative, so it looks deliberate. I resolved a HANDOVER.md conflict this way and deleted another session's just-pushed hook-drift entry; that chat found it and restored 19 lines. ⛔ The worse half is the check I used to prove I had dropped nothing: I counted `^## ` headings, 177 before and 178 after, and called it safe. A COUNT CANNOT SEE A DROP WHILE YOU ARE ADDING - 177 kept + 1 added and 176 kept + 2 added both read 178. Re-fetch immediately before resolving, and verify by grepping origin's copy for the OTHER side's newest text by name, never by counting anything. (same family as 14 Sep's 'apply your edit to origin's copy' - I followed that rule and still lost the entry, because the rule says WHICH copy and not HOW FRESH)\n- 20 Sep - a merge can DROP newly ADDED paths, and then `git log --diff-filter=D` finds nothing, so the usual hunt for a deletion says the file was never there; a 74 KB build.py and five PDFs vanished from origin/main while their commit stayed an ancestor of it. The test is not \"who deleted it\" but `git rev-parse origin/main:<path>` per path, run after the merge that consumed your commit. (homeschool_records_kit, restored from the original blobs rather than rebuilt so the artefact still matched the two reviews already run against it)\n- 20 Sep · a WRONG claim inside the register's delivered slice beats a RIGHT one outside it: three copies of \"Windows Chrome is on the wrong profile\" were inside the 40,000-byte cut that reaches every session, while the 17 Sep line naming the true cause (\"the Claude extension is not connected\") was outside it — so six days and three chats kept rediscovering the false theory and none was ever handed the answer. Rachel settled it in five words: \"it was in the right profile all along.\" Before writing a cause into a rule book, run the hook's own cap function and check whether the EVIDENCE is delivered too, not just the conclusion. Also: the profile timestamps that produced the theory are written when Chrome SHUTS DOWN, so a fresh one proves nothing about what is in use. (HANDOVER.md, enforce_cap 40,061 bytes)\n- 20 Sep · a thumbnail judged at a size you REMEMBER instead of the size the platform SERVES gives a confident, inverted answer: this book's own \"340x270\" is what n EMPTY rect as intersecting nothing, and a hairline rule is stored with zero height, so every horizontal rule reads as \"outside the crop\" - a listing-image cut detector could not see a single ruled line, and margins taken from get_drawings() came back 50 mm wrong (65.5 mm against the pixels' 15.7 mm). Inflate a degenerate side before asking intersects(), and measure edge ink on the RASTERISED page, not on the drawing objects. Found by a POSITIVE control, not a negative one - the fix for the first bug started refusing a crop that was correct. (trip_planner/listing_images.py)\n- 21 Sep · a cut detector answers \"is anything severed\", which is not \"is anything missing\": a crop 7.0in tall on a 10.55in page severs nothing, because every rule below it is WHOLLY outside the clip and so never intersects it - it reported \"0 cut\" while dropping a third of the page. To a buyer a cut column and a silently omitted one look identical; both make the product look smaller than it is. Measure completeness separately, and never infer it from the absence of cuts. (found by running the negative test, not by reasoning)\n- 21 Sep · I wrote a SECOND builder for a public page instead of finding the first, and it published an email address, a GCP project id, a Notion page id and the Windows username for ~20 minutes: rules/index.html said in its own comment that it was BUILT from a template, and status/rule_shelf/refresh.py runs prepublish_scan.py, which strips exactly those. Mine read the books straight from disk. Search for what already makes the artefact before writing a new one, and nothing writes to a public page without the scan the real pipeline runs. Still in the public repo's git history; the served page is clean (7145566). (build_rule_shelf.py, retired, refuses to run)\n- 21 Sep · Etsy's file sizes are MB of 10^6, TRUNCATED to two places; I compared them against MiB off disk and told her a live listing carried the old PDFs when all five matched byte-for-byte. Old and new bui he expected total caught it; send plumbing input as BYTES with -z. (2) when `C=$(git commit-tree ...)` fails (here: no user.name in a fresh clone) C is empty and `git push origin \"$C\":refs/heads/main` becomes a DELETE of main - GitHub refused only because main is the default branch. Check `[ ${#C} -eq 40 ]` before any push of a computed sha. (racts-dot/yt-transcripts, 6987627 then 9e270ee)\n- 22 Sep · `git ls-tree -r` WITHOUT -z QUOTES every path with a non-ASCII byte (\"\\353\\260...\"), so a name-matcher reading it silently fails on all of them and reports \"not found\": I told her 223 transcripts existed only on this PC and pushed them; 3,351 origin names had been quoted, and 192 of the 221 were already there under the Mac's [videoId] names. My control passed because it used the same broken list. Read paths with -z (or core.quotepath=false), and pick a control from the population that FAILED to match, not the one that did. (yt-transcripts 0cf9825, caught by another Windows chat)\n- 23 Sep · a register entry written but not committed IN THE SAME STEP is gone within minutes: six chats share ~/HANDOVER.md, another chat rewrote the file four minutes after my Edit landed, and a grep for my heading returned 0 on disk AND on origin - no conflict, no error, nothing to notice. Write the entry and `git add && git commit` in one command, then grep origin's copy for your own heading. Same family as the 19 Sep LESSONS line, one level up: there a staged edit did not survive, here an UNSTAGED one did not. (session 995cbace, WINDOWS RULES WIRED, re-added and landed second try)\n\n- **[2026-09-23, Mac] `os.replace()` onto a symlink path DESTROYS the symlink.** `~/HANDOVER.md` is a symlink to `~/home-notes/HANDOVER.md`; a write-to-temp-then-replace (the pattern this manual recommends for atomic writes, pattern 3) left a regular file behind, so for ~5 minutes every Mac session read a register that was in no repo and `git status` in home-notes said clean. **Write through the link (`open(os.path.realpath(p),\"w\")` or `os.replace(tmp, os.path.realpath(p))`), and `ls -la` the path afterwards.** A clean `git status` is not evidence the file you edited is the file git tracks.\n\n- **[2026-09-23, Mac] Claude Code cuts any hook message over ~10,000 characters to a 2,000-character preview.** The register was cut in every session from 8 Sep to 23 Sep (926 times) and the answer-style rules 2,797 times, while every hook reported a full delivery. Keep each hook message under 9,000 (`hooks/hook_limit.py`), split bigger ones into wired parts, and trust the cut files, not the hook.\n\n- **[2026-09-24, Windows] An entry that carries NO VERDICT must never overwrite one that does.** `release_gate.py` kept the newest `release_check` entry per product, then skipped entries with an empty `gates` list — so an **audit-only** run, which expresses no opinion, erased a real CLEAN pass and the product fell out of BOTH the ready and stale lists silently. 55 of 58 products were in that state; the gate would have blocked every listing action while reporting \"no product is CLEAN\", which was false and pointed the reader at re-running the cause. Before 0 clean / 0 stale, after 20 / 26, against 477 real evidence files. **When you fold many records into \"the newest wins\", decide first what counts as a record — silence is not an answer.**\n- **[2026-09-24, Windows] I reported three faults in a working gate and two did not exist, because my check looked in the wrong file.** `grep -c selftest release_gate.py` returned 0, so I wrote \"never tested\"; this repo keeps selftests in a SEPARATE `selftest_<name>.py`, and it had 11 passing controls. I also called it Windows-only without looking in `claude-config/hooks/`, where an identical blob already sat on origin. Both claims reached the register, a handover file, Notion and another machine before anyone checked them. **Before reporting a thing ABSENT, name where you looked and search the place the convention puts it — and before \"fixing\" another author's code, read its tests: the third \"fault\" was a control they wrote on purpose.**\n"}, {"id": "printables", "title": "The printables book", "shelf": "Rule books", "path": "claude desktoi/CLAUDE.md", "kind": "md", "loaded": "Loads in claude desktoi", "blurb": "That folder's own book: what to read first, and the commands that run it.", "chars": 5351, "date": "24 Sep 2026", "body": "# `claude desktoi` — the printable products business\n\n## Moved out on 11 Sep 2026\n\nFive blocks (six rows of the audit) — one copy of a global rule, a dated fix log, a withdrawn stop, old verdicts, and the appendix holding two copies of\nthe claude.ai profile text — now live in `CLAUDE_HISTORY.md` in this folder, word for word. Nothing loads\nthat file. The list is at the top of it.\n\n\n**How to answer and how to behave live in the global file**\n(`C:\\Users\\[user]\\.claude\\CLAUDE.md`) and are loaded automatically in every folder.\nThis file is the *project* detail: what is true about these products, and what\nhas already been paid for in wasted time.\n\n---\n\n## ⭐ Rachel's standing instructions — CANONICAL COPY IS ELSEWHERE\n\n**Do not restate them here.** They live in exactly two places, both of which load\nautomatically, and this is neither:\n\n1. `~/.claude/hooks/answer_style.py` rule 11 — injected EVERY TURN, so it survives\n   context decay. This is the operative copy.\n2. `~/.claude/CLAUDE.md` — the fuller version with the measurement that produced it.\n\n\n## Read before any product work\n\n- ⛔ **BEFORE ANYTHING IS UPLOADED OR LISTED, RUN THIS. One command.**\n\n  ```\n  python release_check.py <product>\n  ```\n\n  Built 2 Sep 2026 after ChatGPT Pro and Google Gemini Pro, blind to each other,\n  both judged the quality system not good enough. ✅ **SETTLED BY RACHEL 2 Sep 2026\n  `[HUMAN]`: \"stick with gpt over gemini\".** It IS the one authority above the ~48\n  scattered QA scripts. ChatGPT said put one authority above the scripts; **Gemini said\n  throw most of them away**; she chose ChatGPT's. **Do not delete QA scripts citing\n  Gemini** — that option was put to her and declined.\n    `python -c \"import json,io;d=json.load(io.open('release_registry.json',encoding='utf-8'));r=[g for p in d['products'].values() for g in p['gates'] if g.get('level')=='required'];print(sum(1 for g in r if g.get('negative_tested')),'of',len(r))\"`\n\n\n- **`QUALITY_STANDARD.md` — binding on EVERY product, existing and new.**\n- ✅ **`colouring_qa/paper_sim.py` — the print test, without a printer. Added 9 Sep 2026.**\n  ✅ Proved able to fail: `python colouring_qa/selftest_paper_sim.py --prove-it-fails` —\n\n- **`RESEARCH_INDEX.md` — start here for market questions.** Every study, every\n  verdict, and the places the research contradicts itself. Read it before\n  proposing any product, price, theme, or listing.\n- ⛔ **THE REVIEW FRAMING: USE `review_board/REVIEW_PROMPT_STANDARD.md` VERBATIM. NEVER\n  WRITE YOUR OWN, AND NEVER SAY \"ATTACK IT\".**\n  `[HUMAN 2026-09-03]` Rachel withdrew that framing in her own words: *\"It is like\n  constructive feedback, not like to attack. I ask for weaknesses and advices.\"* Both\n  models, consulted blind, agreed: **\"attack\" manufactures defects** — the reviewer's task\n  becomes producing objections, so weak concerns get promoted to material ones, and\n  *\"no material weakness found\"* starts to feel like failing the instruction.\n\n- **`review_board/` — get the plan independently reviewed before building it.** Any AI proposing a\n  non-trivial plan should run it through the gate rather than self-approving:\n  `python review_board/review_board.py review --file <plan.md> --evidence <evidence.json> --project <name>`.\n  - **Always `--dry-run` first** and quote the estimate. Spending is capped\n    per provider in `review_board/budget.json`, which is also the kill switch\n    (`review_board.py revoke`). Authorise with `review_board.py grant <provider> <usd>`.\n\n## Facts that are settled — direction only. RE-DERIVING IS ENCOURAGED.\n\n📏 **READ THIS BEFORE QUOTING ANY NUMBER BELOW.**\n\n- ✅ **SHOP LOCATION STAYS \"UNITED STATES\". `[HUMAN 2026-09-08]` her words: *\"leave the\n  location in us\"*.** An outside listing review recommended changing the public shop\n  location to Adelaide, Australia on the grounds that the branding is AU. **She declined\n  it. Do not re-raise it, and do not \"correct\" the location to AU as doc rot.** The Etsy\n  Payments bank country is a separate setting and was never in scope.\n\n\n\n## Product rules moved here from the global book - 24 Sep 2026\n\n`[HUMAN 2026-09-24]` Her \"Apply all\" to the rule-book cut (claude-config 7071bd7): these 13 rules left the global book and live in the product books, word for word, numbers kept. Source: `claude-config/proposals/BOOK_CUT_2026-09-24/changes.json`, the \"move\" row. The Mac copy is in `~/pf/CLAUDE.md`.\n\n64. Every product is premium and beats the top 0.01% on value.\n65. \"It works\" is not the bar. \"Not premium\" is not an answer.\n66. Research before making: named buyer, dated demand figure, real competitors with prices.\n67. List what the top three give. Give more.\n68. Five times the value, counted. Cannot reach it: ship and report the real multiple.\n69. Look at every rendered page. Vision model and human eye.\n70. Only build where shops are selling and something is missing.\n71. Every listing gets a video with music. Vertex music only.\n73. One product at a time. Finish it or kill it.\n74. Never hand-draw images.\n75. No \"was\" price, no discount, until it genuinely sold higher.\n76. Nothing goes live under 95% sure, not premium, or beaten on value.\n78b. Build from shared, tested parts - with exceptions allowed for teaching, accessibility or real visual difference, and some hand-made pages in every product so a shelf of them does not read as machine-made.\n"}, {"id": "factory", "title": "The factory book", "shelf": "Rule books", "path": "costway-scraper/CLAUDE.md", "kind": "md", "loaded": "Loads in costway-scraper", "blurb": "The printables factory — the planner and diary line. The biggest book on the shelf, by a long way.", "chars": 46323, "date": "12 Sep 2026", "body": "# The printables factory\n\n## Moved out on 11 Sep 2026\n\nTwenty-five sections that restated the global rule book, or were status and history, now live in\n`CLAUDE_HISTORY.md` in this folder, word for word. Nothing loads that file. This book holds only what is\nspecific to this folder. The list of the 25 is at the top of that file.\n\n\nThe folder is named `costway scraper`. That is a leftover — nothing here scrapes.\nThese are printable PDF products sold on Etsy. A defect is not a failing test;\nit is a one-star review or a refund. Every rule below exists because the\nmatching mistake actually shipped.\n\n### How to write an image-generation prompt\n\n\n- **The prompt biases the distribution; the QA gate measures compliance. Never\n  make the prompt pretend to be the gate.** Numbers in a prompt do not work —\n  proven twice on this machine.\n- **Describe appearances, never measurements.** \"Large open colouring spaces\",\n  not \"regions over 2.5mm\".\n- **No banned-lists.** They are a graveyard of past failures that names the\n  very things you do not want. One short exclusion sentence at the end, no more.\n- **Some nouns are structurally hostile** — woven basket, brick, plank floor,\n  patterned rug. Do not ask for them.\n- ⭐ **Exaggerated scale is the one lever that raises the pass rate AND the\n  appeal.** Add scale contrast, not detail.\n- **Text prompting cannot hold a character's identity across generations**\n  (>95% confidence). That needs reference conditioning, not better wording.\n- Order is always: draft → GPT reviews (free, browser) → then generate.\n\n#### Already settled — do not re-propose these\n\n\n**Two results closed so nobody re-proposes them**\n\n- ⛔ **Hollow outlined pupils: rejected.** They do cut solid-black failures, but\n  every animal reads as blind or vacant. The gate cannot see this; a person can.\n  The pupil fix is smaller eyes, not unfilled ones.\n- ⛔ **4K does not fix thin-stroke failures.** A native 3392x5056 render failed\n  at the identical measurement. Thin strokes track fine-textured subjects -\n  spines, petals, rain, fur - not resolution. Do not pay for 4K to solve it.\n\n**Nothing under roughly 20 generations per arm is evidence.** Image generation\n\n**The instruction can BE the defect. Read the existing wording before adding\nanother constraint.** Pages kept failing with eyes too large and solid black.\n\n**Correcting a measurement is allowed. Loosening a gate is not.**\n\n- ❌ **Loosening** - the number moves so the current failures pass. Forbidden.\n  That is a gate that moved to fit the result.\n- ✅ **Correcting** - the number stays, but the measurement stops standing in\n  for the wrong thing. A thin-line gate reported an identical 0.145 for four\n  failing pages that actually carried 39.7, 44.6, 130.5 and 663.6 mm of\n  hairline: one number hiding a 17x spread. The fix added how much line is\n  actually too thin, reported only, and moved no threshold.\n- Adding a metric: report-only first; never calibrate a new gate on the pages\n  currently failing; prove the known-good set is unchanged; record old value,\n  new value, date and reason for any threshold that ever moves.\n\n**Bold and easy beats intricate - market data, not taste.** Bold-and-easy:\nn=32, median 115 reviews, 34.4% bestsellers. Intricate: n=9, median 21 reviews,\n**0% bestsellers**. The answer is never \"add more detail\". Aim for a ~60% keep\nrate, not 90%: going 47% to 60% saves only ~0.9 credits per accepted page, so do\nnot make pass-rate optimisation the main project.\n\n### ⛔ Before anything is built: the research gates\n\n\n**The governing rule.** Research is satisfactory when it is strong enough to\nmake the next reversible decision and further broad research is unlikely to\nchange it. NOT because a large number of pages were scraped.\n\nEvery load-bearing conclusion states: source and date · sample and method ·\nwhat the evidence supports · **what it does not prove** · material bias,\nmissingness or confounders · FACT / INFERENCE / HYPOTHESIS.\n\n**Level 0 - insufficient. Any one of these is NEEDS EVIDENCE / NO-GO:**\n\n\n**Level 1 - permits TEST only.** 20 directly relevant live offers across at\nleast 3 search intents and 5 sellers, capturing price, format, scope,\npositioning, visible proof and buyer promise. 30 buyer-language items from\nreviews/questions/complaints across at least 8 sources. WHO, trigger, job,\npain, current alternative and cheapest test all filled. Source manifest kept.\n\n**Level 2 - permits BUILD SAMPLE / GO.** 30+ offers across at least 10 sellers,\nincluding winners AND middle-of-market AND low-review new entrants, not winners\nalone. 50+ qualitative excerpts across at least 10 sources, including at least\n15 critical/problem statements where available. Saturation: the last 15\nrelevant excerpts add no new pain, choice or failure theme. Quant and qual\nconverge on the same WHO/JOB/GAP, or the contradiction is explicitly recorded.\nEvery important claim carries two independent evidence types or one stronger\ndirect-behaviour source. 5-10 closest alternatives benchmarked for why buyers\nchoose them and where they fail. One falsification test specific enough to run.\n\n**Level 3 - behaviour-validated.** A direct signal from our own offer or a\ngenuinely comparable funnel. Poor test design or tiny exposure is still\nlabelled honestly.\n\n**Stop rule. Stop broad research when ALL are true:**\n\n1. WHO, trigger, job, pain, current alternative, choice criteria, winner\n   pattern and gap are concrete.\n2. The last 15 qualitative items add no material theme.\n3. The next 20 similar listings would be unlikely to change GO/TEST/NO-GO.\n4. Remaining uncertainty is one testable question with a cheapest test.\n5. An independent reviewer has attacked the conclusion and material objections\n   are answered or recorded as unresolved.\n\nOtherwise do targeted research on the unresolved question. Do not restart the\nwhole market scan.\n\n\n**THE SCORE NEVER OVERRIDES A HARD GATE.**\n\n**Hard gates before BUILD SAMPLE / GO - all must be true:**\n\n- WHO/buyer, trigger/job and current alternative are concrete\n- \"Why choose this\" is one defensible sentence\n- evidence link and cheapest falsification test exist\n- Research sufficient is checked\n- **Evidence quality >= 4 · Gap strength >= 4 · Buyer choice >= 4**\n- Material contradiction is NOT checked\n- factual listing claims are traceable to evidence\n\n**Bands.** 80-100 and all gates: BUILD SAMPLE / GO. 65-79, or one material\nassumption unproven: TEST. Under 65, vague buyer, cosmetic gap or no switching\nreason: NO-GO / REWORK.\n\n**The buyer-choice sentence, this exact shape:** For [specific buyer] in\n[trigger/situation], choose [our product] over [closest alternative] because\n[observable difference] produces [desired result], supported by\n[evidence/test].\n\nReject any sentence resting only on: premium · unique · beautiful · high\nquality · AI-powered · more pages · printable. **Difference is not decoration**\n- a colour swap, a new cover, more generic AI images or extra filler pages is\nnot a defensible gap.\n\n**A GO authorises 3-5 representative samples, not production.** The sample must\nstill pass the mechanical, use, visual, claim and market QA.\n\n<<<<<<< HEAD\n**NOTHING ENFORCES ANY OF THIS.** Notion computes the weighted score; no code\nchecks that Evidence quality is 4 before a build starts, and nothing forces\nNO-GO when a gate is false. That is the same structure as the QA verdicts\nelsewhere in this file - weights nothing multiplies, gates nothing forces -\nexcept this one decides what gets built at all. A passing score with a failing\ngate is a NO-GO regardless of the number.\n\n### Running work across sessions\n\nFrom the Notion page \"Claude Multi-Agent Work Packets\", 5 Sep 2026.\n\n- Notion is the control plane and audit record; Claude Code is the runtime.\n  **Formatting Notion correctly does not itself start multiple agents.**\n- Agent Teams are experimental, disabled by default, and consume materially\n  more tokens. Use the smallest adequate shape: single session, then subagents,\n  then a team - and only when lanes are genuinely independent.\n- **Never pre-create or hand-edit `~/.claude/teams` or `~/.claude/tasks`.**\n- **One writer per file or file family.** Research and red-team lanes are\n  read-only by default. The builder does not approve its own output. Only the\n  merge owner integrates.\n- **No session changes shared QA thresholds, pricing, publish state,\n  credentials, spending controls or destructive state without the recorded\n  approval gate.** Mechanical QA cannot change thresholds to make pages pass.\n- **Every claimed completion points to inspectable evidence. Chat prose alone\n  is not evidence.**\n- If the team feature is unavailable, fall back to a stamped mode and say so -\n  **do not claim an Agent Team ran.** Where two lanes conflict, record both\n  positions and the evidence needed; never average them into vague consensus.\n- The page's own verdict, which stands until a bounded pilot passes: this is\n  \"a multi-agent-ready specification, not a proven autonomous multi-agent\n  system\".\n\n### Priorities\n\n- **Quality first, then cost.** Not the reverse. Then value.\n- **Sellability is the tie-breaker.** When quality and shipping compete, ask\n  which one a buyer would notice.\n- Market research before action. Recommend the right AI for each job.\n- Automate everything; aim for automated QA on every project.\n- Customer acquisition from day 1.\n- Simplicity and quality beat adding more AI integrations.\n\n### About Rachel\n\n- Full-time worker, limited time, building with AI as fast as possible.\n- Focus is **marketing + analytics**; the goal is the top 0.01% tier.\n- Can read at work only if it was printed beforehand, which is awkward. Can\n  listen to audio and podcasts. Wants reading material ready before work.\n- Wants things built in the background, so the work happens as if she were not\n  working. Needs understanding and clarity.\n\n### The handover register — Windows only, absent here\n\n⛔ **CORRECTED 6 Sep 2026 — this said \"On the Mac\". It is the WINDOWS PC.**\nMeasured that day from `DESKTOP-OLHD3OS`: the register is\n`C:\\Users\\[user]\\HANDOVER.md` (41,986 bytes), loaded at SessionStart by\n`~/.claude/hooks/handover.py` (28,434), alongside `HANDOVER_WHY.md` (4,258) and\n`SESSION_JOURNAL.md` (993,417). It is versioned in the private repo\n`racts-dot/home-notes`. **On the Windows PC**, live round-to-round state lives\nin `HANDOVER.md` and is loaded at SessionStart by `~/.claude/hooks/handover.py`. It opens with an **IN FLIGHT**\ntable — anything running in another session, a ChatGPT tab, a Higgsfield batch\n— and reading it first is what stops duplicated work. Lines are tagged\n`[VERIFIED]` (someone opened the file), `[REPORTED]` (second-hand, re-check) or\n`[HUMAN]` (Rachel said so). **ChatGPT cannot read it; Claude is the courier, and\nan unrecorded ChatGPT round is an invisible round.**\n\n🚨 **CORRECTED 2026-09-08 BY MEASUREMENT — the 6 Sep text below was true then and is\nFALSE now, and it told sessions to refuse an instruction they can actually follow.**\nIt read: *\"None of that exists on this Mac... no `~/.claude/hooks/handover.py`, no\n`SESSION_JOURNAL.md`, no `~/HANDOVER.md`, no `HANDOVER_WHY.md`.\"*\n**All four exist today.** `~/HANDOVER.md` (11.6 KB, injected at every SessionStart),\n`~/.claude/hooks/handover.py` (symlink → `~/claude-config/hooks/`),\n`~/.claude/SESSION_JOURNAL.md` (~108 KB, written today), and\n`~/home-notes/HANDOVER_WHY.md`. `racts-dot/home-notes` was cloned to `~/home-notes`\nand is mirrored hourly by launchd job `local.claude-backup-files`.\n✅ **So DO read the register.** The global proven now is what happens AFTER a buyer sees the listing — the thumbnail and the first two lines of the title. ~~7 Sep 2026: six products built and five live on Etsy, zero sales ever and zero visits from Etsy search, the shop's own search-visibility flags now cleared and due to be re-read about the 12th.~~ Struck, not deleted — it was true when written. Because both machines sync themselves through GitHub and three sessions share this folder, check this is still true with `python3 .claude/hooks/git_sync.py status` and a look at the shop before you rely on any of it.**\n\nAdded 4 Sep 2026 so no one has to know the right words to ask. If a session is\nabout products, listings, pricing or \"what should I do next\", open these before\nanswering anything.\n\n| File | What it settles |\n|---|---|\n| `UPLOAD_LOG.md` | **What was uploaded to Etsy, when, and from which build.** Read it before replacing any live file — on 5 Sep a fix that HAD been uploaded was reported as never uploaded, because nobody wrote it down. Add the row before you close the tab. |\n| `LIVE_LISTINGS.md` | **What is actually published.** 🚨 **RE-READ OFF ETSY 12 Sep 2026: 46 LIVE LISTINGS, 0 sales.** Two shop pages, 36 + 10. ~~Read off Etsy 4 Sep: FIVE live listings, 0 sales, 0 reviews.~~ Struck, not deleted — it was true then. Nothing syncs from Etsy, so this file drifts — it said two for nine days. Re-read the shop before trusting it. |\n| `factory/consolidation/PROGRESS.md` | The running log. Every defect found and fixed, dated, with why. Start here to resume cold. |\n| `PUZZLE_BOOK_DECISION.md` | Why the puzzle book cannot win as built, and the three angles that do work. |\n| `factory/research/etsy_*.json` | Live market captures, dated. Perimenopause, diary, puzzle, large-print seniors. Item 4 of the QA score is 0 without one of these. |\n| `factory/consolidation/reviews/` | ChatGPT vision-review rounds, with the pages that were shown. |\n| `upload_packs/listing_NN/` | Copy-paste-ready packs. `.REFUSED` means a human has not approved the pages — that gate cannot be cleared by an AI. |\n\n**The three things left undone, as of 4 Sep 2026:**\n\n1. **The caregiver binder's live file is out of date.** Fixed PDFs sit in\n   `upload_packs/listing_12/files/`. The live listing still serves the version\n   whose respite page says \"ring me\" with no name and no number.\n2. **Listing `4565000185` (ADHD Bundle, AU$8.95) is live with unknown files.**\n   Its attached zips exist nowhere in this repo. Nobody can say what a buyer\n   downloads. This is the only real risk in the shop.\n3. The Evidence File and Appointment Kit have had no vision-review round.\n\n**And the fact that outranks all of it:** five live products, zero sales ever,\nand Etsy search has sent this shop zero visits. **Do not answer \"what next?\"\nwith another product.** The free, never-taken step is Shop Manager → Etsy\nsearch visibility, ten minutes, which says whether the shop is findable at all.\n\n## Which model runs which job\n\nHer rule, 5 Sep 2026: **cheap models do the clerical work, and the saving only\ncounts if the quality is the same.** The condition comes first and overrides\neverything below. This lives in a rules file rather than in code because model\nchoice is made by whoever writes the agent call, and nothing checks it.\n\nTwo sections used to say this, a hundred lines apart, and they had drifted into\ncontradicting each other — one opened \"the default is the strong model\", the\nother opened \"cheap models do the clerical work\". Merged here on her\ninstruction, 5 Sep 2026. Her own record says why: *every fix that regressed had\nthe same fact written in two or more places.*\n\n### The gate: one comparison, and it never closes\n\n**Her decision, 5 Sep 2026 `[HUMAN]`, chosen from three options.** The previous\nwording required both tiers to be run over the same input and compared *before\nany stage* could be cheapened. Nobody ever ran it. So by the letter of this\nfile nothing was ever allowed on a cheap model, and a Windows session drove\n~20 Etsy browser steps on Opus with `browser-hand` (haiku) sitting unused. **A\nrule that says no in every real case is not a safety measure, it is a dead\nrule.**\n\nSo, instead: **run the comparison once, over one real job. If the outputs\nmatch, clerical work goes to the cheap model from then on and needs no further\npermission.** Not once per stage — once, and the question is settled.\n\n**Settled is not permanent.** Her point, 5 Sep 2026: *\"it could change — we\nmight find that the cheaper one is not as good going forward.\"* So the\nsettlement is revocable, and revoking it needs no second comparison and no\nmeeting. **One real miss reopens it.** A cheap stage caught passing something\nthe good model would have refused sends that stage back to the expensive model\non the spot, and the date and what it missed get written into this section. If\na defect reaches a built PDF or a live listing and a cheap model touched that\nstage, that is the evidence — do not wait to be told, and do not argue that the\nstage was probably fine. The cost of being wrong here is a one-star review; the\ncost of over-reverting is about a dollar.\n\n✅ **RUN 5 Sep 2026. The first stage tested FAILED, and was reverted the same\nday.** The 12 adversarial verifiers of the colouring-book review were moved to\nHaiku at low effort. **6 of the 12 failed outright** — *\"Output does not match\nrequired schema: /verdicts\"*. Not worse judgement: no output at all.\n\nThe failure was worse than the rubber-stamping this rule watches for, because\nit is **silent**. `pipeline()` drops a failed item to `null`, so those six\ndimensions reached the synthesis stage carrying no verification at all, and\nnothing in the result said so — the synthesis reads as though everything had\nbeen checked. A rubber-stamp at least leaves a verdict you can go back and\nre-read. A dropped item leaves a hole shaped exactly like success.\n\nSo the US$10.75 saving on that stage **is not available at this quality**. What\ngeneralises is not \"Haiku is bad\". It is that **a stage which must emit\nstructured output against a schema is not clerical work, however clerical its\nsubject sounds.** Counting characters in a chat reply is clerical. Emitting 40\nschema-valid objects is a different job, and it is where the cheap tier broke.\n\n✅ **SECOND RUN, SAME DAY, DIFFERENT STAGE — HAIKU FAILED THIS ONE TOO, in a\ncompletely different way.** Stage: verifying that every claim in a 198-line\nplan is traceable to a source file in this repo. Identical prompt, identical\ninput, both told to *\"default to REFUTED or NOT FOUND when you cannot verify\"*.\n\n| | Haiku 4.5 | Opus 5 |\n|---|---|---|\n| Claims checked | 24 | **78** |\n| CONFIRMED | 24 | 56 |\n| REFUTED | 0 | **2** |\n| NOT FOUND | 0 | **20** |\n\nHaiku checked under a third of the claims, confirmed every one it looked at,\nand concluded: *\"Every factual claim in frame_v1.md — every number, date,\nprice, count, and direct quotation — matches source text.\"*\n\n**That sentence was false, and it is the whole finding.** It silently skipped\nan eight-claim section in which NOT ONE claim was traceable to any artefact in\nthe repo, skipped every derived number, and missed two real errors Opus caught\n— an internally inconsistent price table, and a \"widest observed gap\" claim the\nsource directly contradicts.\n\n**Note what did NOT happen: Haiku never marked anything REFUTED that Opus\nconfirmed.** It failed entirely in the dangerous direction. It chose a subset\nit could verify, verified it correctly, then generalised the verdict to the\nwhole document. Every individual verdict it gave was right. The summary was a\nlie, and the summary is what a reader acts on.\n\n**This is the rubber-stamp failure this rule was written to catch**, and it is\nworse than the schema failure above in one respect: the schema failure left a\nvisible hole, and this one left a confident green tick.\n\nSo **claim verification stays on the expensive model.** Do not re-open it\nwithout a new measurement.\n\n**What the two runs together establish.** Both stages sounded clerical. Both\nwere given the cautious instruction. Both failed, by unrelated mechanisms —\none emitted nothing, one emitted false completeness. The pattern is not \"Haiku\nis bad at X\". It is that **\"this task sounds mechanical\" keeps being wrong,\nwhich is exactly the condition Rachie attached when she approved the rule.**\nThe burden of proof on going cheaper is now higher than it was this morning,\nand the only clerical claims still standing untested are counting characters,\ncounting tags and comparing two lists.\n\nWhat the comparison looks for is **asymmetric**. Two disagreements are not\nequally bad:\n\n    cheap REFUTES what the good model CONFIRMED   costs a true finding. Annoying.\n    cheap CONFIRMS what the good model REFUTED    ships a false one. This is the\n                                                  one that reaches a buyer.\n\nCount the second kind. **One of those and that stage goes back to the expensive\nmodel permanently, whatever it saves.** A cheap model told \"default to REFUTED\nwhen unsure\" fails by being agreeable, not by being harsh.\n\n### Which tier\n\n- **No model at all — always try this first.** Counting pages, measuring\n  contrast, hashing, grepping, rendering a PDF, checking a file exists. These\n  are `$P` scripts and Bash: exact, and free. The rule was written after a run\n  spawned **35 subagents on the strongest model**, several of which only\n  counted pages or re-read a JSON file. Most of those belonged here, on no\n  model at all — the fix for that waste is not \"use cheap models more\", it is\n  \"stop spawning agents for things a script answers\".\n- **Cheap model — anything with a checkable answer.** \"Is this cited number\n  really in the file.\" \"Does this string appear in these 39 PDFs.\" \"List every\n  listing on this page.\" \"Do these two lists match.\" The result can be checked\n  against the artefact, so a worse model cannot quietly degrade the work. Pass\n  `model: \"haiku\"` to the Agent tool, **low effort, not none** — \"is this claim\n  supported by this row\" is a shade more than mechanical.\n- **Strong model — everything else, and anything you are unsure about.**\n  Finding the problem. Choosing the words a buyer will search. Writing the\n  prompt that spends money. Scoring a product against the QA rules. Reading a\n  market capture. An adversarial review whose job is to refute a passing\n  verdict. **If you are weighing whether a task qualifies as clerical, it does\n  not.**\n- **Never cheapen the stage that writes the deliverable.** Tiering the four\n  synthesis agents saved US$2.69 and risked the prompt that spends the artwork\n  budget and the tags that decide whether the listing is ever found. Refused on\n  those grounds, 5 Sep.\n- **The failure mode to fear is a lazy verifier rubber-stamping**, not one that\n  over-refutes. Tell it to default to REFUTED when it cannot verify, and have\n  the expensive model re-derive anything that ships — counts of the title, the\n  13 tags and the 30 motifs are re-counted at the reconcile stage even though a\n  verifier already counted them.\n\n**Why the quality condition is not boilerplate here.** This shop's defects are\nall judgement failures that looked mechanical: a page count that disagreed with\nthe copy, an answer key listing words that were not in the grid, \"ring me\" with\nno name and no number on an emergency page. Every one would pass a cheap check\nand cost a one-star review.\n\n### What it actually costs\n\nMeasured on this repo, not assumed — 6 review agents over the colouring-book\nbrief: 573k cache-write + 4.86M cache-read + **27.7k output**. So\n\n    reading the files   ~90% of the bill\n    writing the answer  ~10%\n\nwhich inverts the usual instinct. **Dropping a model tier saves real money;\nswitching thinking off saves almost nothing**, because thinking is output and\noutput is a tenth of the total. Suppress thinking on clerical stages anyway —\nit is her rule and it costs nothing to honour — but do not expect it in the bill.\n\nRates per million tokens: Opus 5 $5/$25 · Sonnet 5 $2/$10 · Haiku 4.5 $1/$5.\nHaiku is exactly 5x cheaper than Opus, Sonnet 2.5x. One Opus agent over this\nbrief measured **US$1.12**. Applied as above, the 30-agent colouring-book review\ncosts **~$23 instead of ~$34** — 12 of the 30 agents are the clerical ones.\n\n**Wall-clock is core count, not model choice.** This Mac has 8 cores and the\nworkflow cap is cores-minus-2, so **6 agents run at once**, not 30. A 30-agent\nworkflow is five waves: budget 25-35 minutes, not the 10 it looks like. Picking\na cheaper model does not make it finish sooner.\n\n## A second AI reviews the work — floor 70%, and it is counted\n\n✅ **PRE-AUTHORISED 6 Sep 2026: use the STRONGEST model, no asking, for three\nkinds of review.** Anything a **buyer** will read. Anything that **spends\nmoney**. Anything about **how Claude or this system itself should work**.\nEverything else goes on the standard tier.\n\nThis lifts the 10-cent stop in the spend rules for those three only. She said\nyes after seeing what the difference bought: `gpt-5.2-pro` cost **US$0.18** on\none listing and caught reviewer process notes — \"GPT-5 recommended…\" — sitting\ninside the buyer-facing copy, which three cheaper rounds had each walked past.\n\n**The routing is CODE, in `ask_review.tier_for()`, not a sentence here.** This\nfile's own record is that a rule written only in markdown does not hold. Change\nthe routing there. Do not restate the keyword list in this file.\n\n⛔ **AND THE PRE-AUTHORISATION IS CAPPED AT US$0.25 A CALL. Her decision,\n6 Sep 2026, chosen from four options after she asked \"so did you spend money or\nnot\".** The session had spent US$1.31, and US$1.11 of it was ONE call to\n`gpt-5.5-pro` that nobody had priced before running it. The pre-authorisation\nabove had no ceiling, so \"use the strongest model\" could mean one cent or a\ndollar and nothing in between caught it.\n\n**The cap is `CAP_USD` in `ask_review.py`, enforced before the call, not after.**\nA total measured afterwards is a receipt, not a gate. `ceiling()` prices the\nworst case from the prompt in hand and hands OpenAI a `max_output_tokens`, so\nthe limit is the provider's job. Refusals are logged too. Prove it still works:\n\n    python3 ask_review.py --selftest    # 16 checks, offline, bills nothing\n\n⚠ **Two consequences, stated because they change what you get, not buried.**\nFirst, **`TOP` is no longer `gpt-5.5-pro`** — a real pro review measures ~$1.12,\nso routing buyer work there would refuse every review and deliver nothing. TOP is\nnow `gpt-5.5`, the strongest model that fits her cap. That is a recorded model\nchange, not a silent one. Second, **a pro model now needs her yes**, passed as\n`review(..., models=(TOP_PRO, GEMINI), allow_usd=1.20)`. `allow_usd` is RACHIE'S\nfigure. A session setting it to get its own call through is the exact failure the\ngate exists to stop.\n\n✅ **THE RATES ARE NOW VERIFIED — 10 Sep 2026, read off\ndevelopers.openai.com/api/docs/pricing that day.** ~~The dollar figures rest on\nUNVERIFIED rates... Fix the rates before trusting the cap to the cent.~~ Struck,\nnot deleted: it was true when written, and it named the right risk.\n\n⛔ **FOUR OF THE FIVE OLD RATES WERE TOO LOW, AND THE CAP WAS THE CASUALTY.**\n`gpt-5.5` was priced at $1.25/$10.00 against a real $5.00/$30.00 — a **3x**\nunderstatement. `gpt-5.5-pro` was 2x out, `gpt-5.2-pro` and `gpt-5.2` 1.4x. Only\nplain `gpt-5` was right. Because `ceiling()` prices the worst case from that\ntable, **a call approved as 25 cents could really bill up to a dollar. The\nUS$0.25 cap has never enforced the number Rachie set.**\n\n⛔ **EVERY `usd_estimate` IN `qa/review_costs.jsonl` WRITTEN BEFORE 10 Sep 2026\nUNDERSTATES WHAT WAS BILLED.** Recomputed at the real rates, the 13 logged\nOpenAI calls cost **~US$2.47, not the ~US$1.47 the log claims**; an ordinary\n`gpt-5.5` review was **~5.7c, not ~1.9c**. Old rows are left as written — they\nwere honest at the time and carry `UNVERIFIED` — but **do not sum them and quote\nthe total as spend.** Rows written after this date carry\n`VERIFIED 2026-09-10 openai pricing page`.\n\n⚠ **AND THE DEFAULT MODEL MOVED, forced by the correction rather than chosen.**\nAt its real price `gpt-5.5` needs ~US$0.28 for a full answer, so this file could\nno longer run its own default under her cap. `TOP` and `STD` are now\n**`gpt-5.6-sol`** ($4/$20, ~US$0.19 for the same answer). That needed no decision\nfrom her because `SHARED_RULES.md` already named sol the default on 8 Sep and\nonly the code had not caught up — her 9 Sep ruling, the newer rule wins. **The\ncap itself did not move.** `python3 ask_review.py --selftest` passes 16 checks\nafter the change, and the two cases that had encoded the wrong price as an\nexpectation were corrected, with the reason written beside each.\n\n⚠ **Still not checked, and it is the only thing that would settle this to the\ncent: her OpenAI billing dashboard.** The card and the bill can disagree.\n\n⚠ Also measured that day: five review rounds had run on plain `gpt-5` because\nnobody had listed what the key could reach. It reaches 125 models. **Check the\nmodel list before assuming you are on the best one.**\n\n⛔ **DO NOT RUN THE CHEAP-VERSUS-STRONG COMPARISON YET. Decided 6 Sep 2026.**\nThe rule above says a stage may only drop a tier after both tiers have been run\nover the same input and compared. Asked how to run that comparison, gpt-5.2 and\ngemini-3.1-pro-preview agreed on the method — test citation-checking first, make\nboth models answer PASS or FAIL as the first word so a script can compare them,\nand require ZERO cases of cheap confirming what strong refuted — but they split\non the sample size (60 paired samples versus 30) and, more importantly, Gemini\nsaid not to run it at all: *\"Testing models to save ninety cents per task\ndistracts you from the reality that twenty-nine of your products lose money.\"*\nThe arithmetic agrees. Measured review spend for a heavy session is well under\n$2, only stages B/C/D may be cheapened at all, and the cheap tier is 5x cheaper,\nso **the ceiling on the saving is roughly 60 cents a session** against hours of\nsetup — and the downside is a false finding reaching a buyer.\n**So: everything stays on the strong model. `ask_review.py` now logs the cost of\nevery call to `qa/review_costs.jsonl`. Revisit only when a month of that log\nshows a number worth chasing.** Do not re-propose this before then.\n\n⛔ **THE FREE PATH IS THE DEFAULT NOW. HER DECISION, 6 Sep 2026, after she\nasked \"why would you ask gpt on api calls\".** There was no good answer. Her\nspend rules already said to prefer the browser bridge because it costs nothing,\nand a whole session used the paid API anyway because a script is easier to write\nthan a browser is to drive. **Measured that day on her own Pro account:**\n\n| | Free — her ChatGPT Pro, through Chrome | Paid — this API key |\n|---|---|---|\n| Best model reachable | **GPT-6 Astra** | gpt-5.5 |\n| Cost per review | **$0** | ~1c, or $1.11 on the pro model |\n\n**So the paid path was a generation BEHIND as well as dearer.** Ask through\nChrome, on GPT-6 Astra, with the power dial at Extra High. Print the exact\nprompt so the round is verbatim and comparable:\n\n    python3 ask_review.py --brief \"<subject>\" @path/to/body.md\n\n⚠ **`ask_review.py` is now the FALLBACK, for when that Chrome is unreachable.**\nIts `review()` refuses to make a paid call without `why_not_browser=\"<a real\nsentence>\"`, which is written into `qa/review_costs.jsonl` beside the charge. A\nGemini-only call needs no excuse — Vertex runs on her cloud credit, and that is\nnot what she objected to. The browser cannot be driven from Python, so this is\nthe only enforcement a file can carry; the rest is the session choosing honestly.\n\n⚠ **Two costs of the free path, so nobody is surprised.** It needs the WINDOWS\nPC awake with Chrome open and logged in, and it cannot run unattended while she\nis at work. Those are the two things the paid API bought, and they are the only\nreasons to reach for it.\n\n**Reviews run on `gpt-5.5` / `gpt-5.5-pro` and `gemini-3.1-pro-preview`.** Measured 6 Sep 2026:\nthe OpenAI key reaches 125 models. The newest reachable and PREFLIGHTED are\n`gpt-5.5` and `gpt-5.5-pro` (April 2026). There are also `gpt-5.6-luna`, `-sol`\nand `-terra`, which answer but are named after things rather than versions;\nnothing establishes whether they outrank 5.5, so they are NOT used — guessing a\nmodel from its name is exactly how this repo has picked wrong ones before.\nFive review rounds on 6 Sep had all been run on plain\n`gpt-5` — several generations back — because nobody had listed the models. The\nupgrade was not cosmetic: `gpt-5.2` found four things on a listing that `gpt-5`\nhad passed. One `gpt-5.2` review measured 1,410 tokens in and 585 out, so it is\ncents. `gpt-5.2-pro` is NOT used without asking her first: a single call is\nestimated near or above the 10-cent line in the spend rules, and it has not been\npriced. Vertex's model list endpoint returns 404 on this project, so the Gemini\nside cannot be enumerated — `gemini-3.1-pro-preview` is confirmed reachable\nbecause the calls work.\n\n**Use `review_brief.brief()` for the prompt. Do not hand-write one.** Her\ncorrection, 6 Sep 2026: *\"I have multiple times told you for the constructive\nfeedback.\"* Three rounds in one session were run on a hand-written prompt\nsaying \"be adversarial, do not compliment it\", so they came back as pure\ndemolition and were reported to her as a run of refusals. The models were not\nthe problem; the brief was. `review_brief.py` now forces every finding to\ncarry what is wrong, what it costs, and what to do, plus what is already right\nand should be left alone. The reasoning lives in that file, not here.\n\n**And stop after the round that changes the decision.** Round 1 killed the\nidea. Rounds 2 and 3 rebuilt a thing that should not have existed and cost her\ntwo more reports. If a review says the whole approach is wrong, bring her that,\ndo not quietly start version 2.\n\nHer rule, 5 Sep 2026, chosen from four options. Two halves, and they only work\nas a pair:\n\n- **Review by default.** A job is reviewed by a DIFFERENT model unless the\n  session writes down why not. Skipping is the thing that has to be visible.\n- **Count it**, so 70% is a measured number rather than a wish.\n\n        python3 review_log.py add  --job \"...\" --by gpt-5\n        python3 review_log.py skip --job \"...\" --why \"<a real sentence>\"\n        python3 review_log.py rate          # exits 1 under 70% of the last 20\n        python3 review_log.py --self-test   # proves the gate can fail\n\n**Everything else about this rule lives in `review_log.py`'s docstring, on\npurpose** — what counts as a job, what counts as a review, why the floor is a\nrolling window and not a lifetime average. Do not restate any of it here. This\nfile's own record is that every fix which regressed had the same fact written\nin two or more places.\n\n- `skip` refuses a shrug. \"n/a\", \"not needed\", anything under 12 characters is\n  rejected, because option 2 is worthless if skipping can be made invisible.\n- Self-approval is still not a check. The reviewer is a different model from\n  the one that produced the work.\n- Both review legs work on this Mac: `ask_gpt.py` for OpenAI and Vertex/Gemini\n  via `gcloud`, with `ai_review.py` running them against each other. The fixed\n  page-review prompt is the exception and still goes through Chrome.\n- ⚠ **Nothing calls `review_log.py` for you.** There is no CI and `.git/hooks/`\n  is empty. The count is only honest if the session running the job logs it,\n  and a session that logs nothing shows up as no change rather than as a\n  failure. That is the known hole in this rule; do not paper over it.\n=======\n>>>>>>> origin/main\n\n## Experimental exposure runs — the frame comes before the channel\n\nHer project, 5 Sep 2026: an experimental social media exposure push, built to\nthe standard the top 0.001% of marketers would hold it to. This section is the\nrequired shape. It is here because the shop's real problem was thought not to be product\nquality. 🚨 **BOTH HALVES OF THAT PREMISE WERE RE-MEASURED ON 12 Sep 2026 AND\nBOTH HAVE MOVED.** ~~five live listings, five weeks, and Etsy search has sent\nzero visits, ever~~ — there are now **46 live listings**, and the shop is **#2 for\n`dementia caregiver binder`, #4 for `caregiver binder printable` and #9 for\n`aging parent care planner`** on Etsy AU, logged out, organic results.\n⛔ **So findability is no longer the named bottleneck, and a social-exposure push\ncan no longer be justified by \"nobody can find us\".** Sales are still 0, so what\nis unproven has moved to what happens AFTER someone sees the listing.\n📄 `market_research/ETSY_RANKINGS_2026-09-12.md`. The frame rules below still\nstand on their own; only their premise changed.\n\n### Build the frame first. Do not pick the channel first.\n\n**Her instruction, 5 Sep 2026, asked which channel and answered \"all of them,\nbut build the frame first.\"** So the blueprint is channel-agnostic until the\nevidence names a winner: who the buyer is, what makes them stop scrolling, what\nthe offer is, what a win looks like and how it is measured. Only then does a\nchannel get chosen, and it gets chosen **because the frame says so**, not\nbecause Pinterest is the obvious answer for printables.\n\nA plan that opens by naming a platform has skipped the work.\n\n### The two failure modes specific to this work\n\n- **Vanity metrics presented as demand.** Impressions, reach, follows and saves\n  are not sales and not even visits. This file already refuses visibility,\n  rank, carts, revi
