<!-- 23 Sep 2026, her pick: "The Workflows address forwards to Recipes, and its how-to videos appear
     there as recipe cards that play in the page." All 75 Doser cards are in Recipes under the
     "Doser workflows" tab (recipes/cards-doser.json, written by recipes_hub.py), each with its video
     playing in the card. This address only forwards now, and opens Recipes on that tab.
     publish_marketing_pages.py no longer writes this page, and recipes_hub.py leaves it alone. -->
<meta name="robots" content="noindex">
<title>Doser Workflows are in Recipes</title>
<link rel="icon" href="favicon.png" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
/* Open Recipes on the Doser workflows tab. Recipes keeps its tab in localStorage "recipesHub.tab"
   (same site, so this page can set it); if storage is blocked, Recipes simply opens on its last tab. */
try { localStorage.setItem("recipesHub.tab", "doser"); } catch (e) {}
location.replace("../recipes/");
</script>
<meta http-equiv="refresh" content="0; url=../recipes/">
