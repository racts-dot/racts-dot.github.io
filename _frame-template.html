<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- THE STARTING FRAME FOR A NEW APP. Copy this file, then write the page.
     Nothing below the <main> is optional: it is the frame every app on this
     site carries, and it is ONE tag because on 23 Sep 2026 the 23 live apps
     were each hand-listing 5 to 10 kit tags in a different order, in three
     different path styles, with four apps silently missing the dock. -->

<!-- 1. The viewport line. Without viewport-fit=cover the frame stops at the
        notch on a phone, and the dock sits above the home bar. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- 2. The colour the phone paints its status bar and the page background.
        Both, and matching, or a home-screen app shows a white band. -->
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">

<title>New app</title>

<style>
  /* 3. The frame's own layout. Everything here is about the CONTAINER, never
        about what the app puts inside it. */
  :root{
    --bg:#faf8f5; --ink:#14110e; --muted:#6b6257; --line:#e4ded4; --accent:#1f6f5c;
    /* MEASURED 23 Sep 2026 in kit-dock.js line 121: once the dock knows its own
       height it sets body padding-bottom itself, inline and !important, and
       re-measures on resize and rotation. So this floor is only what holds the
       last line clear in the seconds BEFORE the dock exists, or if it never
       loads at all. Do not build a dock-height variable on top of it: there
       isn't one, and a page that assumed there was would clear nothing. */
    --dock-floor:76px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14110e; --ink:#f2ede5; --muted:#a79c8d; --line:#2c2620; --accent:#5fd0b0;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14110e; --ink:#f2ede5; --muted:#a79c8d; --line:#2c2620; --accent:#5fd0b0;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}          /* let Aa resize, not the phone */
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    /* 16px side gutter on a phone, and the notch and home bar respected. */
    padding:
      calc(env(safe-area-inset-top) + 12px)
      calc(env(safe-area-inset-right) + 16px)
      calc(env(safe-area-inset-bottom) + var(--dock-floor))
      calc(env(safe-area-inset-left) + 16px);
    overflow-x:hidden;                          /* no sideways page scroll */
  }
  main{max-width:44rem; margin:0 auto}          /* one measure on a wide screen */
  h1{font-size:1.9rem; line-height:1.2; margin:.2em 0 .3em}
  a{color:var(--accent)}
  img,video,table{max-width:100%}
</style>
</head>
<body>

<main>
  <h1>New app</h1>
  <p>Write the app here. Do not add kit buttons, a bottom bar, or clearance
     padding of your own — the frame below brings all of it.</p>
</main>

<!-- 4. THE FRAME. One tag. It brings Aa, Read aloud, Hear-the-selection, the
        mic, swipe, pull-to-refresh, Notion, highlights and notes, and the dock
        they sit in, in a fixed order with one cache stamp.

        data-app       the name feedback and marks are filed under in Notion
        data-swipe-*   what swipe should move through (select / links /
                       sections / pages); leave all of them out and the page
                       gets the swipe HINT only
        data-speak="icon-only"   small Read-aloud button
        data-notion="quiet"      no Notion chip until it is needed
        data-omit="notion,marks" leave pieces out ON PURPOSE — and say why in
                       status/app_frame_check.py, or the check fails.

        Full list and the reasons: frame.js -->
<script src="/frame.js" data-app="New app" defer></script>

</body>
</html>
