<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="favicon.png" sizes="any"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>Shop Pages</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--border:#2a2e38;--text:#e8e9ed;--muted:#8b8f9b;--accent:#6c8cff;--ok:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 14px 120px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:23px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px;line-height:1.45}
.sub a{color:var(--accent)}
input[type=search]{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;margin-bottom:12px}
.prod{background:var(--card);border:2px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
.prod.has{border-color:#2f6b47}
.phead{padding:12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.ptitle{flex:1;font-weight:600;font-size:15px;line-height:1.3}
.ptitle small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:3px}
.badge{background:var(--ok);color:#0f1115;border-radius:999px;padding:3px 9px;font-weight:800;font-size:12px}
.pbody{display:none;padding:0 12px 12px}
.prod.open .pbody{display:block}
.eds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ed{padding:7px 11px;border-radius:999px;border:1px solid var(--border);background:#1d2029;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer}
.ed.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tools{display:flex;gap:8px;margin-bottom:10px}
.small{padding:7px 11px;border-radius:9px;border:1px solid var(--border);background:#222633;color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.th{position:relative;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#fff;cursor:pointer}
.th img{width:100%;display:block;aspect-ratio:var(--ar,0.707)}
.th .n{position:absolute;left:4px;bottom:4px;background:rgba(15,17,21,.8);color:#fff;font-size:11px;padding:1px 6px;border-radius:6px}
.th.on{border-color:var(--ok)}
.th .ck{position:absolute;right:4px;top:4px;display:none;align-items:center;gap:3px;background:var(--ok);color:#0f1115;border-radius:8px;padding:2px 3px;font-weight:800;font-size:12px}
.th.on .ck{display:flex}
.ck button{width:22px;height:22px;border:none;border-radius:6px;background:#0f1115;color:#fff;font-weight:800;font-size:14px;line-height:1;padding:0;cursor:pointer}
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,21,.96);border-top:1px solid var(--border);padding:10px 64px calc(10px + env(safe-area-inset-bottom)) 14px;display:flex;gap:8px;align-items:center;z-index:40}
.dock span{font-size:13px;color:var(--muted);margin-right:auto}
.dock button{padding:12px 16px;border-radius:11px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.dock button.ghost{background:#222633;border:1px solid var(--border)}
.dock button:disabled{opacity:.5}
.empty{color:var(--muted);padding:30px 0;text-align:center}
</style>
<script src="../textsize.js"></script><script src="../feedback.js" defer></script>
<script src="../kit-dock.js?v=fold1" defer></script>
<script src="../pull.js" defer></script><script src="../hearsel.js" defer></script>
<script src="../swipe-hint.js" defer></script>
</head>
<body>
<div class="wrap">
  <h1>Shop Pages</h1>
  <div class="sub">Every PDF you sell. Open a product, tick the pages you need (tap + for more copies), then <b>Make PDF</b>. For the care kits by section and question, use <a href="./">Care Pages</a>.</div>
  <input type="search" id="q" placeholder="Search a product…" aria-label="Search">
  <div id="list"></div>
</div>
<div class="dock">
  <span id="summary">0 pages ticked</span>
  <button class="ghost" id="clear">Clear</button>
  <button id="make">Make PDF</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js" integrity="sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI" crossorigin="anonymous"></script>
<script>
(function(){
  // Where the PDFs and page pictures live (Cloudflare R2 public bucket). ?base= overrides it for testing.
  var BASE=(new URLSearchParams(location.search).get("base"))||"https://PENDING-R2-URL/";
  if(BASE.slice(-1)!=="/") BASE+="/";
  var KEY="shoppages.v1", C=null, S={sel:{},ed:{},open:{}};
  try{ var s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.sel) S=s; }catch(e){}
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function short(t){ return t.split(/[,|]/)[0].trim(); }
  function edName(n){ return n.replace(/\.pdf$/i,"").replace(/_/g," "); }
  function k(pid,fi,pg){ return pid+"|"+fi+"|"+pg; }
  function countFor(pid){ var n=0; for(var x in S.sel) if(x.indexOf(pid+"|")===0) n+=S.sel[x]; return n; }
  function total(){ var n=0; for(var x in S.sel) n+=S.sel[x]; return n; }
  function render(){
    var q=$("q").value.trim().toLowerCase();
    var ps=C.products.filter(function(p){ return !q||p.title.toLowerCase().indexOf(q)>=0||p.files.some(function(f){return f.name.toLowerCase().indexOf(q)>=0;}); });
    $("list").innerHTML=ps.length?ps.map(function(p){
      var fi=S.ed[p.id]||0, f=p.files[fi]||p.files[0], c=countFor(p.id), open=!!S.open[p.id], pages="";
      if(open){ for(var i=1;i<=f.pages;i++){ var kk=k(p.id,fi,i), n=S.sel[kk]||0;
        pages+='<div class="th'+(n?' on':'')+'" data-k="'+kk+'" style="--ar:'+(f.w/f.h)+'"><img loading="lazy" alt="Page '+i+'" src="'+BASE+'thumb/'+p.id+'/'+fi+'/'+i+'.jpg"><span class="n">'+i+'</span>'+
          '<span class="ck"><button data-d="-1" aria-label="Fewer">−</button>×'+n+'<button data-d="1" aria-label="More">+</button></span></div>'; } }
      return '<div class="prod'+(open?' open':'')+(c?' has':'')+'" data-p="'+p.id+'"><div class="phead"><div class="ptitle">'+esc(short(p.title))+'<small>'+p.files.length+' file'+(p.files.length>1?'s':'')+' · '+p.files.reduce(function(a,b){return a+b.pages;},0)+' pages</small></div>'+(c?'<span class="badge">'+c+'</span>':'')+'</div>'+
        '<div class="pbody"><div class="eds">'+p.files.map(function(g,j){return '<span class="ed'+(j===fi?' on':'')+'" data-fi="'+j+'">'+esc(edName(g.name))+'</span>';}).join("")+'</div>'+
        '<div class="tools"><button class="small" data-all="1">Tick all pages</button><button class="small" data-all="0">Untick all</button></div><div class="grid">'+pages+'</div></div></div>';
    }).join(""):'<div class="empty">Nothing matches.</div>';
    var t=total(); $("summary").textContent=t+(t===1?" page":" pages")+" ticked";
  }
  $("q").addEventListener("input",render);
  $("list").addEventListener("click",function(e){
    var pr=e.target.closest(".prod"); if(!pr) return; var pid=pr.getAttribute("data-p");
    var p=C.products.filter(function(x){return String(x.id)===pid;})[0], fi=S.ed[pid]||0;
    if(e.target.closest(".phead")){ S.open[pid]=!S.open[pid]; }
    else if(e.target.closest(".ed")){ S.ed[pid]=+e.target.closest(".ed").getAttribute("data-fi"); }
    else if(e.target.closest("[data-all]")){ var on=e.target.closest("[data-all]").getAttribute("data-all")==="1", f=p.files[fi];
      for(var i=1;i<=f.pages;i++){ var kk=k(pid,fi,i); if(on) S.sel[kk]=S.sel[kk]||1; else delete S.sel[kk]; } }
    else if(e.target.closest("[data-d]")){ var th=e.target.closest(".th"), kk=th.getAttribute("data-k"), d=+e.target.closest("[data-d]").getAttribute("data-d");
      var n=(S.sel[kk]||0)+d; if(n<=0) delete S.sel[kk]; else S.sel[kk]=Math.min(60,n); }
    else if(e.target.closest(".th")){ var kk2=e.target.closest(".th").getAttribute("data-k"); if(S.sel[kk2]) delete S.sel[kk2]; else S.sel[kk2]=1; }
    else return;
    save(); render();
  });
  $("clear").onclick=function(){ if(total()&&confirm("Untick every page?")){ S.sel={}; save(); render(); } };
  $("make").onclick=async function(){
    var keys=Object.keys(S.sel); if(!keys.length){ alert("Tick some pages first."); return; }
    var b=$("make"); b.disabled=true; b.textContent="Making…";
    try{
      // keep the order: product as listed, then file, then page number
      var order={}; C.products.forEach(function(p,i){order[p.id]=i;});
      keys.sort(function(a,c){ var x=a.split("|").map(Number), y=c.split("|").map(Number); return (order[x[0]]-order[y[0]])||(x[1]-y[1])||(x[2]-y[2]); });
      var out=await PDFLib.PDFDocument.create(), cache={};
      for(var i=0;i<keys.length;i++){
        var part=keys[i].split("|"), p=C.products.filter(function(x){return String(x.id)===part[0];})[0], f=p.files[+part[1]], src=cache[keys[i].slice(0,keys[i].lastIndexOf("|"))];
        if(!src){ var r=await fetch(BASE+"pdf/"+p.id+"/"+encodeURIComponent(f.name)); if(!r.ok) throw new Error("Could not load "+f.name+" ("+r.status+")");
          src=cache[keys[i].slice(0,keys[i].lastIndexOf("|"))]=await PDFLib.PDFDocument.load(await r.arrayBuffer(),{ignoreEncryption:true}); }
        for(var c=0;c<S.sel[keys[i]];c++){ var pg=await out.copyPages(src,[+part[2]-1]); out.addPage(pg[0]); }
      }
      var blob=new Blob([await out.save()],{type:"application/pdf"}), url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download="my-pages.pdf"; a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
      window.__lastPdfPages=out.getPageCount();
    }catch(err){ alert("Sorry - "+err.message); }
    b.disabled=false; b.textContent="Make PDF";
  };
  fetch(BASE+"catalog.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){ C=d; render(); })
    .catch(function(){ $("list").innerHTML='<div class="empty">The PDFs are not online yet. They are being moved to Cloudflare storage.</div>'; });
})();
</script>
<script src="../speak.js" defer></script>
</body>
</html>
