<script>
/* Opened from the Recipes home as page/#find=Title: put the title in this page's own search box
   and bring the first match into view, opened if it folds. */
(function(){
  var m = location.hash.match(/^#find=(.+)$/); if(!m) return;
  var want = decodeURIComponent(m[1]);
  function go(tries){
    var q = document.getElementById("q");
    if(q){ q.value = want; q.dispatchEvent(new Event("input", {bubbles:true})); }
    setTimeout(function(){
      var low = want.toLowerCase(), hit = null;
      document.querySelectorAll("details, article, .card, section, li").forEach(function(el){
        if(!hit && el.offsetParent !== null && (el.textContent || "").toLowerCase().indexOf(low) >= 0 && el.textContent.length < 20000) hit = el;
      });
      if(!hit){ if(tries < 10) setTimeout(function(){ go(tries + 1); }, 300); return; }
      var d = hit.closest("details") || (hit.tagName === "DETAILS" ? hit : null); if(d) d.open = true;
      var btn = hit.querySelector("button[aria-expanded='false']"); if(btn) btn.click();
      hit.scrollIntoView({block:"start"}); window.scrollBy(0, -60);
    }, 250);
  }
  if(document.readyState === "complete") go(0); else window.addEventListener("load", function(){ go(0); });
})();
</script>

<style>
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16140F; --card:#1E1B15; --card2:#26221B;

  --line:#302B22; --line2:#433D31;
  --burnt:#E08B57; --burnt-soft:#2C1E14; --on-burnt:#1A150F;
  --ok:#77C79C;

:root[data-theme="dark"]{
  --paper:#16140F; --card:#1E1B15; --card2:#26221B;
  --ink:#EFEBE1; --ink2:#CFC8BA; --muted:#9C9385; --faint:#7C7466;
  --line:#302B22; --line2:#433D31;

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;
 -webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:var(--burnt)}
:focus-visible{outline:2px solid var(--burnt);outline-offset:2px;border-radius:5px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}

.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline;padding:12px 0 7px}

.tally{color:var(--muted);font-size:11.5px}
@media (max-width:640px){.tally{font-size:11px;line-height:1.35}}
.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;padding-bottom:10px}
@media (max-width:640px){
  .controls{grid-template-columns:1fr 1fr;gap:7px}
  .ctl.search{grid-column:1 / -1}
}
.ctl{display:flex;flex-direction:column;min-width:0}
.ctl label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ctl input,.ctl select{width:100%;padding:7px 9px;border-radius:8px;font-size:13.5px;
 border:1px solid var(--line2);background:var(--card)}
.ctl select{cursor:pointer;padding-right:22px;
 appearance:none;-webkit-appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
 background-position:calc(100% - 13px) 55%, calc(100% - 9px) 55%;
 background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.ctl input::placeholder{color:var(--faint)}
.ctl input.on,.ctl select.on{border-color:var(--burnt);box-shadow:inset 0 0 0 1px var(--burnt)}
.resbar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 0 9px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.resbar b{color:var(--ink);font-weight:500}

.cards{display:flex;flex-direction:column;gap:7px;padding:12px 0 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
 box-shadow:var(--shadow);overflow:hidden}
.card-h{display:flex;gap:9px;align-items:center;padding:11px 13px;width:100%;cursor:pointer}
.card-h:hover{background:var(--card2)}
.chev{flex:none;width:13px;color:var(--faint);font-size:11px;line-height:1;
 transition:transform .16s ease;transform:rotate(0deg)}
.card.open .chev{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.card-n{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:15.5px;
 letter-spacing:-.005em;flex:1;min-width:0;line-height:1.3}
.card-w{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);white-space:nowrap}
.card:not(.open) .prompt,.card:not(.open) .row2{display:none}
.hcopy{flex:none;padding:5px 11px;border-radius:7px;border:1px solid var(--line2);
 background:var(--card2);font-size:12px;font-weight:500;color:var(--ink)}
.hcopy:hover{border-color:var(--burnt);color:var(--burnt)}
.hcopy.done{background:var(--ok);border-color:var(--ok);color:var(--card)}
.bulk{display:flex;gap:12px;align-items:baseline;margin-left:auto;white-space:nowrap}
.bulk button{font-size:12px;color:var(--burnt);text-decoration:underline;
 text-underline-offset:2px}
.prompt{margin:0 13px 0;padding:13px 14px;background:var(--card2);
 border:1px solid var(--line);border-radius:9px;
 font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.62;
 color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 13px 12px}
.copy{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;
 background:var(--burnt);color:var(--on-burnt);font-size:13px;font-weight:500;border:1px solid var(--burnt)}
.copy:hover{filter:brightness(1.07)}
.copy.done{background:var(--ok);border-color:var(--ok)}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;
 text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--card2);
 color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.src{margin-left:auto;font-size:11.5px;color:var(--faint);text-align:right;min-width:0}
.src a{text-decoration:none;border-bottom:1px solid var(--line2)}
.src{line-height:1.75;max-width:300px}
.src b{color:var(--burnt);font-weight:600}
.empty{padding:60px 10px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--faint);border-top:1px solid var(--line);
 padding:14px 0 0;margin-top:8px;line-height:1.6}

<script>
(function(){
"use strict";
var P=JSON.parse(document.getElementById('data').textContent);
var S={q:"",tool:"",sort:"long"};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

(function(){
  var m={};P.forEach(function(x){x.t.forEach(function(t){m[t]=(m[t]||0)+1;});});
  document.getElementById('tool').innerHTML='<option value="">Any tool</option>'+
   Object.keys(m).sort(function(a,b){return m[b]-m[a];}).map(function(k){
     return '<option value="'+esc(k)+'">'+esc(k)+' ('+m[k]+')</option>';}).join('');
})();

function list(){
  var q=S.q.trim().toLowerCase();
  var out=P.filter(function(x){
    if(S.tool && x.t.indexOf(S.tool)<0) return false;
    if(q && (x.p+' '+x.n+' '+x.src.map(function(s){return s.v;}).join(' ')).toLowerCase().indexOf(q)<0) return false;
    return true;});
  return out.sort({long:function(a,b){return b.w-a.w;},
                   short:function(a,b){return a.w-b.w;},
                   new:function(a,b){return (b.src[0].y||'').localeCompare(a.src[0].y||'');},
                   most:function(a,b){return b.src.length-a.src.length;},
                   az:function(a,b){return (a.n||'').localeCompare(b.n||'');}}[S.sort]);
}
function draw(){
  var r=list(),el=document.getElementById('cards');
  document.getElementById('count').innerHTML='<b>'+r.length+'</b> prompt'+(r.length===1?'':'s')+
    (S.q||S.tool?' matching what you asked for':' ready to copy');
  document.getElementById('q').classList.toggle('on',!!S.q.trim());
  document.getElementById('tool').classList.toggle('on',!!S.tool);
  if(!r.length){el.innerHTML='<div class="empty">Nothing matches that. Try emptying the search box.</div>';return;}
  el.innerHTML=r.map(function(x,i){
    return '<article class="card" data-card="'+i+'">'
      +'<button class="card-h" data-toggle="'+i+'" aria-expanded="false">'
      +'<span class="chev">\u25B6</span>'
      +'<span class="card-n">'+esc(x.n||'Prompt')+'</span>'
      +'<span class="card-w">'+x.w+'w</span>'
      +'<span class="hcopy" data-i="'+i+'" role="button" tabindex="0">Copy</span>'
      +'</button>'
      +'<div class="prompt" id="p'+i+'">'+esc(x.p)+'</div>'
      +'<div class="row2"><button class="copy" data-i="'+i+'">Copy</button>'
      + x.t.slice(0,3).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')
      +'<span class="src">'
      + (x.src.length>1 ? '<b>said in '+x.src.length+' videos</b><br>' : 'from ')
      + x.src.map(function(s){
          return '<a href="'+esc(s.u)+'" target="_blank" rel="noopener">'
               + esc((s.v||'').slice(0,42))+'</a> <span class="mono">'+esc(s.y||'')+'</span>';
        }).join('<br>')
      +'</span></div></article>';}).join('');
}
document.getElementById('cards').addEventListener('click',function(e){

    var txt=document.getElementById('p'+b.dataset.i).textContent;
    var was=b.textContent;
    function done(){b.textContent='Copied';b.classList.add('done');
      setTimeout(function(){b.textContent=was;b.classList.remove('done');},1400);}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,function(){fallback(txt,done);});
    } else fallback(txt,done);
    return;
  }
  var h=e.target.closest('[data-toggle]'); if(!h) return;
  var card=h.parentNode, open=card.classList.toggle('open');
  h.setAttribute('aria-expanded', open?'true':'false');
});
document.getElementById('openall').onclick=function(){
  [].forEach.call(document.querySelectorAll('.card'),function(c){
    c.classList.add('open');
    c.querySelector('[data-toggle]').setAttribute('aria-expanded','true');});};
document.getElementById('shutall').onclick=function(){
  [].forEach.call(document.querySelectorAll('.card'),function(c){
    c.classList.remove('open');
    c.querySelector('[data-toggle]').setAttribute('aria-expanded','false');});};
function fallback(t,cb){
  var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';
  document.body.appendChild(a);a.select();
  try{document.execCommand('copy');cb();}catch(e){}
  document.body.removeChild(a);
}
var qt=null;
document.getElementById('q').oninput=function(e){clearTimeout(qt);var v=e.target.value;
  qt=setTimeout(function(){S.q=v;draw();if(v.trim())document.getElementById('openall').click();},130);};
document.getElementById('tool').onchange=function(e){S.tool=e.target.value;draw();};
document.getElementById('sort').onchange=function(e){S.sort=e.target.value;draw();};

  P.length+' prompts, pulled word for word from '+
  (function(){var s={};P.forEach(function(x){x.src.forEach(function(v){s[v.u]=1;});});
   return Object.keys(s).length;})()+
  ' of Sabrina Ramonov\u2019s short videos';
document.getElementById('foot').textContent=
  'Every prompt here was copied exactly as Sabrina said it, checked word by word against the '
 +'transcript. Nothing was tidied, shortened or rewritten \u2014 including her own slips. '
 +'Read from 177 of her prompt Shorts on 10 September 2026. 116 of them read out no prompt at all. '
 +'Where she says the same prompt in more than one video, every video is credited.';
draw();
